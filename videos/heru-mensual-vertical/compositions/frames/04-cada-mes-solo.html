  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var F = 1 / 60;

      /* ── Scene 1 (0.0–1.0s) — headline whips in word by word (waterfall-entry),
            the phone rides in from the right on the current and settles. ───── */

      tl.fromTo("#f04-rule",
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, duration: 0.34, ease: "power3.out" }, 0.02);

      /* waterfall-entry: binary opacity via set + whip to rest, overlapping, one direction */
      var WORDS = [
        { id: "#f04-w1", at: 0.060, y: 72, d: 0.18 },
        { id: "#f04-w2", at: 0.273, y: 46, d: 0.15 },
        { id: "#f04-w3", at: 0.406, y: 44, d: 0.15 },
        { id: "#f04-w4", at: 0.540, y: 40, d: 0.13 },
        { id: "#f04-w5", at: 0.653, y: 48, d: 0.15 },
        { id: "#f04-w6", at: 0.770, y: 56, d: 0.16 }
      ];
      WORDS.forEach(function (w) {
        tl.set(w.id, { opacity: 1, y: w.y }, w.at);
        tl.to(w.id, { y: 0, duration: w.d, ease: "power4.out" }, w.at);
      });

      tl.fromTo("#f04-phone",
        { x: 700 },
        { x: 0, duration: 0.85, ease: "power4.out" }, 0.05);

      /* ── Scene 2 (1.0–2.4s) — blueprint signature: the 12 month cards
            self-assemble in a staggered cascade into the 4x3 grid, ENE->DIC,
            each on a short path straight into its own slot. ───────────────── */

      var cards = document.querySelectorAll("#f04-grid .f04-card");
      var GRID_AT = 1.0, GRID_STAGGER = 0.075, GRID_DUR = 0.50;
      cards.forEach(function (el, i) {
        var dx = Number(el.dataset.col) - 1.5;
        var dy = Number(el.dataset.row) - 1;
        tl.fromTo(el,
          { x: -dx * 24, y: -dy * 24, scale: 0.88, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: GRID_DUR, ease: "power3.out" },
          GRID_AT + i * GRID_STAGGER);
      });

      /* slow camera push-in under the assemble, stopping dead before the last beat */
      tl.fromTo("#f04-camera",
        { scale: 1 },
        { scale: 1.015, duration: 2.55, ease: "sine.inOut" }, 1.05);

      /* ── Scene 3 (2.4–3.6s) — second staggered pass: the "Declarado" stamp
            lands card by card; each card's border firms up as it seals. ────── */

      var STAMP_AT = 2.40, STAMP_STAGGER = 0.10, STAMP_DUR = 0.34;
      cards.forEach(function (el, i) {
        var at = STAMP_AT + i * STAMP_STAGGER;
        tl.fromTo("#f04-stamp-" + i,
          { scale: 0.62, opacity: 0 },
          { scale: 1, opacity: 1, duration: STAMP_DUR, ease: "power3.out" }, at);
        tl.to(el, { borderColor: "rgba(29,143,243,0.34)", duration: 0.40, ease: "power2.out" }, at);
      });

      /* ── Scene 4 (3.6–5.0s) — on the same frame the last stamp falls, a
            one-shot keyword glow lands on "Tu buzón está vacío" inside the
            screenshot: attack to peak, decay to a resting breadcrumb, hold. ── */

      var GLOW_AT = 3.50;
      tl.fromTo("#f04-glow",
        { opacity: 0, scale: 0.72 },
        { opacity: 0.44, scale: 1, duration: 0.34, ease: "power2.out" }, GLOW_AT);
      tl.to("#f04-glow",
        { opacity: 0.26, scale: 0.94, duration: 0.55, ease: "power2.out" }, GLOW_AT + 0.34);

      tl.fromTo("#f04-glow-pill",
        { opacity: 0 },
        { opacity: 1, duration: 0.30, ease: "power2.out" }, GLOW_AT + 0.02);
      tl.to("#f04-glow-pill",
        { opacity: 0.70, duration: 0.50, ease: "power2.out" }, GLOW_AT + 0.36);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-cada-mes-solo"] = tl;
    })();
