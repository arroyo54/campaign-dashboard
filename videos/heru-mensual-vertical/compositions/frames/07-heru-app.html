<template>
  <style>
    @font-face { font-family:'Lexend Deca'; src:url('assets/fonts/lexend-deca.woff2') format('woff2');
                 font-weight:100 900; font-style:normal; font-display:block; }

    #root { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
            font-family:'Lexend Deca', ui-sans-serif, system-ui, sans-serif;
            color:#1A1A1A; background:transparent; }

    /* ——— campo cobalto a sangre (capa .clip propia, nunca fondo del root) ——— */
    #root .f07-ground { position:absolute; inset:0; background-color:#1772C2;
                        background-image:radial-gradient(ellipse 80% 40% at 50% 44%,
                                         rgba(255,255,255,.085), rgba(255,255,255,0) 68%); }

    /* ——— atmósfera: anillos concéntricos de cierre ———
       centrados en el lockup (y=845). Los radios exceden el medio ancho del cuadro
       vertical, así que el cuadro los recorta a izquierda y derecha: se leen como
       aros que cierran desde fuera, no como dos círculos estacionados en pantalla. */
    #root .f07-ring { position:absolute; left:50%; top:845px; border-radius:50%;
                      box-sizing:border-box; opacity:0; }
    #root #f07-ring-outer { width:1460px; height:1460px; margin:-730px 0 0 -730px;
                            border:2px solid rgba(255,255,255,.10); }
    #root #f07-ring-inner { width:1200px; height:1200px; margin:-600px 0 0 -600px;
                            border:2px solid rgba(255,255,255,.16); }

    /* ——— resplandor bajo la marca ——— */
    #root #f07-glow { position:absolute; left:50%; top:800px; width:1600px; height:1600px;
                      margin:-800px 0 0 -800px; border-radius:50%; opacity:0;
                      background:radial-gradient(circle at 50% 50%,
                                 rgba(255,255,255,.16), rgba(255,255,255,0) 62%); }

    /* ——— columna de contenido ———
       padding-bottom 326px = 1920 − 1594: nada del lockup baja de la línea de exclusión. */
    #root .f07-pad { position:absolute; inset:0; padding:96px 72px 326px; box-sizing:border-box;
                     display:flex; flex-direction:column; justify-content:center;
                     align-items:center; text-align:center; }

    #root #f07-mark { opacity:0; }
    #root #f07-mark-clip { display:block; clip-path:inset(0% 50% 0% 50%); }
    /* recorte del wordmark: sólo las filas 0–1100 del PNG de 2787×1347 (la banda del
       claim queda fuera). 299 / 367 = 0.8147 < 1100/1347 = 0.8166 */
    #root #f07-mark-wrap { display:block; width:760px; height:299px; overflow:hidden; }
    #root #f07-mark-img { display:block; width:760px; height:367px; }

    #root #f07-url { margin-top:72px; opacity:0; }
    #root #f07-url-text { display:block; min-width:560px; height:88px; line-height:88px;
                          white-space:nowrap; font-size:76px; font-weight:600; color:#FFFFFF;
                          letter-spacing:-.01em; }

    #root #f07-pill { margin-top:64px; opacity:0; display:inline-block; max-width:900px;
                      padding:24px 56px; border-radius:100px; background:#FFFFFF;
                      color:#1772C2; font-size:38px; font-weight:600; line-height:1.3;
                      letter-spacing:-.005em; }
  </style>

  <div id="root" data-composition-id="07-heru-app" data-width="1080" data-height="1920">

    <div id="f07-ground" class="f07-ground clip"
         data-start="0" data-duration="4.5" data-track-index="0"></div>

    <div id="f07-ring-outer" class="f07-ring"></div>
    <div id="f07-ring-inner" class="f07-ring"></div>
    <div id="f07-glow"></div>

    <div class="f07-pad">
      <div id="f07-mark">
        <div id="f07-mark-clip">
          <div id="f07-mark-wrap"><img id="f07-mark-img" src="assets/07-logo-heru-white.png" alt="heru" /></div>
        </div>
      </div>

      <div id="f07-url"><span id="f07-url-text"></span></div>

      <div id="f07-pill">Tu primer mes va por nuestra cuenta.</div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["07-heru-app"] = tl;

      /* longitud fija del plano — el cierre se sostiene quieto hasta el final */
      tl.to({ v: 0 }, { v: 1, duration: 4.5, ease: "none" }, 0);

      /* ——— Escena 1 (0.0–1.2s) — los anillos cierran hacia dentro y la marca se forma ——— */
      tl.fromTo("#f07-ring-outer",
        { opacity: 0, scale: 3.15 },
        { opacity: 1, scale: 1, duration: 1.05, ease: "power3.out" }, 0);

      tl.fromTo("#f07-ring-inner",
        { opacity: 0, scale: 2.45 },
        { opacity: 1, scale: 1, duration: 1.02, ease: "power3.out" }, 0.08);

      tl.fromTo("#f07-glow",
        { opacity: 0 },
        { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.10);

      /* el wordmark llega a existir: aparece, enfoca y se abre desde el centro */
      tl.fromTo("#f07-mark",
        { opacity: 0, scale: 1.10, filter: "blur(16px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.92, ease: "power3.out" }, 0.10);

      tl.fromTo("#f07-mark-clip",
        { clipPath: "inset(0% 50% 0% 50%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.90, ease: "power3.out" }, 0.10);

      /* ——— Escena 2 (1.2–2.2s) — "heru.app" se construye segmento por segmento ——— */
      tl.fromTo("#f07-url",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 1.12);

      var URL_SEQUENCE = [
        { t: 0.00, text: "" },
        { t: 0.08, text: "h" },
        { t: 0.17, text: "he" },
        { t: 0.26, text: "her" },
        { t: 0.35, text: "heru" },
        { t: 0.55, text: "heru." },
        { t: 0.68, text: "heru.a" },
        { t: 0.78, text: "heru.ap" },
        { t: 0.88, text: "heru.app" }
      ];

      function urlAt(time) {
        for (var i = URL_SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= URL_SEQUENCE[i].t) return URL_SEQUENCE[i].text;
        }
        return "";
      }

      var urlEl = document.getElementById("f07-url-text");
      var urlDriver = { t: 0 };
      tl.to(urlDriver, {
        t: 1.0,
        duration: 1.0,
        ease: "none",
        onUpdate: function () {
          if (urlEl) urlEl.textContent = urlAt(urlDriver.t);
        }
      }, 1.15);

      /* ——— Escena 3 (2.2–3.2s) — la píldora blanca asienta con un pop liso y largo ——— */
      tl.fromTo("#f07-pill",
        { opacity: 0, y: 30, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.72, ease: "power3.out" }, 2.22);

      /* ——— Escena 4 (3.2–4.5s) — quietud absoluta: nada se mueve, no hay fundido ——— */
    })();
  </script>
</template>
