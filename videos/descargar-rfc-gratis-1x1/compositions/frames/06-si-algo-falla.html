  <script>
    (function () {
      var P = "06-si-algo-falla-";
      var root = document.querySelector('[data-composition-id="06-si-algo-falla"]');
      // Class lookups via getElementsByClassName: no CSS parsing, so the digit-leading
      // prefix never reaches querySelector (where "#06-…" / ".06-…" would throw).
      function all(scope, name) {
        return Array.prototype.slice.call(scope.getElementsByClassName(P + name));
      }
      function one(name) { return all(root, name)[0]; }

      var tl = gsap.timeline({ paused: true });
      var DUR = 8.5;

      // Scene windows from the storyboard block — every reveal hangs off these.
      var CARD_AT = [1.0, 3.2, 5.2];   // Scenes 2, 3, 4
      var TIP_AT = 7.2;                // Scene 5
      var SOLUTION_DELAY = 0.6;        // problem first; its solution 0.6s later

      // ——— Scene 1 (0.0–1.0) — push-slide LEFT lands; the slide-header settles.
      // Inner pieces trail the push leftward and decelerate (same direction across the seam).
      tl.fromTo(one("eyebrow"), { x: 56, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.85, ease: "power3.out" }, 0);
      tl.fromTo(one("tag"), { x: 56, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.85, ease: "power3.out" }, 0.06);

      // dynamic-content-sequencing — the headline's word schedule is reduced ONCE at build
      // from content length (no hand-placed offsets): slot = WORD_BASE + chars × SEC_PER_CHAR.
      // Word-scale entries, so WORD_BASE is a beat, not a read; SEC_PER_CHAR stays uniform.
      var WORD_BASE = 0.08, SEC_PER_CHAR = 0.03, HEAD_AT = 0.16;
      var cursor = HEAD_AT;
      var WORD_TIMELINE = all(root, "word").map(function (el) {
        var entry = { el: el, start: cursor };
        cursor += WORD_BASE + el.textContent.length * SEC_PER_CHAR;
        return entry;
      });
      WORD_TIMELINE.forEach(function (w) {
        tl.fromTo(w.el, { x: 48, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.62, ease: "power3.out" }, w.start);
      });

      // svg-path-draw setup — dash = the measured getTotalLength(). The gap and the hidden
      // offset clear the round caps (stroke 2.2) so no dot shows before the draw starts.
      var STROKE = 2.2;
      function prepDraw(path) {
        var len = path.getTotalLength();
        path.style.strokeDasharray = len + " " + (len + 3 * STROKE);
        return len + STROKE; // fully hidden offset
      }

      // ——— Scenes 2–4 — one two-beat card per window, accumulating in a vertical list.
      all(root, "card").forEach(function (card, i) {
        var at = CARD_AT[i];

        // center-outward-expansion, direct-into-slot form: no shared center; the card
        // slides a short path from the right straight into its own slot (scale + fade),
        // its right edge never leaving the canvas.
        tl.fromTo(card, { x: 90, scale: 0.92, opacity: 0 },
          { x: 0, scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" }, at);

        // the arrow draws: shaft first, both barbs from the tip at ~75% of the shaft
        var drawAt = at + SOLUTION_DELAY;
        var SHAFT_DUR = 0.28, BARB_DUR = 0.2, BARB_AT = drawAt + SHAFT_DUR * 0.75;
        all(card, "shaft").forEach(function (p) {
          tl.fromTo(p, { strokeDashoffset: prepDraw(p) },
            { strokeDashoffset: 0, duration: SHAFT_DUR, ease: "power2.out" }, drawAt);
        });
        all(card, "barb").forEach(function (p) {
          tl.fromTo(p, { strokeDashoffset: prepDraw(p) },
            { strokeDashoffset: 0, duration: BARB_DUR, ease: "power2.out" }, BARB_AT);
        });

        // the solution unrolls behind the arrow once its last stroke lands (mask-wipe)
        all(card, "answer").forEach(function (el) {
          tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", x: -10 },
            { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.55, ease: "power3.out" },
            BARB_AT + BARB_DUR);
        });
      });

      // ——— Scene 5 (7.2–8.5) — the tip rises; its blue rule grows upward with it. Then still.
      tl.fromTo(one("tip"), { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, TIP_AT);
      tl.fromTo(one("rule"), { scaleY: 0 },
        { scaleY: 1, duration: 0.55, ease: "power3.out" }, TIP_AT + 0.06);
      tl.fromTo(one("tiptext"), { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, TIP_AT + 0.12);

      // progress-bar — linear 62.5% → 75% of the width across the frame
      tl.fromTo(one("fill"), { scaleX: 0.625 },
        { scaleX: 0.75, duration: DUR, ease: "none" }, 0);
