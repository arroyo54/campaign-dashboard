        var u = stateIndex(URL_SEQ, t, first);
        urlTyped.textContent = u >= 0 ? URL_SEQ[u][1] : "";
        var suggesting = t >= T_SUGGEST;
        urlSuggest.textContent = suggesting ? URL_SUGGEST : "";
        urlSuggest.style.backgroundColor = suggesting && t < T_ENTER ? "rgba(29,143,243,0.2)" : "rgba(29,143,243,0)";
        urlCaret.style.opacity = caretOn(t, T_URL_FOCUS, T_SUGGEST, u >= 0 ? URL_SEQ[u][0] : -1) ? "1" : "0";
        // RFC field
        var r = stateIndex(RFC_SEQ, t, first);
        rfcText.textContent = r >= 0 ? RFC_SEQ[r][1] : "";
        rfcCaret.style.opacity = caretOn(t, T_RFC_FOCUS, T_TAB, r >= 0 ? RFC_SEQ[r][0] : -1) ? "1" : "0";
        // password field
        var p = stateIndex(PW_SEQ, t, self);
        var shown = p + 1;
        if (shown !== lastDots) {
          for (var d = 0; d < dots.length; d++) {
            dots[d].style.display = d < shown ? "block" : "none";
          }
          lastDots = shown;
        }
        pwCaret.style.opacity = caretOn(t, T_TAB, T_PW_BLUR, p >= 0 ? PW_SEQ[p] : -1) ? "1" : "0";
      }
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            render(driver.t);
          }
        },
        0
      );
      render(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-metodo-portal-sat"] = tl;
    })();
  </script>
</template>
