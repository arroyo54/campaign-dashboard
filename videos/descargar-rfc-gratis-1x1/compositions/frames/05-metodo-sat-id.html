  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var PFX = "05-metodo-sat-id-";
      var STAGE = document.getElementById(PFX + "stage");
      function sel(name) { return '[class~="' + PFX + name + '"]'; }
      function one(name, scope) { return (scope || STAGE).querySelector(sel(name)); }
      function all(name, scope) { return Array.prototype.slice.call((scope || STAGE).querySelectorAll(sel(name))); }

      var DUR = 9.5;
      var tl = gsap.timeline({ paused: true });

      /* ---------------- Scene 1 (0.0–1.2s): header, phone rises, rail appears dimmed ---------------- */
      // progress-bar grows linearly 50% -> 62.5% of the width across the whole frame
      tl.fromTo(one("progress"), { scaleX: 0.5 }, { scaleX: 0.625, duration: DUR, ease: "none" }, 0);

      tl.fromTo(one("eyebrow"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.04);
      tl.fromTo(one("tag"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.1);
      tl.fromTo(all("word"), { opacity: 0, y: 38 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out", stagger: 0.07 }, 0.14);

      // device-frame-stage IN, without the overshoot: one power3 rise-and-settle onto its rest pose
      tl.fromTo(one("device"), { opacity: 0, y: 30, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.95, ease: "power3.out" }, 0.06);

      // the listing "loads" onto the screen as the phone lands
      tl.fromTo(one("app-icon"), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo([one("app-name"), one("app-pub"), one("app-meta")], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.06 }, 0.48);
      tl.fromTo(one("btnwrap"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.66);
      tl.fromTo(all("shot"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.05 }, 0.74);

      // the 4-step rail arrives in its dimmed (pending) state
      var steps = all("step");
      steps.forEach(function (step, i) {
        tl.fromTo(step, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.36 + i * 0.08);
      });

      // step states: pending (outlined, light gray) -> now (solid primary, near-black 600) -> done (tint, muted)
      function lightStep(i, at) {
        var s = steps[i];
        tl.fromTo(one("c-disc", s), { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, at);
        tl.fromTo(one("c-ring", s), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, at);
        tl.fromTo(one("num", s), { color: "#767676" }, { color: "#FFFFFF", duration: 0.3, ease: "power2.out" }, at);
        // variable font: the label darkens and steps up 500 -> 600 on one layer (wrap points are stable across the range)
        tl.fromTo(one("tx", s), { color: "#767676", fontWeight: 500 }, { color: "#1A1A1A", fontWeight: 600, duration: 0.35, ease: "power2.out" }, at);
      }
      function doneStep(i, at) {
        var s = steps[i];
        tl.fromTo(one("c-disc", s), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(one("c-tint", s), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, at);
        tl.fromTo(one("num", s), { color: "#FFFFFF" }, { color: "#1772C2", duration: 0.4, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(one("tx", s), { color: "#1A1A1A", fontWeight: 600 }, { color: "#5A5A5A", fontWeight: 500, duration: 0.35, ease: "power2.out", immediateRender: false }, at);
      }

      /* ---------------- Scene 2 (1.2–3.0s) — step 1: install ---------------- */
      lightStep(0, 1.2);

      // "Obtener" -> progress ring -> "Abrir" (discrete-text-sequence: whole states at thresholds, reverse search)
      var btn = one("btn");
      var btnLabel = one("btn-label");
      var dl = one("dl");
      var T_PRESS = 1.45;
      var T_RING = 1.6;
      var T_OPEN = 2.2;
      var BTN_SEQUENCE = [
        { t: 0, state: "get" },
        { t: T_RING, state: "ring" },
        { t: T_OPEN, state: "open" }
      ];
      function btnStateAt(time) {
        for (var i = BTN_SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= BTN_SEQUENCE[i].t) return BTN_SEQUENCE[i].state;
        }
        return BTN_SEQUENCE[0].state;
      }
      function renderBtn(state) {
        btn.style.visibility = state === "ring" ? "hidden" : "visible";
        dl.style.visibility = state === "ring" ? "visible" : "hidden";
        btnLabel.textContent = state === "open" ? "Abrir" : "Obtener";
      }
      var driver = { t: 0 };
      tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { renderBtn(btnStateAt(driver.t)); } }, 0);

      // tap: the button sinks (smooth compression) and recovers without overshoot
      tl.fromTo(btn, { scale: 1 }, { scale: 0.93, duration: 0.1, ease: "power2.in" }, T_PRESS);
      tl.fromTo(btn, { scale: 0.93 }, { scale: 1, duration: 0.38, ease: "power3.out", immediateRender: false }, T_PRESS + 0.1);

      // finite progress ring: the arc fills while the ring turns once
      tl.fromTo(one("dl-arc"), { strokeDashoffset: 125.664 }, { strokeDashoffset: 0, duration: 0.56, ease: "power1.inOut" }, T_RING);
      tl.fromTo(one("dl-spin"), { rotation: 0 }, { rotation: 360, duration: 0.6, ease: "none" }, T_RING);
      // "Abrir" settles in place
      tl.fromTo(btn, { scale: 0.92 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, T_OPEN);

      // cut-the-curve (leftward): the listing accelerates out, the menu continues in from the right
      var scrA = one("scr-a");
      var scrB = one("scr-b");
      var scrC = one("scr-c");
      tl.fromTo(scrA, { x: 0 }, { x: -150, duration: 0.3, ease: "power4.in" }, 2.7);
      tl.fromTo(scrA, { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power1.in", immediateRender: false }, 2.76);

      /* ---------------- Scene 3 (3.0–4.8s) — step 2: pick the trámite ---------------- */
      doneStep(0, 3.0);
      lightStep(1, 3.0);
      tl.fromTo(scrB, { x: 150, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power4.out" }, 3.0);

      // tap ripple (cursor-click-ripple, no cursor) on "Genera tu constancia de situación fiscal"
      var opt1 = one("opt-1");
      var T_TAP = 3.82;
      tl.fromTo(opt1, { scale: 1 }, { scale: 0.97, duration: 0.09, ease: "power2.in" }, T_TAP);
      tl.fromTo(opt1, { scale: 0.97 }, { scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, T_TAP + 0.09);
      var optRips = all("opt-rip");
      gsap.set(optRips, { scale: 0, opacity: 0 });
      tl.set(optRips, { opacity: 0.85 }, T_TAP + 0.04);
      tl.to(optRips, { scale: 3.2, opacity: 0, duration: 0.62, ease: "power2.out", stagger: 0.09, immediateRender: false }, T_TAP + 0.04);

      // the option is highlighted in blue
      var T_HL = 3.9;
      tl.fromTo(opt1, { backgroundColor: "rgba(29,143,243,0.04)", borderColor: "rgba(29,143,243,0.2)" },
        { backgroundColor: "rgba(29,143,243,0.15)", borderColor: "rgba(29,143,243,0.45)", duration: 0.3, ease: "power2.out", immediateRender: false }, T_HL);
      tl.fromTo(one("opt-chev", opt1), { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power1.out" }, T_HL);
      tl.fromTo(one("opt-ok", opt1), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, T_HL + 0.06);

      tl.fromTo(scrB, { x: 0 }, { x: -150, duration: 0.3, ease: "power4.in", immediateRender: false }, 4.5);
      tl.fromTo(scrB, { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power1.in", immediateRender: false }, 4.56);

      /* ---------------- Scene 4 (4.8–7.0s) — step 3: INE + video-selfie ---------------- */
      doneStep(1, 4.8);
      lightStep(2, 4.8);
      tl.fromTo(scrC, { x: 150, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power4.out" }, 4.8);

      // the INE card appears inside its dashed frame
      tl.fromTo(one("ine-card"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 4.95);

      // one finite scan pass over the INE: down, then back up
      var ineScan = one("ine-scan");
      tl.fromTo(ineScan, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 5.2);
      tl.fromTo(ineScan, { y: 0 }, { y: 158, duration: 0.35, ease: "power1.inOut", immediateRender: false }, 5.2);
      tl.fromTo(ineScan, { y: 158 }, { y: 0, duration: 0.35, ease: "power1.inOut", immediateRender: false }, 5.55);
      tl.fromTo(ineScan, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none", immediateRender: false }, 5.9);
      tl.fromTo(one("ine-ok"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.9);
      tl.fromTo(one("ine-ok-path"), { strokeDashoffset: 23 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 5.97);

      // then the face oval, its own scan and check
      tl.fromTo(one("face-grp"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.0);
      var faceScan = one("face-scan");
      tl.fromTo(faceScan, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 6.22);
      tl.fromTo(faceScan, { y: 0 }, { y: 164, duration: 0.25, ease: "power1.inOut", immediateRender: false }, 6.22);
      tl.fromTo(faceScan, { y: 164 }, { y: 0, duration: 0.25, ease: "power1.inOut", immediateRender: false }, 6.47);
      tl.fromTo(faceScan, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none", immediateRender: false }, 6.72);
      tl.fromTo(one("face-ok"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 6.72);
      tl.fromTo(one("face-ok-path"), { strokeDashoffset: 23 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 6.79);

      /* ---------------- Scene 5 (7.0–8.6s) — step 4: it arrives by mail ---------------- */
      doneStep(2, 7.0);
      lightStep(3, 7.0);
      var notif = one("notif");
      tl.fromTo(notif, { y: -150 }, { y: 0, duration: 0.6, ease: "power3.out" }, 7.05);
      tl.fromTo(notif, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, 7.05);

      // inverse zoom-through: the validation screen recedes, the envelope arrives oversized and retracts into place
      tl.fromTo(scrC, { scale: 1, filter: "blur(0px)" }, { scale: 0.8, filter: "blur(8px)", duration: 0.2, ease: "power3.in", immediateRender: false }, 7.35);
      tl.fromTo(scrC, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none", immediateRender: false }, 7.35);
      tl.fromTo(one("mail"), { opacity: 0, scale: 1.25, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 7.55);
      tl.fromTo(one("pdf"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 7.85);

      /* ---------------- Scene 6 (8.6–9.5s): "1 a 5 días hábiles" settles, then stillness ---------------- */
      tl.fromTo(one("days"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 8.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-metodo-sat-id"] = tl;
    })();
  </script>
