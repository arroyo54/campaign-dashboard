  <script>
    (function () {
      var P = "01-te-pidieron-tu-rfc-";
      var DURATION = 5;
      var EASE = "power3.out";
      var EPS = 0.0001;

      var stage = document.getElementById(P + "stage");
      var lane = document.getElementById(P + "progress-lane");
      function one(scope, name) {
        return scope.getElementsByClassName(P + name)[0];
      }
      function all(scope, name) {
        return Array.prototype.slice.call(scope.getElementsByClassName(P + name));
      }

      var rule = one(stage, "rule");
      var eyebrow = one(stage, "eyebrow");
      var anchor = one(stage, "anchor");
      var pill = one(stage, "pill");
      var place = one(stage, "place");
      var pay = one(stage, "pay");
      var micro = one(stage, "micro");
      var progress = one(lane, "progress");

      var tl = gsap.timeline({ paused: true });

      // dynamic-content-sequencing: each word's window is pre-computed once from its
      // length (BASE + chars x SEC_PER_CHAR + optional hold), so longer words earn more time.
      var WORD_BASE = 0.07;
      var SEC_PER_CHAR = 0.012;
      function wordWindows(words, t0, holds) {
        var cumulative = t0;
        return words.map(function (el, i) {
          var start = cumulative;
          cumulative += WORD_BASE + el.textContent.length * SEC_PER_CHAR + ((holds && holds[i]) || 0);
          return { el: el, start: start };
        });
      }
      function riseWords(words, t0, holds, lift, dur) {
        wordWindows(words, t0, holds).forEach(function (w) {
          tl.fromTo(w.el, { opacity: 0, y: lift }, { opacity: 1, y: 0, duration: dur, ease: EASE }, w.start);
        });
      }

      // Scene 1 (0.0-1.1): accent line draws, eyebrow lands, the anchor builds word by
      // word and then PINS: no tween touches it again.

      tl.fromTo(eyebrow, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: EASE }, 0.12);
      riseWords(all(anchor, "word"), 0.18, [0, 0.06, 0, 0], 44, 0.5);

      // Scene 2 (1.1-2.9): the place pill arrives, then cycles in place by HARD CUT
      // (discrete-text-sequence). Width is never tweened: the pill re-fits to each
      // phrase instantly and grows to the right, away from the anchor.
      tl.fromTo(pill, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: EASE }, 1.1);

      var PLACES = [
        { t: 1.1, text: "en tu nuevo trabajo" },
        { t: 1.7, text: "en el banco" },
        { t: 2.3, text: "en Uber, DiDi o Rappi" }
      ];
      // Each new state lands with a slight tint shift (accent-medium 15% settling to
      // accent-light 8%), derived from time alone so every seek path paints the same frame.
      var REST_ALPHA = 0.08;
      var HIT_ALPHA = 0.15;
      var SETTLE = 0.4;

      function stateAt(time) {
        for (var i = PLACES.length - 1; i > 0; i--) {
          if (time + EPS >= PLACES[i].t) return i;
        }
        return 0;
      }

      var driver = { t: 0 };
      var shownState = 0;
      var shownTint = "";
      tl.to(driver, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          var now = driver.t;
          var i = stateAt(now);
          if (i !== shownState) {
            place.textContent = PLACES[i].text;
            shownState = i;
          }
          var k = now + EPS >= PLACES[i].t ? Math.min(1, Math.max(0, (now - PLACES[i].t) / SETTLE)) : 1;
          var tint = (REST_ALPHA + (HIT_ALPHA - REST_ALPHA) * (1 - k) * (1 - k)).toFixed(3);
          if (tint !== shownTint) {
            pill.style.backgroundColor = "rgba(29, 143, 243, " + tint + ")";
            shownTint = tint;
          }
        }

      // Progress strip grows linearly across the whole frame.
      tl.fromTo(progress, { scaleX: 0 }, { scaleX: 1, duration: DURATION, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-te-pidieron-tu-rfc"] = tl;
