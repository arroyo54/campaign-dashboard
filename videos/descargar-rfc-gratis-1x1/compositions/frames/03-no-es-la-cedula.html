  <script>
    (function () {
      var COMP = "03-no-es-la-cedula";
      var P = COMP + "-";
      var DURATION = 5;
      var EASE = "power3.out";

      // The ground clip is a direct child of the frame root: resolve the root through it.
      var root = document.getElementById(P + "ground").parentNode;
      function all(scope, name) {
        return Array.prototype.slice.call(scope.getElementsByClassName(P + name));
      }
      function one(scope, name) {
        return all(scope, name)[0];
      }

      var eyebrow = one(root, "eyebrow");
      var tag = one(root, "tag");
      var title = one(root, "title");
      var shellA = one(root, "shell-a");
      var shellB = one(root, "shell-b");
      var cardA = one(root, "card-a");
      var cardB = one(root, "card-b");
      var badgeA = one(cardA, "badge");
      var badgeB = one(cardB, "badge");
      var rowsA = all(cardA, "row");
      var rowsB = all(cardB, "row");
      var progress = one(root, "progress");

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.8s): the frame arrives on the root's push-slide LEFT; the title
      // drops into place from just above while eyebrow + tag-pill settle with it.
      tl.fromTo(eyebrow, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.6, ease: EASE }, 0.05);
      tl.fromTo(title, { opacity: 0, y: -44 }, { opacity: 1, y: 0, duration: 0.8, ease: EASE }, 0.1);
      tl.fromTo(tag, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.6, ease: EASE }, 0.14);

      // Scene 2 (0.4-1.7s): split-tilt entry, the signature. Equal cards arrive from
      // opposite wings, the right one 0.2s behind, with a mirrored book-open rotateY that
      // swings open from 30deg and lands near-flat (4deg) as each scales 0.9 -> 1.
      // No shadows (tint + border carry the lift); the pair holds still once landed.
      var TILT = 4;
      var TILT_FROM = 30;
      var SLIDE = 220;
      var ENTRY = 1.1;
      tl.fromTo(
        shellA,
        { opacity: 0, x: -SLIDE, rotationY: TILT_FROM, scale: 0.9 },
        { opacity: 1, x: 0, rotationY: TILT, scale: 1, duration: ENTRY, ease: EASE },
        0.38
      );
      tl.fromTo(
        shellB,
        { opacity: 0, x: SLIDE, rotationY: -TILT_FROM, scale: 0.9 },
        { opacity: 1, x: 0, rotationY: -TILT, scale: 1, duration: ENTRY, ease: EASE },
        0.58
      );

      // Scene 3 (1.8-3.6s): rows land in pairs, left then right
      // (dynamic-content-sequencing). Each pair's window is pre-computed ONCE from its copy
      // length, so the heavier pair earns more time. Rows accumulate (nothing swaps out),
      // so the per-char term only staggers arrivals; the read continues through the hold.
      var SCENE3_AT = 1.8;
      var PAIR_BASE = 0.18;
      var SEC_PER_CHAR = 0.0075;
      var PAIR_LAG = 0.16;

      function copyLength(row) {
        return row ? one(row, "text").textContent.trim().length : 0;
      }
      var cumulative = SCENE3_AT;
      var TIMELINE = rowsA.map(function (rowA, i) {
        var rowB = rowsB[i] || null;
        var start = cumulative;
        cumulative += PAIR_BASE + (copyLength(rowA) + copyLength(rowB)) * SEC_PER_CHAR;
        return { a: rowA, b: rowB, start: start };
      });

      // A row: its inline icon draws on (check in primary, cross in negative), and the
      // copy slides in from its own card's wing. The strokes use pathLength=1, so the
      // offset is a 0..1 fraction: autoRound off, or CSSPlugin snaps it to whole px.
      function revealRow(row, at, dir) {
        tl.fromTo(one(row, "icon"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, at);
        all(row, "stroke").forEach(function (stroke, i) {
          tl.fromTo(
            stroke,
            { strokeDashoffset: 1.05 },
            { strokeDashoffset: 0, duration: 0.32, ease: "power2.out", autoRound: false },
            at + i * 0.12
          );
        });
        tl.fromTo(
          one(row, "text"),
          { opacity: 0, x: 18 * dir },
          { opacity: 1, x: 0, duration: 0.55, ease: EASE },
          at + 0.05
        );
      }
      TIMELINE.forEach(function (entry) {
        revealRow(entry.a, entry.start, -1);
        if (entry.b) revealRow(entry.b, entry.start + PAIR_LAG, 1);
      });

      tl.fromTo(badgeB, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: POP, ease: EASE }, 3.9);
