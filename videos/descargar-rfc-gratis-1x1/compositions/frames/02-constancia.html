  <script>
    (function () {
      // Class hooks carry the literal frame prefix. Its leading digit is not a valid
      // CSS identifier start, so lookups use [class~="..."] attribute selectors, which
      // the runtime's scoped document resolves inside this composition only.
      var P = "02-constancia-";
      function sel(name) {
        return '[class~="' + P + name + '"]';
      }
      function one(name) {
        return document.querySelector(sel(name));
      }
      function all(name) {
        return Array.prototype.slice.call(document.querySelectorAll(sel(name)));
      }

      var DURATION = 6.5;
      var EASE = "power3.out";
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-1.2s): slide-header settles, the title enters word by word ----
      tl.fromTo(one("eyebrow"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: EASE }, 0);
      tl.fromTo(one("tag"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: EASE }, 0.08);

      // dynamic-content-sequencing: each word's window is pre-computed once from its
      // length (BASE + chars x SEC_PER_CHAR, plus a short hold at a line end), so the
      // sequencer assigns every start time; nothing is hand-offset per word.
      var WORD_BASE = 0.1;
      var SEC_PER_CHAR = 0.016;
      var LINE_HOLD = 0.06;
      var TITLE_AT = 0.12;
      var SLIDES = [48, 34, 24, 16]; // horizontal slide decays word to word, like a settling camera
      var cumulative = TITLE_AT;
      var TITLE_SEQ = all("word").map(function (el) {
        var lineEnd = el.nextElementSibling === null;
        var start = cumulative;
        cumulative += WORD_BASE + el.textContent.length * SEC_PER_CHAR + (lineEnd ? LINE_HOLD : 0);
        return { el: el, start: start, end: cumulative };
      });
      TITLE_SEQ.forEach(function (w, i) {
        tl.fromTo(w.el, { opacity: 0, x: SLIDES[i], y: 22 }, { opacity: 1, x: 0, y: 0, duration: 0.62, ease: EASE }, w.start);
      });

      // ---- Scene 2 (1.2-2.0s): the document card rises into place on a long settle ----
      tl.fromTo(one("card"), { opacity: 0, y: 64 }, { opacity: 1, y: 0, duration: 1.0, ease: EASE }, 1.16);

      // spring-pop-entrance (calm settle, no overshoot): icon, label, PDF pill pop in turn.
      var POP_AT = 1.42;
      var POP_STAGGER = 0.06;
      [one("doc-icon"), one("doc-label"), one("pdf")].forEach(function (el, i) {
        tl.fromTo(el, { scale: 0, opacity: 0, y: 8 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: EASE }, POP_AT + i * POP_STAGGER);
      });

      // ---- Scene 3 (2.0-4.6s): the five rows assemble top to bottom, ~0.5s apart ----
      // center-outward-expansion, direct-to-slot form: each row's offset from the rows'
      // shared center lives in data-target-y; the row starts partially spread
      // (offset x START_PROGRESS) and lerps out to its own slot (offset x 1).
      var ROWS = all("row");
      var ROW_AT = 2.05;
      var ROW_GAP = 0.5;
      var EXPAND_DUR = 1.0;
      var START_PROGRESS = 0.8;
      ROWS.forEach(function (row, i) {
        var targetY = Number(row.getAttribute("data-target-y"));
        tl.fromTo(
          row,
          { opacity: 0, y: targetY * (START_PROGRESS - 1), scale: 0.6 + 0.4 * START_PROGRESS },
          { opacity: 1, y: 0, scale: 1, duration: EXPAND_DUR, ease: EASE },
          ROW_AT + i * ROW_GAP
        );
      });

      // Value pills ("13 caracteres", "Activo"): clip-path mask reveal. The pill's window
      // wipes open left to right while its label slides through the window.
      var VAL_DELAY = 0.32;
      all("val").forEach(function (pill) {
        var at = ROW_AT + ROWS.indexOf(pill.parentNode) * ROW_GAP + VAL_DELAY;
        tl.fromTo(
          pill,
          { clipPath: "inset(0% 100% 0% 0% round 100px)" },
          { clipPath: "inset(0% 0% 0% 0% round 100px)", duration: 0.6, ease: EASE },
          at
        );
        tl.fromTo(pill.firstElementChild, { x: -28 }, { x: 0, duration: 0.6, ease: EASE }, at);
      });

      // ---- Scene 4 (4.6-6.5s): three pills enter left to right, then the frame holds ----
      var PILL_AT = 4.68;
      var PILL_GAP = 0.32;
      all("pill").forEach(function (pill, i) {
        tl.fromTo(pill, { opacity: 0, x: -18, scale: 0.94 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: EASE }, PILL_AT + i * PILL_GAP);
      });

      // Progress strip grows linearly across the whole frame: 12.5% to 25% of the width.
      tl.fromTo(one("progress"), { scaleX: 0.125 }, { scaleX: 0.25, duration: DURATION, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-constancia"] = tl;
    })();
  </script>
