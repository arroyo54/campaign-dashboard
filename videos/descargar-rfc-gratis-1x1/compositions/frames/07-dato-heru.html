    (function () {

      var numWrap = part("num-wrap");
      var num = part("num");

      var units = part("units");
      var dot = part("dot");
      var tenths = part("tenths");
      var track = part("track");
      var fill = part("fill");
      var lines = root.getElementsByClassName("07-dato-heru-line");
      var lineA = lines[0];
      var lineB = lines[1];
      var source = part("src");
      var progress = part("progress");

      /* Count proxy in tenths of a percent: the tween ends on exactly 648, which paints "64.8%".
         0 paints the resting "0%"; any other value paints one decimal. Text writes only (O(1)). */
      var count = { v: 0 };
      var painted = -1;
      function paint() {
        var n = Math.round(count.v);
        if (n === painted) return;
        painted = n;
        if (n <= 0) {
          tens.textContent = "";
          units.textContent = "0";
          dot.textContent = "";
          tenths.textContent = "";
          return;
        }
        var whole = Math.floor(n / 10);
        tens.textContent = whole >= 10 ? String(Math.floor(whole / 10)) : "";
        units.textContent = String(whole % 10);
        dot.textContent = ".";
        tenths.textContent = String(n % 10);
      }
      paint();

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-0.6s): under the crossfade, eyebrow, the resting "0%" and the empty track settle in */
      tl.fromTo(eyebrow, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(numWrap, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.06);
      tl.fromTo(track, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.14);

      /* Scene 2 (0.6-2.4s): counting-dynamic-scale + stat-bars-and-fills as one beat:
         value, scale and fill share start, duration and ease, so number and bar land together */

      var COUNT_DUR = 1.8;
      var COUNT_EASE = "power3.out";
      var START_SCALE = 0.72; /* contained growth */
      tl.fromTo(count, { v: 0 }, { v: 648, duration: COUNT_DUR, ease: COUNT_EASE, onUpdate: paint }, COUNT_AT);
      tl.fromTo(num, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo(fill, { xPercent: -64.8 }, { xPercent: 0, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      /* Scene 3 (2.4-4.5s): on the landing the caption rises line by line, then the source;

      tl.fromTo(lineB, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 2.52);
