<template>
  <style>
    @font-face { font-family:'Lexend Deca'; src:url('assets/fonts/lexend-deca.woff2') format('woff2');
                 font-weight:100 900; font-style:normal; font-display:block; }

    #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
            font-family:'Lexend Deca', ui-sans-serif, system-ui, sans-serif;
            color:#1A1A1A; background:transparent; }

    #root .clip { position:absolute; inset:0; }

    /* ---- capa 1 · fondo ---- */
    #root #f03-ground { background:#FFFFFF; }

    /* ---- capa 2 · atmósfera cobalto detrás del dispositivo ---- */
    #root #f03-wash { position:absolute; inset:0; opacity:0;
                      background:radial-gradient(760px 620px at 1390px 500px,
                                 rgba(29,143,243,.13) 0%,
                                 rgba(29,143,243,.05) 55%,
                                 rgba(29,143,243,0) 100%); }
    #root #f03-accent-panel { position:absolute; left:1120px; top:200px; width:540px; height:640px;
                              border-radius:40px;
                              background:rgba(29,143,243,.04);
                              border:1.5px solid rgba(29,143,243,.2); }

    /* ---- capa 3 · teléfono ---- */
    #root #f03-phone { position:absolute; left:1190px; top:110px; width:400px; height:780px; }
    #root #f03-bezel { position:absolute; inset:0; border-radius:40px; border:10px solid #1A1A1A;
                       box-sizing:border-box; overflow:hidden; background:#FFFFFF; }
    #root #f03-screen { position:absolute; inset:0; }
    #root #f03-shot { display:block; width:100%; height:100%;
                      object-fit:cover; object-position:50% 0%; }

    /* destello de palabra clave sobre el badge "Encriptado" de la captura */
    #root #f03-badge-bloom { position:absolute; left:69px; top:56px; width:240px; height:150px;
                             border-radius:50%; pointer-events:none; opacity:0;
                             transform-origin:50% 50%;
                             background:radial-gradient(closest-side,
                                        rgba(29,143,243,.55) 0%,
                                        rgba(29,143,243,.26) 45%,
                                        rgba(29,143,243,0) 100%); }
    #root #f03-badge-ring { position:absolute; left:131px; top:114px; width:116px; height:34px;
                            border-radius:100px; pointer-events:none; opacity:0;
                            transform-origin:50% 50%;
                            border:2px solid rgba(29,143,243,.85); }

    /* ---- columna de texto ---- */
    #root #f03-pill { position:absolute; left:300px; top:352px;
                      display:inline-block; padding:12px 28px; border-radius:100px;
                      background:rgba(29,143,243,.08); color:#1772C2;
                      font-size:20px; font-weight:500; letter-spacing:.01em;
                      transform-origin:0% 50%; }

    #root #f03-headline { position:absolute; left:300px; top:434px; width:760px;
                          font-size:64px; font-weight:600; line-height:1.1;
                          letter-spacing:-.02em; color:#1A1A1A; }
    #root .f03-line { display:block; }
    #root .f03-word { display:inline-block; }

    #root #f03-micro { position:absolute; left:300px; top:607px; width:720px;
                       font-size:26px; font-weight:400; line-height:1.5; color:#5A5A5A; }
  </style>

  <div id="root" data-composition-id="03-conectas-una-vez" data-width="1920" data-height="1080">

    <!-- capa 1 -->
    <div id="f03-ground" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>

    <!-- capa 2 -->
    <div id="f03-atmos" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div id="f03-wash"></div>
      <div id="f03-accent-panel"></div>
    </div>

    <!-- capa 3 -->
    <div id="f03-device" class="clip" data-start="0" data-duration="5" data-track-index="2">
      <div id="f03-phone">
        <div id="f03-bezel">
          <div id="f03-screen" data-layout-allow-overflow>
            <img id="f03-shot" src="assets/03-conecta-sat-efirma.jpg"
                 alt="Pantalla de heru: Conecta tu cuenta del SAT con e.firma" />
          </div>
          <div id="f03-badge-bloom"></div>
          <div id="f03-badge-ring"></div>
        </div>
      </div>
    </div>

    <!-- copia -->
    <div id="f03-copy" class="clip" data-start="0" data-duration="5" data-track-index="3">
      <div id="f03-pill">Paso único</div>
      <div id="f03-headline">
        <span class="f03-line"><span class="f03-word" id="f03-w1">Lo</span> <span class="f03-word" id="f03-w2">conectas</span></span>
        <span class="f03-line"><span class="f03-word" id="f03-w3">una</span> <span class="f03-word" id="f03-w4">vez.</span></span>
      </div>
      <div id="f03-micro">e.firma · cifrado de extremo a extremo</div>
    </div>

  </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-conectas-una-vez"] = tl;

      var byId = function (id) { return document.getElementById(id); };

      /* ---------- Escena 1 (0.0–1.1s) — el teléfono entra desde la derecha, ya en movimiento ---------- */
      tl.fromTo(byId("f03-phone"),
        { x: 340, scale: 0.965, opacity: 0.3 },
        { x: 0, scale: 1, opacity: 1, duration: 1.05, ease: "power3.out" }, 0);

      tl.fromTo(byId("f03-accent-panel"),
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.95, ease: "power3.out" }, 0.12);

      tl.fromTo(byId("f03-wash"),
        { opacity: 0 },
        { opacity: 1, duration: 0.85, ease: "power2.out" }, 0);

      /* ---------- Escena 2 (1.1–2.1s) — píldora "Paso único", asentamiento liso sin overshoot ---------- */
      tl.fromTo(byId("f03-pill"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" }, 1.15);

      /* ---------- Escena 3 (2.1–3.3s) — titular escalonado por palabra ---------- */
      ["f03-w1", "f03-w2", "f03-w3", "f03-w4"].forEach(function (id, i) {
        tl.fromTo(byId(id),
          { y: 28, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.52, ease: "power3.out" }, 2.15 + i * 0.13);
      });

      /* ---------- Escena 4 (3.3–5.0s) — micro-línea + destello único sobre "Encriptado" ---------- */
      tl.fromTo(byId("f03-micro"),
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 3.2);

      /* asr-keyword-glow — un solo driver lineal, envolvente ataque/sostén/caída, disparo único */
      var SCENE_DURATION = 5;
      var ATTACK_DUR = 0.22;
      var RELEASE = 0.5;
      var REST_LEVEL = 0.18;
      var KEY = { start: 3.45, end: 3.85 };

      var bloom = byId("f03-badge-bloom");
      var ring = byId("f03-badge-ring");

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      var driver = { t: 0 };
      tl.to(driver, {
        t: SCENE_DURATION,
        duration: SCENE_DURATION,
        ease: "none",
        onUpdate: function () {
          var env = envelope(driver.t, KEY.start, KEY.end);
          bloom.style.opacity = String(0.95 * env);
          bloom.style.transform = "scale(" + (0.8 + 0.3 * env) + ")";
          ring.style.opacity = String(0.9 * env);
          ring.style.transform = "scale(" + (0.94 + 0.06 * env) + ")";
          ring.style.boxShadow = "0 0 " + (30 * env) + "px rgba(29,143,243," + (0.6 * env) + ")";
        }
      }, 0);
    })();
  </script>
</template>
