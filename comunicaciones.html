-- Espaciador -->\n              <td class=\"responsive-spacer\" width=\"20\">&nbsp;<\/td>\n              <!-- Columna derecha: Tú -->\n              <td class=\"responsive-col\" width=\"250\" valign=\"top\">\n                <div class=\"role-card\" style=\"margin-bottom: 10px;\">\n                  <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #003366; margin-bottom: 6px; font-family: 'DM Sans', sans-serif;\">LO QUE HACES TÚ<\/div>\n                  <div style=\"font-size: 13px; color: #475569; line-height: 1.45; font-family: 'DM Sans', sans-serif;\">\n                    Tomas la línea de captura del acuse del mes y <strong style=\"color: #003366;\">pagas<\/strong> en tu banco (app, web o sucursal).\n                  <\/div>\n                <\/div>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <h2 style=\"font-size: 16px; color: #003366; margin: 28px 0 10px 0; font-weight: 800; font-family: 'DM Sans', sans-serif;\">Aprende a leer tu acuse<\/h2>\n\n          <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/6a14cff1eeb7fc9443249e1f.png\" alt=\"Acuse del SAT con las 4 zonas clave resaltadas: periodo, importe, línea de captura y fecha de vencimiento\" class=\"acuse-img\">\n\n          <div class=\"warning-box\">\n            <p style=\"margin: 0 0 6px 0; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; color: #991b1b; letter-spacing: 0.5px;\">⚠️ SI NO PAGAS A TIEMPO<\/p>\n            <p style=\"margin: 0; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #475569; line-height: 1.55;\">\n              La línea vence y tendrás que pedir una nueva línea de captura que traerá <strong style=\"color: #991b1b;\">recargos<\/strong> calculados desde la fecha original.\n            <\/p>\n          <\/div>\n\n          <!-- Footer -->\n          <!-- -->\n          <div style=\"text-align: center; margin-top: 30px;\">\n            <p style=\"font-size: 12px; color: #94a3b8; margin: 0 0 15px 0; font-family: 'DM Sans', sans-serif;\">\n              ¿Preguntas? Escríbenos a ayuda@heru-app.com\n            <\/p>\n            <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\" style=\"margin: 0 auto;\">\n              <tr>\n                <td style=\"padding: 0 8px;\"><a href=\"https://instagram.com/somosheru\" target=\"_blank\"><img src=\"https://cdn-icons-png.flaticon.com/512/174/174855.png\" alt=\"Instagram\" width=\"22\" height=\"22\"><\/a><\/td>\n                <td style=\"padding: 0 8px;\"><a href=\"https://www.facebook.com/somosheru\" target=\"_blank\"><img src=\"https://cdn-icons-png.flaticon.com/512/124/124010.png\" alt=\"Facebook\" width=\"22\" height=\"22\"><\/a><\/td>\n                <td style=\"padding: 0 8px;\"><a href=\"https://www.linkedin.com/company/somosheru/\" target=\"_blank\"><img src=\"https://cdn-icons-png.flaticon.com/512/174/174857.png\" alt=\"LinkedIn\" width=\"22\" height=\"22\"><\/a><\/td>\n                <td style=\"padding: 0 8px;\"><a href=\"https://heru.trb.ai/wa/3Sha3Zw\" target=\"_blank\"><img src=\"https://cdn-icons-png.flaticon.com/512/733/733585.png\" alt=\"WhatsApp\" width=\"22\" height=\"22\"><\/a><\/td>\n              <\/tr>\n            <\/table>\n          <\/div>\n        <\/td>\n      <\/tr>\n    <\/table>\n  <\/div>\n<\/body>\n<\/html>"}, "1278": {"name": "03__educativo_resico", "subject": "Ese 1.25% en tus facturas juega a tu favor 👀", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <title>Cómo se acreditan tus retenciones - Heru<\/title>\n  <!--[if mso]>\n  <style type=\"text/css\">\n    body, table, td, a, span, p { font-family: Arial, sans-serif !important; }\n  <\/style>\n  <![endif]-->\n  <style>\n    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght=400;500;700;800&display=swap');\n\n    body, table, td, a {\n      -webkit-text-size-adjust: 100%;\n      -ms-text-size-adjust: 100%;\n    }\n\n    table, td {\n      mso-table-lspace: 0pt;\n      mso-table-rspace: 0pt;\n      border-collapse: collapse !important;\n    }\n\n    img {\n      -ms-interpolation-mode: bicubic;\n      border: 0;\n      height: auto;\n      line-height: 100%;\n      outline: none;\n      text-decoration: none;\n      display: block;\n    }\n\n    body {\n      height: 100% !important;\n      margin: 0 !important;\n      padding: 0 !important;\n      width: 100% !important;\n      background-color: #f4f7f9;\n      font-family: 'DM Sans', Helvetica, Arial, sans-serif;\n      color: #1e293b;\n    }\n\n    .main-table {\n      width: 100%;\n      max-width: 600px;\n      margin: 20px auto;\n      background-color: #ffffff;\n      border-radius: 4px;\n      overflow: hidden;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS (Paddings compactos de cabecera)\n       ========================================================================= */\n    .banner {\n      background-color: #003366;\n      padding: 10px 40px;\n    }\n\n    .chapter {\n      padding: 14px 40px 0 40px;\n      background-color: #ffffff;\n    }\n\n    .hero {\n      padding: 8px 40px 16px 40px;\n      background-color: #ffffff;\n      border-bottom: 1px solid #e2e8f0;\n    }\n\n    .content {\n      padding: 24px 40px;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS PARA MÓVIL\n       ========================================================================= */\n    @media screen and (max-width: 600px) {\n      .content, .hero, .chapter, .banner { \n        padding-left: 20px !important; \n        padding-right: 20px !important; \n      }\n      .main-table { \n        margin: 0 auto !important; \n        border-radius: 0 !important; \n      }\n    }\n  <\/style>\n<\/head>\n\n<body>\n  <div style=\"background-color: #f4f7f9; padding: 10px 0;\">\n    <table class=\"main-table\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n\n      <!-- Banner azul marino -->\n      <tr>\n        <td class=\"banner\">\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td align=\"left\">\n                <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/6a0e028c17d8dcd74a550ebc.jpg\" alt=\"heru\" width=\"70\" style=\"display: block;\">\n              <\/td>\n              <td align=\"right\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; color: #94a3b8;\">1 min de lectura<\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n\n      <!-- Chapter number + tag -->\n      <tr>\n        <td class=\"chapter\">\n          <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 44px; font-weight: 800; color: #0091ff; line-height: 1; padding-right: 14px;\">03<\/td>\n              <td valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #003366; padding-bottom: 4px;\">EDUCATIVO<\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n\n      <!-- Hero (título + subtítulo) -->\n      <tr>\n        <td class=\"hero\">\n          <h1 style=\"margin: 6px 0 0 0; font-size: 25px; line-height: 1.25; font-weight: 700; font-family: 'DM Sans', sans-serif; color: #003366;\">\n            Te retuvieron 1.25%\n          <\/h1>\n          <p style=\"margin: 8px 0 0 0; font-size: 15px; color: #475569; line-height: 1.45; font-family: 'DM Sans', sans-serif;\">\n            Si te pagaron empresas este mes, ya hubo una retención. heru la ve y la acredita automático. Te explico qué pasa detrás.\n          <\/p>\n        <\/td>\n      <\/tr>\n\n      <!-- Body Content (Rediseñado - Limpio y Premium) -->\n      <tr>\n        <td class=\"content\">\n          \n          <!-- Saludo Dinámico Horizontal -->\n          <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin: 0 0 16px 0;\">\n            <tr>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 4px;\">Hola<\/td>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 1px;\">{{ params.first_name|default:\"👋🏼\" }}<\/td>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap;\">,<\/td>\n            <\/tr>\n          <\/table>\n\n          <p style=\"color: #475569; font-size: 15px; margin: 0 0 28px 0; line-height: 1.6; font-family: 'DM Sans', sans-serif;\">\n            Cada vez que le facturas a una empresa (persona moral), te retienen <strong>1.25% de ISR<\/strong> del monto. Eso no es un cobro extra, es un anticipo de tu impuesto del mes. Y lo mejor: <strong>heru ya lo está viendo<\/strong>.\n          <\/p>\n\n          <h2 style=\"font-size: 16px; color: #003366; margin: 0 0 20px 0; font-weight: 800; font-family: 'DM Sans', sans-serif; letter-spacing: -0.3px;\">¿Qué hace heru por ti?<\/h2>\n\n          <!-- Rediseño Paso 1 (Estilo Lista Editorial Limpia) -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 24px;\">\n            <tr>\n              <td valign=\"top\" width=\"30\" style=\"font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 800; color: #0091ff; line-height: 1;\">\n                01\n              <\/td>\n              <td valign=\"top\" style=\"font-family: 'DM Sans', sans-serif; padding-left: 12px;\">\n                <div style=\"font-size: 15px; font-weight: 700; color: #003366; margin-bottom: 4px;\">\n                  Leemos tus facturas directo del SAT\n                <\/div>\n                <div style=\"font-size: 13.5px; color: #475569; line-height: 1.55;\">\n                  Con tus credenciales vinculadas, vemos cada factura que emitiste y la retención que te hicieron. <strong>No tienes que enviarnos nada de forma manual.<\/strong>\n                <\/div>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Rediseño Paso 2 (Estilo Lista Editorial Limpia) -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 24px;\">\n            <tr>\n              <td valign=\"top\" width=\"30\" style=\"font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 800; color: #0091ff; line-height: 1;\">\n                02\n              <\/td>\n              <td valign=\"top\" style=\"font-family: 'DM Sans', sans-serif; padding-left: 12px;\">\n                <div style=\"font-size: 15px; font-weight: 700; color: #003366; margin-bottom: 4px;\">\n                  Acreditamos cada retención\n                <\/div>\n                <div style=\"font-size: 13.5px; color: #475569; line-height: 1.55;\">\n                  Tomamos las retenciones del mes y las restamos de tu ISR a pagar. Si suman más de lo que debes de impuesto, se genera un <strong>saldo a favor<\/strong> para tu siguiente declaración.\n                <\/div>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Rediseño Highlight Box (Estructura de dos columnas blindada contra desbordes) -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #f8fafc; border-left: 3px solid #003366; margin: 28px 0;\">\n            <tr>\n              <td style=\"padding: 16px 20px; font-family: 'DM Sans', sans-serif;\">\n                <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                  <tr>\n                    <!-- Columna exclusiva para el emoji (nunca empujará el texto) -->\n                    <td valign=\"top\" width=\"24\" style=\"font-size: 15px; line-height: 1; padding-top: 3px;\">💡<\/td>\n                    <!-- Columna de texto principal -->\n                    <td valign=\"top\" style=\"font-family: 'DM Sans', sans-serif; font-size: 13.5px; color: #003366; line-height: 1.6; padding-left: 6px;\">\n                      <strong>Por eso a veces pagas menos:<\/strong> Entre más factures a empresas este mes, mayor será tu saldo acreditado y menor terminará siendo el pago final de tus impuestos.\n                    <\/td>\n                  <\/tr>\n                <\/table>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Rediseño de Sección \"Emitir Facturas\" (Componente estilo SaaS Premium con botón corregido) -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"border: 1px solid #e2e8f0; border-radius: 12px; margin: 28px 0 32px 0; background-color: #ffffff; overflow: hidden;\">\n            <tr>\n              <td style=\"padding: 24px; font-family: 'DM Sans', sans-serif;\">\n                <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                  <tr>\n                    <td align=\"center\" style=\"padding-bottom: 12px;\">\n                      <span style=\"background-color: #e6f1fb; color: #0091ff; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase;\">FUNCIÓN DE LA APP<\/span>\n                    <\/td>\n                  <\/tr>\n                  <tr>\n                    <td align=\"center\" style=\"font-size: 16px; font-weight: 700; color: #003366; padding-bottom: 8px; text-align: center;\">\n                      ¡Haz tus facturas directo en heru!\n                    <\/td>\n                  <\/tr>\n                  <tr>\n                    <td align=\"center\" style=\"font-size: 13.5px; color: #475569; line-height: 1.55; padding-bottom: 18px; text-align: center;\">\n                      ¿Sabías que puedes emitir facturas a tus clientes directamente desde nuestra aplicación? Olvídate de los procesos lentos del SAT y hazlo en segundos desde tu celular.\n                    <\/td>\n                  <\/tr>\n                  <tr>\n                    <td align=\"center\">\n                      <!-- Botón limpio e indestructible para Outlook y Gmail -->\n                      <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\">\n                        <tr>\n                          <td style=\"background-color: #0091ff; border-radius: 6px;\" align=\"center\">\n                            <a href=\"https://youtube.com/shorts/6GNRAfwdGiI?feature=share\" target=\"_blank\" style=\"font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; color: #ffffff; text-decoration: none; padding: 12px 24px; display: inline-block; border-radius: 6px; line-height: 1;\">\n                              Ver video tutorial →\n                            <\/a>\n                          <\/td>\n                        <\/tr>\n                      <\/table>\n                    <\/td>\n                  <\/tr>\n                <\/table>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Footer Final (Intacto) -->\n          <div style=\"text-align: center; margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 24px;\">\n            <p style=\"margin: 0 0 16px 0; font-size: 12px; color: #94a3b8; line-height: 1.5; font-family: 'DM Sans', sans-serif;\">\n              ¿Preguntas? Escríbenos a ayuda@heru-app.com\n            <\/p>\n            <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\" style=\"margin: 0 auto;\">\n              <tr>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://instagram.com/somosheru\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/174/174855.png\" alt=\"Instagram\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://www.facebook.com/somosheru\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/124/124010.png\" alt=\"Facebook\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://www.linkedin.com/company/somosheru/\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/174/174857.png\" alt=\"LinkedIn\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://heru.trb.ai/wa/3Sha3Zw\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/733/733585.png\" alt=\"WhatsApp\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/div>\n        <\/td>\n      <\/tr>\n    <\/table>\n  <\/div>\n<\/body>\n\n<\/html>"}, "1284": {"name": "02_educativo_resico", "subject": "📥 heru presenta. Tú pagas.", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <title>Heru presenta. Tú pagas. - heru<\/title>\n  <!--[if mso]>\n  <style type=\"text/css\">\n    body, table, td, a, span, p { font-family: Arial, sans-serif !important; }\n  <\/style>\n  <![endif]-->\n  \n  <style>\n    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght=400;500;700;800&display=swap');\n\n    body, table, td, a {\n      -webkit-text-size-adjust: 100%;\n      -ms-text-size-adjust: 100%;\n    }\n\n    table, td {\n      mso-table-lspace: 0pt;\n      mso-table-rspace: 0pt;\n      border-collapse: collapse !important;\n    }\n\n    img {\n      -ms-interpolation-mode: bicubic;\n      border: 0;\n      height: auto;\n      line-height: 100%;\n      outline: none;\n      text-decoration: none;\n      display: block;\n    }\n\n    body {\n      height: 100% !important;\n      margin: 0 !important;\n      padding: 0 !important;\n      width: 100% !important;\n      background-color: #f4f7f9;\n      font-family: 'DM Sans', Helvetica, Arial, sans-serif;\n      color: #1e293b;\n    }\n\n    .main-table {\n      width: 100%;\n      max-width: 600px;\n      margin: 20px auto;\n      background-color: #ffffff;\n      border-radius: 4px;\n      overflow: hidden;\n    }\n\n    /* Ajustes del encabezado reducidos */\n    .banner {\n      background-color: #003366;\n      padding: 10px 40px; /* Reducido de 14px para ganar espacio vertical */\n    }\n\n    .chapter {\n      padding: 16px 40px 0 40px; /* Reducido de 26px para compactar */\n      background-color: #ffffff;\n    }\n\n    .hero {\n      padding: 8px 40px 18px 40px; /* Reducido para que el contenido suba en pantalla */\n      background-color: #ffffff;\n      border-bottom: 1px solid #e2e8f0;\n    }\n\n    .content {\n      padding: 24px 40px 30px 40px;\n    }\n\n    .role-card {\n      background-color: #f8fafc;\n      border: 1px solid #e2e8f0;\n      border-radius: 8px;\n      padding: 14px 16px;\n      margin-bottom: 12px;\n    }\n\n    .acuse-img {\n      width: 100%;\n      max-width: 100%;\n      height: auto;\n      border: 1px solid #e2e8f0;\n      border-radius: 8px;\n      margin: 18px 0;\n    }\n\n    .warning-box {\n      background-color: #fef2f2;\n      border-left: 4px solid #ef4444;\n      border-radius: 6px;\n      padding: 16px 18px;\n      margin: 18px 0;\n    }\n\n    @media screen and (max-width: 600px) {\n      /* 1. Ajuste de paddings generales en móvil (evita que el texto quede pegado a las orillas) */\n      .content, .hero, .chapter, .banner { \n        padding-left: 20px !important; \n        padding-right: 20px !important; \n      }\n      \n      /* 2. Ancho completo de la tabla en pantallas pequeñas */\n      .main-table { \n        margin: 0 auto !important; \n        border-radius: 0 !important; \n        width: 100% !important;\n      }\n\n      /* 3. Comportamiento responsivo de columnas de roles (para que se apilen una debajo de otra) */\n      .responsive-col {\n        display: block !important;\n        width: 100% !important;\n        box-sizing: border-box !important;\n      }\n      \n      .responsive-spacer {\n        display: none !important;\n      }\n\n      /* 4. Ajustes rápidos de fuentes en celulares si sientes que se ven muy grandes/chicos */\n      .hero h1 {\n        font-size: 24px !important; /* Título principal en móvil */\n      }\n      \n      .hero p {\n        font-size: 15px !important; /* Subtítulo en móvil */\n      }\n    }\n  <\/style>\n<\/head>\n\n<body>\n  <div style=\"background-color: #f4f7f9; padding: 10px 0;\">\n    <table class=\"main-table\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n\n      <tr>\n        <td class=\"banner\">\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td align=\"left\">\n                <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/6a0e028c17d8dcd74a550ebc.jpg\" alt=\"heru\" width=\"70\" style=\"display: block;\">\n              <\/td>\n              <td align=\"right\" style=\"font-family: 'DM Sans', sans-serif; font-size: 12px; color: #94a3b8;\">2 min de lectura<\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n\n      <tr>\n        <td class=\"chapter\">\n          <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 44px; font-weight: 800; color: #0091ff; line-height: 1; padding-right: 14px;\">02<\/td>\n              <td valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #003366; padding-bottom: 4px;\">EDUCATIVO<\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n\n      <tr>\n        <td class=\"hero\">\n          <h1 style=\"margin: 6px 0 0 0; font-size: 28px; line-height: 1.2; font-weight: 700; font-family: 'DM Sans', sans-serif; color: #003366;\">\n            Heru presenta. Tú pagas.\n          <\/h1>\n          <p style=\"margin: 8px 0 0 0; font-size: 16px; color: #475569; line-height: 1.45; font-family: 'DM Sans', sans-serif;\">\n            Tu RESICO ya está al SAT. Falta tu parte: pagar con la <strong style=\"color: #003366;\">línea de captura<\/strong> antes de que venza.\n          <\/p>\n        <\/td>\n      <\/tr>\n\n      <tr>\n        <td class=\"content\">\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin: 0 0 16px 0;\">\n            <tr>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 4px;\">Hola<\/td>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 1px;\">{{ params.first_name|default:\"👋🏼\" }}<\/td>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap;\">,<\/td>\n            <\/tr>\n          <\/table>\n          <p style=\"color: #475569; font-size: 15px; margin: 0 0 20px 0; line-height: 1.6; font-family: 'DM Sans', sans-serif;\">\n             Existe una confusión común: pensar que heru ya realizó tu pago ante el SAT. <strong style=\"color: #003366;\">No es así.<\/strong> Te explicamos cómo se divide el trabajo y cómo pagar tu acuse de forma sencilla:\n          <\/p>\n\n          <h2 style=\"font-size: 16px; color: #003366; margin: 0 0 14px 0; font-weight: 800; font-family: 'DM Sans', sans-serif;\">Cómo nos dividimos las tareas<\/h2>\n\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 12px;\">\n            <tr>\n              <!-- Columna izquierda: heru -->\n              <td class=\"responsive-col\" width=\"250\" valign=\"top\">\n                <div class=\"role-card\" style=\"margin-bottom: 10px; min-height: 100px;\">\n                  <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #0091ff; margin-bottom: 6px; font-family: 'DM Sans', sans-serif;\">LO QUE HACE HERU<\/div>\n                  <div style=\"font-size: 13px; color: #475569; line-height: 1.45; font-family: 'DM Sans', sans-serif;\">\n                    Leemos tus datos, calculamos tus impuestos y <strong style=\"color: #003366;\">presentamos<\/strong> la declaración. Te entregamos el acuse oficial.\n                  <\/div>\n                <\/div>\n              <\/td>\n              <!-- Espaciador entre columnas -->\n              <td class=\"responsive-spacer\" width=\"20\">&nbsp;<\/td>\n              <!-- Columna derecha: Tú -->\n              <td class=\"responsive-col\" width=\"250\" valign=\"top\">\n                <div class=\"role-card\" style=\"margin-bottom: 10px; min-height: 100px;\">\n                  <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #003366; margin-bottom: 6px; font-family: 'DM Sans', sans-serif;\">LO QUE HACES TÚ<\/div>\n                  <div style=\"font-size: 13px; color: #475569; line-height: 1.45; font-family: 'DM Sans', sans-serif;\">\n                    Tomas la línea de captura del acuse que te enviamos y <strong style=\"color: #003366;\">pagas<\/strong> directamente en tu portal bancario.\n                  <\/div>\n                <\/div>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <h2 style=\"font-size: 16px; color: #003366; margin: 24px 0 10px 0; font-weight: 800; font-family: 'DM Sans', sans-serif;\">Aprende a leer tu acuse<\/h2>\n\n          <!-- Imagen del acuse -->\n          <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/6a14cff1eeb7fc9443249e1f.png\" alt=\"Acuse del SAT con las 4 zonas clave resaltadas: periodo, importe, línea de captura y fecha de vencimiento\" class=\"acuse-img\">\n\n          <!-- Caja de advertencia -->\n          <div class=\"warning-box\">\n            <p style=\"margin: 0 0 6px 0; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; color: #991b1b; letter-spacing: 0.5px;\">⚠️ SI NO PAGAS A TIEMPO<\/p>\n            <p style=\"margin: 0; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #475569; line-height: 1.5;\">\n              La línea de captura vencerá y tendrás que tramitar una nueva, la cual podría generar <strong style=\"color: #991b1b;\">recargos<\/strong> calculados desde la fecha de vencimiento original.\n            <\/p>\n          <\/div>\n\n          <div style=\"text-align: center; margin-top: 35px; border-top: 1px solid #e2e8f0; padding-top: 25px;\">\n            <p style=\"font-size: 12px; color: #94a3b8; margin: 0 0 15px 0; font-family: 'DM Sans', sans-serif;\">\n              ¿Preguntas? Escríbenos a ayuda@heru-app.com\n            <\/p>\n            <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\" style=\"margin: 0 auto;\">\n              <tr>\n                <td style=\"padding: 0 8px;\"><a href=\"https://instagram.com/somosheru\" target=\"_blank\"><img src=\"https://cdn-icons-png.flaticon.com/512/174/174855.png\" alt=\"Instagram\" width=\"22\" height=\"22\"><\/a><\/td>\n                <td style=\"padding: 0 8px;\"><a href=\"https://www.facebook.com/somosheru\" target=\"_blank\"><img src=\"https://cdn-icons-png.flaticon.com/512/124/124010.png\" alt=\"Facebook\" width=\"22\" height=\"22\"><\/a><\/td>\n                <td style=\"padding: 0 8px;\"><a href=\"https://www.linkedin.com/company/somosheru/\" target=\"_blank\"><img src=\"https://cdn-icons-png.flaticon.com/512/174/174857.png\" alt=\"LinkedIn\" width=\"22\" height=\"22\"><\/a><\/td>\n                <td style=\"padding: 0 8px;\"><a href=\"https://heru.trb.ai/wa/3Sha3Zw\" target=\"_blank\"><img src=\"https://cdn-icons-png.flaticon.com/512/733/733585.png\" alt=\"WhatsApp\" width=\"22\" height=\"22\"><\/a><\/td>\n              <\/tr>\n            <\/table>\n          <\/div>\n        <\/td>\n      <\/tr>\n    <\/table>\n  <\/div>\n<\/body>\n<\/html>"}, "1265": {"name": "01_educativo_empresarial", "subject": "Solo 2. Ni una más. ⚖️", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <title>Tu mensual son 2 obligaciones - Heru<\/title>\n  <!--[if mso]>\n  <style type=\"text/css\">\n    body, table, td, a, span, p { font-family: Arial, sans-serif !important; }\n  <\/style>\n  <![endif]-->\n  <style>\n    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght=400;500;700;800&display=swap');\n\n    body, table, td, a {\n      -webkit-text-size-adjust: 100%;\n      -ms-text-size-adjust: 100%;\n    }\n\n    table, td {\n      mso-table-lspace: 0pt;\n      mso-table-rspace: 0pt;\n      border-collapse: collapse !important;\n    }\n\n    img {\n      -ms-interpolation-mode: bicubic;\n      border: 0;\n      height: auto;\n      line-height: 100%;\n      outline: none;\n      text-decoration: none;\n      display: block;\n    }\n\n    body {\n      height: 100% !important;\n      margin: 0 !important;\n      padding: 0 !important;\n      width: 100% !important;\n      background-color: #f4f7f9;\n      font-family: 'DM Sans', Helvetica, Arial, sans-serif;\n      color: #1e293b;\n    }\n\n    .main-table {\n      width: 100%;\n      max-width: 600px;\n      margin: 20px auto;\n      background-color: #ffffff;\n      border-radius: 4px;\n      overflow: hidden;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS (Paddings compactos de cabecera)\n       ========================================================================= */\n    .banner {\n      background-color: #003366;\n      padding: 10px 40px;\n    }\n\n    .chapter {\n      padding: 14px 40px 0 40px;\n      background-color: #ffffff;\n    }\n\n    .hero {\n      padding: 8px 40px 16px 40px;\n      background-color: #ffffff;\n      border-bottom: 1px solid #e2e8f0;\n    }\n\n    .content {\n      padding: 24px 40px;\n    }\n\n    /* Estilo premium de tarjetas con bordes limpios */\n    .step-card {\n      border-left: 3px solid #0091ff;\n      background-color: #ffffff;\n      border-top: 1px solid #f1f5f9;\n      border-right: 1px solid #f1f5f9;\n      border-bottom: 1px solid #f1f5f9;\n      border-radius: 0 8px 8px 0;\n      padding: 16px;\n      margin-bottom: 16px;\n    }\n\n    .deadline-banner {\n      background-color: #fff7ed;\n      border: 1px solid #fed7aa;\n      border-radius: 8px;\n      padding: 14px 16px;\n      margin: 20px 0;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS PARA MÓVIL\n       ========================================================================= */\n    @media screen and (max-width: 600px) {\n      .content, .hero, .chapter, .banner { \n        padding-left: 20px !important; \n        padding-right: 20px !important; \n      }\n      .main-table { \n        margin: 0 auto !important; \n        border-radius: 0 !important; \n      }\n    }\n  <\/style>\n<\/head>\n\n<body>\n  <div style=\"background-color: #f4f7f9; padding: 10px 0;\">\n    <table class=\"main-table\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n      \n      <!-- Banner azul marino -->\n      <tr>\n        <td class=\"banner\">\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td align=\"left\">\n                <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/6a0e028c17d8dcd74a550ebc.jpg\" alt=\"heru\" width=\"70\" style=\"display: block;\">\n              <\/td>\n              <td align=\"right\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; color: #94a3b8;\">3 min de lectura<\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n\n      <!-- Chapter number + tag -->\n      <tr>\n        <td class=\"chapter\">\n          <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 44px; font-weight: 800; color: #0091ff; line-height: 1; padding-right: 14px;\">01<\/td>\n              <td valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #003366; padding-bottom: 4px;\">EDUCATIVO<\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n\n      <!-- Hero (título + subtítulo) -->\n      <tr>\n        <td class=\"hero\">\n          <h1 style=\"margin: 6px 0 0 0; font-size: 25px; line-height: 1.25; font-weight: 700; font-family: 'DM Sans', sans-serif; color: #003366;\">\n            Tu mensual son 2 obligaciones\n          <\/h1>\n          <p style=\"margin: 8px 0 0 0; font-size: 15px; color: #475569; line-height: 1.45; font-family: 'DM Sans', sans-serif;\">\n            ISR e IVA. Sí, son dos. heru hace ambas de forma automática con tus CFDI.\n          <\/p>\n        <\/td>\n      <\/tr>\n\n      <!-- Body Content -->\n      <tr>\n        <td class=\"content\">\n\n          <!-- Saludo Dinámico Adaptable -->\n          <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin: 0 0 12px 0;\">\n            <tr>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 4px;\">Hola<\/td>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 1px;\">{{ params.first_name|default:\"👋🏼\" }}<\/td>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap;\">,<\/td>\n            <\/tr>\n          <\/table>\n\n          <p style=\"color: #475569; font-size: 15px; margin: 0 0 20px 0; line-height: 1.6; font-family: 'DM Sans', sans-serif;\">\n            En el régimen de Actividad Empresarial, lo que comúnmente conocemos como <em>\"tu declaración mensual\"<\/em> en realidad está compuesto por <strong style=\"color: #003366;\">dos obligaciones físcales distintas<\/strong> que deben presentarse juntas. Te las explicamos de forma muy sencilla:\n          <\/p>\n\n          <!-- Card 1: ISR -->\n          <div class=\"step-card\">\n            <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              <tr>\n                <td style=\"font-family: 'DM Sans', sans-serif;\">\n                  <div style=\"font-size: 14px; font-weight: 700; color: #003366; margin-bottom: 4px;\">\n                    1. ISR Provisional <span style=\"white-space: nowrap; display: inline-block;\">💰<\/span>\n                  <\/div>\n                  <div style=\"font-size: 13px; color: #475569; line-height: 1.5;\">\n                    El impuesto sobre la renta del mes, calculado de forma <strong style=\"color: #003366;\">acumulada<\/strong> con lo que llevas en el año. Por eso un mes extraordinariamente bueno puede subir tu tasa temporalmente: el SAT revisa el acumulado anual, no solo el mes en curso.\n                  <\/div>\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/div>\n\n          <!-- Card 2: IVA -->\n          <div class=\"step-card\">\n            <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              <tr>\n                <td style=\"font-family: 'DM Sans', sans-serif;\">\n                  <div style=\"font-size: 14px; font-weight: 700; color: #003366; margin-bottom: 4px;\">\n                    2. IVA Mensual <span style=\"white-space: nowrap; display: inline-block;\">🧾<\/span>\n                  <\/div>\n                  <div style=\"font-size: 13px; color: #475569; line-height: 1.5;\">\n                    La diferencia entre el IVA que les cobraste a tus clientes y el IVA que pagaste en tus gastos de trabajo (deducibles). Si cobraste más de lo que gastaste, se paga la diferencia; de lo contrario, generas un saldo a favor.\n                  <\/div>\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/div>\n\n          <!-- Lo que hace Heru -->\n          <div class=\"deadline-banner\">\n            <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              <tr>\n                <td style=\"font-family: 'DM Sans', sans-serif;\">\n                  <p style=\"margin: 0; font-size: 13.5px; color: #9a3412; line-height: 1.55;\">\n                    <strong>¿Cómo te ayuda heru?<\/strong> Olvídate de subir facturas de forma manual. Al conectar tu cuenta del SAT, nosotros las descargamos automáticamente, calculamos tus impuestos y presentamos tus 2 obligaciones por ti.\n                  <\/p>\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/div>\n\n          <!-- Footer Final (Sin caja de blog, con el enlace corto de soporte en su lugar) -->\n          <div style=\"text-align: center; margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 24px;\">\n            <p style=\"margin: 0 0 16px 0; font-size: 12px; color: #94a3b8; line-height: 1.5; font-family: 'DM Sans', sans-serif;\">\n              ¿Quieres saber más? <a href=\"https://www.heru.app/blog/impuestos-actividad-empresarial/\" style=\"color: #0091ff; text-decoration: none; font-weight: 700;\">Guía de tus obligaciones →<\/a>\n            <\/p>\n\n            <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\" style=\"margin: 0 auto;\">\n              <tr>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://instagram.com/somosheru\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/174/174855.png\" alt=\"Instagram\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://www.facebook.com/somosheru\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/124/124010.png\" alt=\"Facebook\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://www.linkedin.com/company/somosheru/\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/174/174857.png\" alt=\"LinkedIn\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://heru.trb.ai/wa/3Sha3Zw\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/733/733585.png\" alt=\"WhatsApp\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/div>\n        <\/td>\n      <\/tr>\n    <\/table>\n  <\/div>\n<\/body>\n\n<\/html>"}, "1277": {"name": "03__educativo_empresarial", "subject": "Factura de gasto que no pides = IVA perdido 💸", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <title>Acredita el IVA que pagaste - Heru<\/title>\n  <!--[if mso]>\n  <style type=\"text/css\">\n    body, table, td, a, span, p { font-family: Arial, sans-serif !important; }\n  <\/style>\n  <![endif]-->\n  <style>\n    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght=400;500;700;800&display=swap');\n\n    body, table, td, a {\n      -webkit-text-size-adjust: 100%;\n      -ms-text-size-adjust: 100%;\n    }\n\n    table, td {\n      mso-table-lspace: 0pt;\n      mso-table-rspace: 0pt;\n      border-collapse: collapse !important;\n    }\n\n    img {\n      -ms-interpolation-mode: bicubic;\n      border: 0;\n      height: auto;\n      line-height: 100%;\n      outline: none;\n      text-decoration: none;\n      display: block;\n    }\n\n    body {\n      height: 100% !important;\n      margin: 0 !important;\n      padding: 0 !important;\n      width: 100% !important;\n      background-color: #f4f7f9;\n      font-family: 'DM Sans', Helvetica, Arial, sans-serif;\n      color: #1e293b;\n    }\n\n    .main-table {\n      width: 100%;\n      max-width: 600px;\n      margin: 20px auto;\n      background-color: #ffffff;\n      border-radius: 4px;\n      overflow: hidden;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS (Paddings compactos de cabecera alineados)\n       ========================================================================= */\n    .banner {\n      background-color: #003366;\n      padding: 10px 40px;\n    }\n\n    .chapter {\n      padding: 14px 40px 0 40px;\n      background-color: #ffffff;\n    }\n\n    .hero {\n      padding: 8px 40px 16px 40px;\n      background-color: #ffffff;\n      border-bottom: 1px solid #e2e8f0;\n    }\n\n    .content {\n      padding: 24px 40px;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS PARA MÓVIL\n       ========================================================================= */\n    @media screen and (max-width: 600px) {\n      .content, .hero, .chapter, .banner { \n        padding-left: 20px !important; \n        padding-right: 20px !important; \n      }\n      .main-table { \n        margin: 0 auto !important; \n        border-radius: 0 !important; \n      }\n    }\n  <\/style>\n<\/head>\n\n<body>\n  <div style=\"background-color: #f4f7f9; padding: 10px 0;\">\n    <table class=\"main-table\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n\n      <!-- Banner azul marino -->\n      <tr>\n        <td class=\"banner\">\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td align=\"left\">\n                <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/6a0e028c17d8dcd74a550ebc.jpg\" alt=\"heru\" width=\"70\" style=\"display: block;\">\n              <\/td>\n              <td align=\"right\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; color: #94a3b8;\">1 min de lectura<\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n\n      <!-- Chapter number + tag -->\n      <tr>\n        <td class=\"chapter\">\n          <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 44px; font-weight: 800; color: #0091ff; line-height: 1; padding-right: 14px;\">03<\/td>\n              <td valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #003366; padding-bottom: 4px;\">EDUCATIVO<\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n\n      <!-- Hero (título + subtítulo) -->\n      <tr>\n        <td class=\"hero\">\n          <h1 style=\"margin: 6px 0 0 0; font-size: 25px; line-height: 1.25; font-weight: 700; font-family: 'DM Sans', sans-serif; color: #003366;\">\n            Acredita el IVA que pagaste\n          <\/h1>\n          <p style=\"margin: 8px 0 0 0; font-size: 15px; color: #475569; line-height: 1.45; font-family: 'DM Sans', sans-serif;\">\n            El IVA de tus gastos resta directo al IVA que cobraste. heru lo cruza por ti. Hay dos cosas que vale la pena saber.\n          <\/p>\n        <\/td>\n      <\/tr>\n\n      <!-- Body Content (Estilo Editorial Premium) -->\n      <tr>\n        <td class=\"content\">\n          \n          <!-- Saludo Dinámico Horizontal -->\n          <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin: 0 0 16px 0;\">\n            <tr>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 4px;\">Hola<\/td>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 1px;\">{{ params.first_name|default:\"👋🏼\" }}<\/td>\n              <td style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap;\">,<\/td>\n            <\/tr>\n          <\/table>\n\n          <p style=\"color: #475569; font-size: 15px; margin: 0 0 28px 0; line-height: 1.6; font-family: 'DM Sans', sans-serif;\">\n            El IVA no es ganancia tuya ni del proveedor, es un impuesto que pasa por en medio. Por eso el IVA que <strong>pagas<\/strong> en tus gastos se acredita contra el que <strong>cobras<\/strong>. heru ya lee tus CFDI directo del SAT y los cruza de forma automática.\n          <\/p>\n\n          <h2 style=\"font-size: 16px; color: #003366; margin: 0 0 20px 0; font-weight: 800; font-family: 'DM Sans', sans-serif; letter-spacing: -0.3px;\">Los 2 puntos que importan<\/h2>\n\n          <!-- Punto 1 -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 24px;\">\n            <tr>\n              <td valign=\"top\" width=\"30\" style=\"font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 800; color: #0091ff; line-height: 1;\">\n                01\n              <\/td>\n              <td valign=\"top\" style=\"font-family: 'DM Sans', sans-serif; padding-left: 12px;\">\n                <div style=\"font-size: 15px; font-weight: 700; color: #003366; margin-bottom: 4px;\">\n                  Sin CFDI no hay IVA acreditable\n                <\/div>\n                <div style=\"font-size: 13.5px; color: #475569; line-height: 1.55;\">\n                  Pago sin factura es igual a IVA perdido. Pide factura siempre que puedas, aunque sea una compra pequeña. Sumadas a fin de mes hacen una gran diferencia en tu declaración.\n                <\/div>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Punto 2 -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 24px;\">\n            <tr>\n              <td valign=\"top\" width=\"30\" style=\"font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 800; color: #0091ff; line-height: 1;\">\n                02\n              <\/td>\n              <td valign=\"top\" style=\"font-family: 'DM Sans', sans-serif; padding-left: 12px;\">\n                <div style=\"font-size: 15px; font-weight: 700; color: #003366; margin-bottom: 4px;\">\n                  Los \"PPD\" necesitan complemento de pago\n                <\/div>\n                <div style=\"font-size: 13.5px; color: #475569; line-height: 1.55;\">\n                  El SAT solo acepta IVA acreditable de gastos <strong>efectivamente pagados<\/strong>. Si un CFDI dice \"PPD\" (pago en parcialidades), el proveedor tiene que emitir un complemento por cada pago. Sin él, el IVA no se puede acreditar.\n                <\/div>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Highlight Box (Estructura de dos columnas blindada contra desbordes de emojis) -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #f8fafc; border-left: 3px solid #003366; margin: 28px 0;\">\n            <tr>\n              <td style=\"padding: 16px 20px; font-family: 'DM Sans', sans-serif;\">\n                <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                  <tr>\n                    <!-- Celda aislada para el emoji -->\n                    <td valign=\"top\" width=\"24\" style=\"font-size: 15px; line-height: 1; padding-top: 3px;\">💡<\/td>\n                    <!-- Celda de texto -->\n                    <td valign=\"top\" style=\"font-family: 'DM Sans', sans-serif; font-size: 13.5px; color: #003366; line-height: 1.6; padding-left: 6px;\">\n                      <strong>Tranquilo:<\/strong> A finales de mes, heru te recordará solicitar las facturas de tus gastos de trabajo y podrás verificar de inmediato qué CFDIs te hacen falta para asegurar tu saldo de IVA.\n                    <\/td>\n                  <\/tr>\n                <\/table>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Footer Final (Alineado con tus plantillas) -->\n          <div style=\"text-align: center; margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 24px;\">\n            <p style=\"font-size: 12px; color: #94a3b8; margin: 0 0 15px 0; font-family: 'DM Sans', sans-serif;\">\n              ¿Preguntas? Escríbenos a ayuda@heru-app.com\n            <\/p>\n            <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\" style=\"margin: 0 auto;\">\n              <tr>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://instagram.com/somosheru\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/174/174855.png\" alt=\"Instagram\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://www.facebook.com/somosheru\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/124/124010.png\" alt=\"Facebook\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://www.linkedin.com/company/somosheru/\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/174/174857.png\" alt=\"LinkedIn\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n                <td style=\"padding: 0 8px;\">\n                  <a href=\"https://heru.trb.ai/wa/3Sha3Zw\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/733/733585.png\" alt=\"WhatsApp\" width=\"22\" height=\"22\">\n                  <\/a>\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/div>\n        <\/td>\n      <\/tr>\n    <\/table>\n  <\/div>\n<\/body>\n\n<\/html>"}, "1293": {"name": "Consulta_ NSS", "subject": "Mira tu número de seguridad social", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"x-apple-disable-message-reformatting\">\n<title>Número de Seguridad Social Listo - heru<\/title>\n<style>\n  /* CONFIGURACIÓN GENERAL */\n  body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }\n  table { border-collapse: collapse; }\n  img { display: block; border: 0; outline: none; text-decoration: none; max-width: 100%; }\n  a { text-decoration: none; }\n  .preheader { display: none; max-height: 0; overflow: hidden; mso-hide: all; opacity: 0; }\n\n  /* ESTILOS DE LA MARCA */\n  .bg-heru { background-color: #003366 !important; }\n  .text-heru { color: #003366 !important; }\n\n  .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; }\n  .slogan { font-size: 11px; color: #94a3b8; font-weight: 500; }\n  \n  /* JERARQUÍA DE TEXTO EN EL BANNER */\n  .banner-tag { margin: 0 0 10px 0; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; opacity: 0.75; color: #ffffff; }\n  .banner-title { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700; color: #ffffff; }\n  .banner-subtitle { margin: 12px 0 0 0; font-size: 15px; line-height: 1.5; opacity: 0.9; color: #ffffff; }\n  \n  .body-text { font-size: 15px; color: #334155; line-height: 1.6; margin: 0; }\n  .body-muted { font-size: 14px; color: #777777; line-height: 1.5; margin: 0; }\n\n  .cta-button { display: inline-block; background-color: #003366; color: #ffffff !important; padding: 16px 40px; border-radius: 50px; font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 6px rgba(0,51,102,0.2); }\n\n  @media only screen and (max-width: 600px) {\n    .container { width: 100% !important; border-radius: 0; }\n    .header-pad { padding: 20px 24px !important; }\n    .banner-pad { padding: 28px 24px !important; }\n    .banner-title { font-size: 21px !important; }\n    .px-mobile { padding-left: 24px !important; padding-right: 24px !important; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<span class=\"preheader\">¡Excelentes noticias! Ya puedes consultar tu Número de Seguridad Social en la app de heru.<\/span>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  <tr>\n    <td align=\"center\" style=\"padding: 40px 12px;\">\n\n      <table role=\"presentation\" class=\"container\" width=\"600\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\n        <!-- HEADER UNIFICADO -->\n        <tr>\n          <td class=\"header-pad\" style=\"padding: 24px 36px; background-color: #ffffff;\">\n            <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              <tr>\n                <td align=\"left\">\n                  <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru\" width=\"72\" />\n                <\/td>\n                <td align=\"right\" class=\"slogan\">\n                  tus impuestos sin estrés\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/td>\n        <\/tr>\n\n        <!-- BANNER AZUL -->\n        <tr>\n          <td class=\"banner-pad bg-heru\" style=\"padding: 28px 36px; color: #ffffff;\">\n            <p class=\"banner-tag\">Actualización IMSS<\/p>\n            <h1 class=\"banner-title\">¡Excelentes noticias!<\/h1>\n            <p class=\"banner-subtitle\">Tu Número de Seguridad Social ya se encuentra disponible para consulta.<\/p>\n          <\/td>\n        <\/tr>\n\n        <!-- CUERPO DEL CORREO -->\n        <tr>\n          <td style=\"padding: 40px 40px 20px;\" class=\"px-mobile\">\n            <p class=\"body-text\"><span style=\"white-space: nowrap;\">¡Hola! 👋<\/span><\/p>\n          <\/td>\n        <\/tr>\n        <tr>\n          <td style=\"padding: 0 40px 30px;\" class=\"px-mobile\">\n            <p class=\"body-text\">\n              Ya puedes consultar tu <strong>Número de Seguridad Social (NSS)<\/strong> directamente en la app de <strong>heru<\/strong> haciendo clic en el siguiente botón o ingresando por tu cuenta a la sección de <em>\"Nueva regulación IMSS\"<\/em>.\n            <\/p>\n          <\/td>\n        <\/tr>\n\n        <!-- CTA PRINCIPAL -->\n        <tr>\n          <td align=\"center\" style=\"padding: 0 40px 35px;\" class=\"px-mobile\">\n            <a href=\"https://web.heru.app/new-imss-regulations?tab=imss\" class=\"cta-button\" target=\"_blank\">Consultar mi número de seguridad social<\/a>\n          <\/td>\n        <\/tr>\n\n        <!-- CIERRE DE CORREO -->\n        <tr>\n          <td style=\"padding: 0 40px 20px;\" class=\"px-mobile\">\n            <p class=\"body-text\">\n              Gracias por confiar en nosotros para ayudarte a seguir generando ingresos con tranquilidad, cumpliendo con todos los requisitos de las plataformas y el IMSS.\n            <\/p>\n          <\/td>\n        <\/tr>\n\n        <!-- SECCIÓN DE PLATAFORMAS ALIADAS -->\n        <tr>\n          <td align=\"center\" style=\"padding: 10px 40px 20px;\" class=\"px-mobile\">\n            <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom: 12px;\">\n              <tr><td style=\"border-top: 1px solid #e8e8e6; height: 1px; line-height: 1px; font-size: 1px;\">&nbsp;<\/td><\/tr>\n            <\/table>\n            <p style=\"font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; margin: 15px 0 15px 0; text-align: center;\">Nuestras plataformas aliadas<\/p>\n            <img src=\"https://d2xdgxd31vfz2r.cloudfront.net/1604600448/assets/005c72f2870d4985bd38d0fadc2aaddb.jpeg\" alt=\"Plataformas aliadas\" style=\"display:block; width: 100%; border-radius: 8px; border: 0;\" />\n          <\/td>\n        <\/tr>\n\n        <!-- SOPORTE Y REDES SOCIALES INTEGRADOS (Estilo Compra Exitosa) -->\n        <tr>\n          <td style=\"padding: 0 40px 35px;\" class=\"px-mobile\" align=\"center\">\n            \n            <!-- Preguntas de Soporte -->\n            <p style=\"font-size: 12.5px; color: #64748b; text-align: center; margin: 15px 0 15px 0; line-height: 1.4;\">\n              ¿Preguntas? Escríbenos a <a href=\"mailto:ayuda@heru-app.com\" style=\"color: #0091ff; text-decoration: none; font-weight: 600;\">ayuda@heru-app.com<\/a>\n            <\/p>\n\n            <!-- Redes Sociales Integradas -->\n            <table width=\"160\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\" style=\"margin: 0 auto 10px;\">\n              <tr>\n                <td align=\"left\" width=\"35\">\n                  <a href=\"https://instagram.com/somosheru\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/174/174855.png\" alt=\"Instagram\" style=\"width: 24px; height: 24px; display: block; border: 0;\">\n                  <\/a>\n                <\/td>\n                <td align=\"center\" width=\"35\">\n                  <a href=\"https://www.facebook.com/somosheru\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/124/124010.png\" alt=\"Facebook\" style=\"width: 24px; height: 24px; display: block; border: 0;\">\n                  <\/a>\n                <\/td>\n                <td align=\"center\" width=\"35\">\n                  <a href=\"https://www.linkedin.com/company/somosheru/\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/174/174857.png\" alt=\"LinkedIn\" style=\"width: 24px; height: 24px; display: block; border: 0;\">\n                  <\/a>\n                <\/td>\n                <td align=\"right\" width=\"35\">\n                  <a href=\"https://heru.trb.ai/wa/3Sha3Zw\" target=\"_blank\">\n                    <img src=\"https://cdn-icons-png.flaticon.com/512/733/733585.png\" alt=\"WhatsApp\" style=\"width: 24px; height: 24px; display: block; border: 0;\">\n                  <\/a>\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/td>\n        <\/tr>\n\n      <\/table>\n\n    <\/td>\n  <\/tr>\n<\/table>\n\n<\/body>\n<\/html>"}, "1248": {"name": "P0 — Sin credenciales", "subject": "Ya casi te quitamos ese pendiente 📋", "htmlContent": "<!doctype html>\n<html lang=\"es\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:v=\"urn:schemas-microsoft-com:vml\">\n<head>\n  <title>Ya casi te quitamos ese pendiente<\/title>\n  <meta charset=\"UTF-8\" />\n  <meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\" />\n  <meta name=\"x-apple-disable-message-reformatting\" />\n  <style type=\"text/c
