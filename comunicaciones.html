ans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      Seguimos avanzando con tu declaración de <strong>{{ params.mes_declaracion }} {{ params.anio_declaracion }}<\/strong>. El equipo ya está trabajando en ella y pronto la tendrás lista.\n                    <\/td>\n                  <\/tr>\n                  <tr>\n                    <td style=\"padding-top: 14px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      No tienes que hacer nada de tu parte. En cuanto esté lista te avisamos de inmediato. 🙌\n                    <\/td>\n                  <\/tr>\n\n                  <!-- Bloque de estado -->\n                  <tr>\n                    <td style=\"padding-top: 24px;\">\n                      <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse; background-color: #f4f7f9; border-radius: 8px; width: 100%;\">\n                        <tbody>\n                          <tr>\n                            <td style=\"padding: 16px 20px;\">\n                              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                                <tbody>\n                                  <tr>\n                                    <td style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #888888; padding-bottom: 4px;\">ESTADO DE TU DECLARACIÓN<\/td>\n                                  <\/tr>\n                                  <tr>\n                                    <td style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: bold; color: #f0a500;\">🔄 En proceso. El equipo está trabajando<\/td>\n                                  <\/tr>\n                                <\/tbody>\n                              <\/table>\n                            <\/td>\n                          <\/tr>\n                        <\/tbody>\n                      <\/table>\n                    <\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n            <\/td>\n          <\/tr>\n\n          <!-- CTA -->\n          <tr>\n            <td align=\"center\" style=\"padding: 0 25px 28px 25px;\">\n              <a href=\"https://web.heru.app/declarations/\" style=\"background-color: #518dec; color: #ffffff; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: bold; text-decoration: none; padding: 14px 32px; border-radius: 6px; display: inline-block;\">Ingresa a heru<\/a>\n            <\/td>\n          <\/tr>\n\n          <!-- FOOTER -->\n          <tr>\n            <td style=\"background-color: #f4f7f9; padding: 20px 25px; border-top: 1px solid #e8ecf0;\">\n              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                <tbody>\n                  <tr>\n                    <td style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #888888; line-height: 1.5;\">\n                      Estamos contigo en cada paso.<br/>\n                      <strong style=\"color: #518dec;\">El equipo de heru 💚<\/strong>\n                    <\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n            <\/td>\n          <\/tr>\n\n        <\/tbody>\n      <\/table>\n      <\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/body>\n<\/html>"}, "1251": {"name": "P3 — Lista", "subject": "¡Tu declaración de {{ params.mes_declaracion }} está lista! 🎉", "htmlContent": "<!doctype html>\n<html lang=\"es\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:v=\"urn:schemas-microsoft-com:vml\">\n<head>\n  <title>¡Tu declaración está lista!<\/title>\n  <meta charset=\"UTF-8\" />\n  <meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\" />\n  <meta name=\"x-apple-disable-message-reformatting\" />\n  <style type=\"text/css\">\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: 'Helvetica', Arial, sans-serif; }\n    @media only screen and (max-width: 480px) {\n      .container { width: 100% !important; }\n      .content-padding { padding-left: 15px !important; padding-right: 15px !important; }\n      .logo-cell { font-size: 32px !important; }\n      .cta-btn { padding: 12px 20px !important; font-size: 14px !important; }\n    }\n  <\/style>\n<\/head>\n<body style=\"font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; background-color: #f4f7f9; margin: 0; padding: 0;\">\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"background-color: #f4f7f9; border-collapse: collapse;\" width=\"100%\">\n  <tbody>\n    <tr>\n      <td align=\"center\" style=\"padding: 10px 0;\">\n      <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"container\" role=\"presentation\" style=\"background-color: #ffffff; border-radius: 8px; overflow: hidden; width: 550px; margin: 0 auto; border-collapse: collapse;\" width=\"550\">\n        <tbody>\n\n          <!-- HEADER: Logo -->\n          <tr>\n            <td style=\"padding: 10px 25px; background-color: #ffffff;\">\n            <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n              <tbody>\n                <tr>\n                  <td align=\"left\" class=\"logo-cell\" style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 34px; font-weight: bold; color: #518dec; line-height: 1; letter-spacing: -1.5px; padding: 0;\" valign=\"middle\">heru<\/td>\n                <\/tr>\n              <\/tbody>\n            <\/table>\n            <\/td>\n          <\/tr>\n\n          <!-- HERO -->\n          <tr>\n            <td style=\"background-color: #1a3a5a; padding: 32px 25px 28px 25px;\">\n              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                <tbody>\n                  <tr>\n                    <td style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 22px; font-weight: bold; color: #ffffff; line-height: 1.3;\">\n                      ¡Tu declaración está lista! 🎉\n                    <\/td>\n                  <\/tr>\n                  <tr>\n                    <td style=\"padding-top: 10px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #ffffff; line-height: 1.5;\">\n                      Declaración de <strong>{{ params.mes_declaracion }} {{ params.anio_declaracion }}<\/strong>. Lista para revisar.\n                    <\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n            <\/td>\n          <\/tr>\n\n          <!-- BODY -->\n          <tr>\n            <td class=\"content-padding\" style=\"padding: 28px 25px;\">\n              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                <tbody>\n                  <tr>\n                    <td style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      Hola <strong>{{ params.name }}<\/strong> 👋\n                    <\/td>\n                  <\/tr>\n                  <tr>\n                    <td style=\"padding-top: 14px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      ¡Listo! Tu declaración de <strong>{{ params.mes_declaracion }} {{ params.anio_declaracion }}<\/strong> ya está lista. Puedes consultarla directamente en la app o revisar tu correo con todos los detalles.\n                    <\/td>\n                  <\/tr>\n                  <tr>\n                    <td style=\"padding-top: 14px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      Si tienes alguna duda sobre el monto o el proceso, con gusto te ayudamos. Muchas gracias por confiar en heru ❤️\n                    <\/td>\n                  <\/tr>\n\n                  <!-- Bloque de estado -->\n                  <tr>\n                    <td style=\"padding-top: 24px;\">\n                      <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse; background-color: #f0fff4; border-radius: 8px; border: 1px solid #3ddc84; width: 100%;\">\n                        <tbody>\n                          <tr>\n                            <td style=\"padding: 16px 20px;\">\n                              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                                <tbody>\n                                  <tr>\n                                    <td style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #888888; padding-bottom: 4px;\">ESTADO DE TU DECLARACIÓN<\/td>\n                                  <\/tr>\n                                  <tr>\n                                    <td style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: bold; color: #1a7a3c;\">✅ Lista. Entra a revisarla y pagar<\/td>\n                                  <\/tr>\n                                <\/tbody>\n                              <\/table>\n                            <\/td>\n                          <\/tr>\n                        <\/tbody>\n                      <\/table>\n                    <\/td>\n                  <\/tr>\n\n                  <!-- CTA -->\n                  <tr>\n                    <td align=\"center\" style=\"padding-top: 28px; padding-bottom: 8px;\">\n                      <a class=\"cta-btn\" href=\"https://web.heru.app/declarations/\" style=\"background-color: #518dec; color: #ffffff; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: bold; text-decoration: none; padding: 14px 32px; border-radius: 6px; display: inline-block;\">\n                        Ver mi declaración\n                      <\/a>\n                    <\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n            <\/td>\n          <\/tr>\n\n          <!-- FOOTER -->\n          <tr>\n            <td style=\"background-color: #f4f7f9; padding: 20px 25px; border-top: 1px solid #e8ecf0;\">\n              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                <tbody>\n                  <tr>\n                    <td style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #888888; line-height: 1.5;\">\n                      Muchas gracias por confiar en heru.<br/>\n                      <strong style=\"color: #518dec;\">El equipo de heru 💚<\/strong>\n                    <\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n            <\/td>\n          <\/tr>\n\n        <\/tbody>\n      <\/table>\n      <\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/body>\n<\/html>"}, "976": {"name": "Declaración_lista_ all", "subject": "Tu declaracion esta lista - heru", "htmlContent": "<html lang=\"en\">\n\n<body>\n  <title>\n  <\/title>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>\n    Declaración Mensual Lista\n  <\/title>\n  <style>\n    @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&display=swap');\n\n    body {\n      margin: 0;\n      padding: 0;\n      font-family: 'Lexend Deca', sans-serif;\n      background-color: #f8fbfd;\n      /* Fondo muy claro */\n      -webkit-font-smoothing: antialiased;\n      -moz-osx-font-smoothing: grayscale;\n    }\n\n    table {\n      border-collapse: collapse;\n    }\n\n    h1,\n    h2,\n    h3,\n    h4,\n    p {\n      margin: 0;\n      font-family: 'Lexend Deca', sans-serif;\n    }\n\n    .container {\n      max-width: 600px;\n      margin: 0 auto;\n      background-color: #ffffff;\n      border-radius: 16px;\n      /* Bordes más redondeados */\n      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);\n      /* Sombra sutil para un efecto flotante */\n      overflow: hidden;\n      /* Para que la imagen de cabecera respete los bordes */\n      border: 1px solid #e0e6ed;\n    }\n\n    .header-banner {\n      background-color: #4c82f7;\n      /* Azul principal */\n      /* background-image: linear-gradient(to right, #4c82f7, #6c9bff);\n      <-- ELIMINADO para compatibilidad */\n      padding: 40px 25px;\n      text-align: center;\n      color: #ffffff;\n    }\n\n    .header-banner h1 {\n      font-size: 28px;\n      font-weight: 700;\n      line-height: 1.3;\n      margin-bottom: 10px;\n    }\n\n    .header-banner p {\n      font-size: 16px;\n      font-weight: 400;\n      opacity: 0.9;\n    }\n\n    .content-area {\n      padding: 30px 25px;\n      /* Padding generoso para el contenido */\n    }\n\n    .button {\n      display: block;\n      text-decoration: none;\n      font-weight: 600;\n      text-align: center;\n      border-radius: 8px;\n      padding: 15px;\n      transition: background-color 0.3s ease;\n    }\n\n    .button-primary {\n      background-color: #2e6ff7;\n      /* Azul más brillante */\n      color: #ffffff;\n      font-size: 17px;\n      box-shadow: 0 4px 10px rgba(46, 111, 247, 0.4);\n      /* Sombra para el botón */\n    }\n\n    .button-primary:hover {\n      background-color: #2151c7;\n    }\n\n    .money-amount {\n      font-weight: 700;\n      color: #1a3a70;\n      /* Azul muy oscuro para cifras */\n    }\n\n    .payment-card {\n      background-color: #f6faff;\n      /* Azul muy claro y suave */\n      border-radius: 12px;\n      padding: 40px;\n      /* AUMENTADO: Padding interno de la tarjeta */\n      text-align: center;\n      border: 1px solid #dbeafe;\n      /* Borde más suave */\n      width: 100%;\n      /* CAMBIADO: Ocupará el 100% de la celda contenedora */\n      /* width: 90%;  <-- ELIMINADO */\n      /* margin: 40px auto; <-- ELIMINADO */\n    }\n\n    .payment-card-title {\n      color: #2563eb;\n      /* Azul para el título */\n      margin: 20px 0 18px 0;\n      /* AÑADIDO: Margen superior de 20px */\n      font-size: 24px;\n      font-weight: 700;\n      text-align: center;\n    }\n\n    .total-amount-large {\n      font-size: 42px;\n      /* Más grande */\n      font-weight: 800;\n      /* Extra negrita */\n      color: #1a3a70;\n      margin: 10px 0 25px 0;\n      /* AUMENTADO: Margen inferior */\n      display: block;\n    }\n\n    .due-date {\n      font-size: 17px;\n      color: #3f5b8f;\n      /* Tono de azul-gris para la fecha */\n      margin-bottom: 30px;\n      /* AUMENTADO: Margen inferior */\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-weight: 500;\n    }\n\n    .due-date-icon {\n      width: 18px;\n      height: 18px;\n      vertical-align: middle;\n      margin-right: 8px;\n      fill: #2563eb;\n      /* Color del ícono */\n    }\n\n    /* --- TABLA DE RESUMEN MEJORADA (NUEVO ESTILO COMPACTO) --- */\n\n    .summary-table {\n      width: 100%;\n      border-collapse: collapse;\n      /* Volver a colapsar */\n      border-radius: 8px;\n      /* Bordes redondeados para la tabla */\n      overflow: hidden;\n      /* Para recortar las filas */\n      border: 1px solid #e0e6ed;\n      /* Borde único */\n    }\n\n    .summary-table tr {\n      background-color: #ffffff;\n      border-bottom: 1px solid #e0e6ed;\n      /* Línea entre filas */\n    }\n\n    .summary-table tr:last-child {\n      border-bottom: none;\n      /* Sin línea en la última fila */\n    }\n\n    .summary-table td {\n      padding: 14px 18px;\n      /* Padding ajustado */\n      font-size: 15px;\n      color: #4a5568;\n      vertical-align: middle;\n      letter-spacing: -0.1px;\n    }\n\n    .summary-table td.label {\n      font-weight: 500;\n      /* Peso más ligero */\n      color: #2d3748;\n      width: 60%;\n      border-right: 1px solid #e0e6ed;\n      /* --- LÍNEA DIVISORIA AÑADIDA --- */\n    }\n\n    .summary-table td.value {\n      text-align: right;\n      width: 40%;\n      font-weight: 600;\n      /* Valor un poco más grueso */\n    }\n\n    .section-heading {\n      font-size: 26px;\n      font-weight: 700;\n      color: #1a3a70;\n      text-align: center;\n      margin-bottom: 30px;\n    }\n\n    /* --- FOOTER MEJORADO --- */\n\n    .footer-light {\n      background-color: #f0f4f7;\n      /* Fondo más claro para el footer */\n      text-align: center;\n      font-family: 'Lexend Deca', sans-serif;\n      padding: 30px 20px 20px 20px;\n      border-radius: 0 0 16px 16px;\n      border-top: 1px solid #e0e6ed;\n    }\n\n    .footer-light p {\n      font-size: 13px;\n      color: #64748b;\n      line-height: 1.6;\n      margin-bottom: 8px;\n    }\n\n    .footer-light .brand {\n      font-size: 16px;\n      color: #2d3748;\n      margin-bottom: 15px;\n      font-weight: 600;\n    }\n\n    .footer-light a {\n      color: #2563eb;\n      /* Color de enlace azul */\n      text-decoration: none;\n    }\n\n    .footer-light a:hover {\n      text-decoration: underline;\n    }\n\n    .social-icons {\n      margin-bottom: 20px;\n    }\n\n    .social-icons img {\n      width: 28px;\n      /* Íconos un poco más pequeños */\n      height: 28px;\n    }\n  <\/style>\n  <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\"\n    style=\"background-color: rgb(248, 251, 253); border-collapse: collapse; empty-cells: show; font-size: 16px; font-family: Arial;\"\n    fr-original-style=\"background-color: #f8fbfd;\">\n    <tbody>\n      <tr>\n        <td align=\"center\"\n          style=\"padding: 25px 15px; min-width: 5px; user-select: text; border: 0px solid transparent; background: unset;\"\n          fr-original-style=\"padding: 25px 15px;\">\n          <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\"\n            style=\"border-collapse: collapse; border: 1px solid rgb(224, 230, 237); empty-cells: show; max-width: 600px; font-size: 16px; font-family: Arial; margin: 0px auto; background-color: rgb(255, 255, 255); border-radius: 16px; box-shadow: rgba(0, 0, 0, 0.05) 0px 10px 30px; overflow: hidden;\"\n            fr-original-style=\"border-collapse: collapse; border: 1px solid rgb(224, 230, 237); empty-cells: show; max-width: 600px; font-size: 16px; font-family: Arial; margin: 0px auto; background-color: rgb(255, 255, 255); border-radius: 16px; box-shadow: rgba(0, 0, 0, 0.05) 0px 10px 30px; overflow: hidden;\"\n            fr-original-class=\"container\">\n            <tbody>\n              <tr>\n                <td\n                  style=\"min-width: 5px; user-select: text; border: 1px solid transparent; padding: 0px; text-align: center; background: unset;\"\n                  fr-original-style=\"padding: 0px;\" fr-original-class=\"header-banner\">\n                  <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/690e9a44c7232eb39ca0327e.png\" alt=\"¡Tu declaración mensual está lista!\" width=\"100%\" style=\"display: block; width: 100%; max-width: 100%; height: auto; border: 0px; margin: 0px; padding: 0px;\" fr-original-style=\"display: block; width: 100%; max-width: 100%; height: auto; border: 0px;\">\n                <\/td>\n              <\/tr>\n              <tr>\n                <td\n                  style=\"min-width: 5px; user-select: text; border: 1px solid transparent; padding: 30px 25px; background: unset;\"\n                  fr-original-style=\"min-width: 5px; user-select: text; border: 1px solid transparent; padding: 30px 25px; background: unset;\"\n                  fr-original-class=\"content-area\">\n                  <p style=\"text-align: left; color: rgb(45, 55, 72); font-size: 18px; line-height: 1.7; margin: 0px 0px 20px;\"\n                    fr-original-style=\"text-align: left; color: #2d3748; font-size: 18px; line-height: 1.7; margin-bottom: 20px;\">\n                    Hola\n                    <strong style=\"font-weight: 700;\" fr-original-style=\"font-weight: 700;\">\n                            {{ params.name }}<\/strong>,\n                  <\/p>\n                  <p style=\"text-align: left; color: rgb(74, 85, 104); font-size: 16px; line-height: 1.6; margin: 0px;\"\n                    fr-original-style=\"text-align: left; color: #4a5568; font-size: 16px; line-height: 1.6; margin-bottom: 0;\">\n                    Es un gusto saludarte de nuevo. En esta ocasión nos ponemos en contacto contigo para compartirte tu\n                    declaración de\n                    <strong style=\"font-weight: 700;\" fr-original-style=\"font-weight: 700;\">\n                            {{params.mes_en_curso }}<\/strong>. A continuación encontrarás todos los detalles de la presentación de este mes.\n                  <\/p>\n                  <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\"\n                    style=\"height: 40px; font-size: 1px; line-height: 1px; border-collapse: collapse; empty-cells: show; font-family: Arial;\"\n                    fr-original-style=\"height: 40px; font-size: 1px; line-height: 1px;\">\n                    <tbody>\n                      <tr>\n                        <td style=\"min-width: 5px; user-select: text; border: 0px solid transparent; background: unset;\"\n                          fr-original-style=\"min-width: 5px; user-select: text; border: 0px solid transparent; backgroun {\n            mso-table-lspace: 0pt;\n            mso-table-rspace: 0pt;\n            border-collapse: collapse !important;\n        }\n\n        img {\n            -ms-interpolation-mode: bicubic;\n            border: 0;\n            height: auto;\n            line-height: 100%;\n            outline: none;\n            text-decoration: none;\n        }\n\n        body {\n            height: 100% !important;\n            margin: 0 !important;\n            padding: 0 !important;\n            width: 100% !important;\n            background-color: #f8fafc;\n            font-family: 'DM Sans', Helvetica, Arial, sans-serif;\n            color: #1e293b;\n        }\n\n        p, strong, td, span, a {\n            font-family: 'DM Sans', Helvetica, Arial, sans-serif !important;\n        }\n\n        .main-table {\n            width: 100%;\n            max-width: 560px;\n            margin: 20px auto;\n            background-color: #ffffff;\n            border-radius: 16px;\n            overflow: hidden;\n            border: 1px solid #e2e8f0;\n            box-shadow: 0 10px 25px -5px rgba(30, 41, 59, 0.05);\n        }\n\n        .header {\n            padding: 20px 40px 15px;\n            background-color: #ffffff;\n            border-bottom: 1px solid #f1f5f9;\n        }\n\n        /* Línea superior con el azul de Heru */\n        .top-accent {\n            background-color: #3b82f6;\n            height: 4px;\n            line-height: 4px;\n            font-size: 1px;\n        }\n\n        /* Banner Superior Azul Marino Oficial (#243f60) */\n        .hero {\n            background-color: #243f60 !important;\n            padding: 30px 40px;\n            color: #ffffff;\n            text-align: left;\n        }\n\n        .hero-subtitle {\n            text-transform: uppercase;\n            font-size: 10px;\n            letter-spacing: 2px;\n            font-weight: 700;\n            margin-bottom: 6px;\n            opacity: 0.9;\n            margin-top: 0px;\n            color: #ffffff;\n        }\n\n        .hero-title {\n            margin: 0;\n            font-size: 22px;\n            line-height: 1.3;\n            font-weight: 800;\n            letter-spacing: -0.2px;\n            color: #ffffff;\n        }\n\n        .hero-desc {\n            margin-top: 8px;\n            font-size: 13.5px;\n            opacity: 0.95;\n            line-height: 1.45;\n            margin-bottom: 0px;\n        }\n\n        .content {\n            padding: 35px 40px;\n            text-align: left;\n        }\n\n        /* Botón de Acción Principal (Estilo Píldora Redondeada) */\n        .cta-button {\n            display: inline-block;\n            background-color: #243f60;\n            color: #ffffff !important;\n            font-size: 14px;\n            font-weight: 700;\n            padding: 16px 45px;\n            border-radius: 100px;\n            text-decoration: none;\n            box-shadow: 0 6px 15px rgba(36, 63, 96, 0.15);\n        }\n\n        /* Nueva Tarjeta de Estado Unificada (Fondo Azul Claro Minimalista) */\n        .unified-status-card {\n            background-color: #f0f7ff !important; /* Azul clarito solicitado */\n            border: 1px solid #d2e3fc !important;  /* Borde azul suave muy estético */\n            border-radius: 12px;\n            padding: 30px;\n            text-align: center;\n            margin: 30px 0;\n        }\n\n        @media screen and (max-width: 600px) {\n            .content, .hero, .header { padding-left: 20px !important; padding-right: 20px !important; }\n            .slogan { display: none; }\n            .mob-title { font-size: 18px !important; line-height: 1.2 !important; }\n            .mob-hero-text { font-size: 12px !important; line-height: 1.4 !important; }\n        }\n    <\/style>\n<\/head>\n<body aria-disabled=\"false\" style=\"background-color: #f8fafc; margin: 0; padding: 0;\">\n\n    <div style=\"background-color: #f8fafc; padding: 10px 0px; font-family: 'DM Sans', Arial, sans-serif;\">\n        <table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" class=\"main-table\" style=\"border: 1px solid #e2e8f0; border-collapse: collapse; empty-cells: show; max-width: 560px; text-size-adjust: 100%; font-size: 16px; font-family: 'DM Sans', Arial, sans-serif; width: 100%; margin: 20px auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: rgba(0, 0, 0, 0.03) 0px 4px 12px;\">\n            \n            <!-- Línea de acento azul superior de Heru -->\n            <tbody>\n                <tr>\n                    <td class=\"top-accent\" style=\"background-color: #3b82f6; height: 4px; line-height: 4px; font-size: 1px;\">&nbsp;<\/td>\n                <\/tr>\n\n                <!-- Header -->\n                <tr>\n                    <td class=\"header\" style=\"border-collapse: collapse; min-width: 5px; text-size-adjust: 100%; font-family: 'DM Sans', Helvetica, Arial, sans-serif; border-width: 1px; border-style: solid; border-color: transparent transparent #f1f5f9; padding: 20px 40px 15px; background-color: #ffffff;\">\n                        <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"border-width: medium; border-style: none; border-color: currentcolor; border-collapse: collapse; empty-cells: show; max-width: 100%; text-size-adjust: 100%; font-size: 16px; font-family: 'DM Sans', Arial, sans-serif;\">\n                            <tbody>\n                                <tr>\n                                    <td align=\"left\" style=\"border-collapse: collapse; min-width: 5px; text-size-adjust: 100%; font-family: 'DM Sans', Helvetica, Arial, sans-serif; border: 0px solid transparent;\">\n                                        <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru.\" width=\"70\" style=\"border: 0px; height: auto; line-height: 100%; outline: none; text-decoration: none; cursor: pointer; padding: 0px 1px; position: relative; max-width: 100%;\">\n                                    <\/td>\n                                    <td align=\"right\" class=\"slogan\" style=\"font-size: 12px; color: #94a3b8; font-weight: 500; border-collapse: collapse; min-width: 5px; text-size-adjust: 100%; font-family: 'DM Sans', Helvetica, Arial, sans-serif; border: 1px solid transparent;\">\n                                        Tus impuestos sin estrés\n                                    <\/td>\n                                <\/tr>\n                            <\/tbody>\n                        <\/table>\n                    <\/td>\n                <\/tr>\n\n                <!-- Hero Banner Azul Oficial (#243f60) -->\n                <tr>\n                    <td class=\"hero\" style=\"border-collapse: collapse; min-width: 5px; text-size-adjust: 100%; font-family: 'DM Sans', Helvetica, Arial, sans-serif; border: 1px solid transparent; background-color: #243f60 !important; padding: 30px 40px; color: #ffffff; text-align: left;\">\n                        <p class=\"hero-subtitle\">\n                            Declaración Mensual\n                        <\/p>\n                        <h1 class=\"mob-title hero-title\">\n                            ¡Tu declaración mensual está lista!\n                        <\/h1>\n                        <p class=\"mob-hero-text hero-desc\">\n                            Hemos preparado y presentado tu declaración fiscal correspondiente a este periodo.\n                        <\/p>\n                    <\/td>\n                <\/tr>\n\n                <!-- Body Content -->\n                <tr>\n                    <td class=\"content\" style=\"border-collapse: collapse; min-width: 5px; text-size-adjust: 100%; font-family: 'DM Sans', Helvetica, Arial, sans-serif; border: 1px solid transparent; padding: 35px 40px; text-align: left; background-color: #ffffff;\">\n\n                        <!-- Saludo -->\n                        <p style=\"color: #1e293b; font-size: 16px; font-weight: 700; margin-bottom: 20px; font-family: 'DM Sans', Arial, sans-serif; margin-top: 0;\">\n                            Hola <strong style=\"font-weight: 700;\">{{ params.name }}<\/strong>,\n                        <\/p>\n\n                        <!-- Introducción -->\n                        <p style=\"color: #4a5568; font-size: 15px; line-height: 1.6; margin-bottom: 25px; font-family: 'DM Sans', Arial, sans-serif;\">\n                            Es un gusto saludarte de nuevo. En esta ocasión nos ponemos en contacto contigo para compartirte tu declaración de <strong style=\"font-weight: 700;\">{{ params.mes_en_curso }}<\/strong>. A continuación encontrarás todos los detalles de la presentación de este mes.\n                        <\/p>\n\n                        <!-- Tarjetas de Estado Dinámicas (Unificadas en Azul Claro sin franjas gruesas) -->\n                        {% if params.total_a_pagar and params.total_a_pagar != \"0\" and params.total_a_pagar != \"0.00\" %}\n                            <!-- Tarjeta de Saldo a Pagar -->\n                            <div class=\"unified-status-card\">\n                                <h2 style=\"margin: 0 0 10px 0; font-family: 'DM Sans', sans-serif; color: #243f60; font-size: 18px; font-weight: 700; line-height: 1.4; text-align: center;\">\n                                    Este periodo tienes un saldo a pagar de\n                                <\/h2>\n                                <span style=\"font-size: 42px; font-weight: 800; color: #243f60; margin: 10px 0 25px 0; display: block; line-height: 1.2;\">\n                                    ${{ params.total_a_pagar }}\n                                <\/span>\n                                \n                                {% if params.fecha_limite_pago %}\n                                    <p style=\"font-size: 14.5px; color: #475569; margin: 0 0 20px 0; font-weight: 500; line-height: 1.6; text-align: center;\">\n                                        Asegúrate de pagar antes del <strong style=\"color: #1e293b;\">{{ params.fecha_limite_pago }}<\/strong>, con tu línea de captura:\n                                    <\/p>\n                                    \n                                    {% if params.paymentline %}\n                                        <div style=\"background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px 16px; display: inline-block; margin-top: 5px;\">\n                                            <span style=\"font-family: 'Courier New', Courier, monospace; font-size: 15px; letter-spacing: 1.5px; font-weight: 700; color: #1e293b;\">\n                                                {{ params.paymentline }}\n                                            <\/span>\n                                        <\/div>\n                                    {% endif %}\n                                {% endif %}\n                            <\/div>\n\n                        {% elif (params.total_a_pagar == \"0\" or params.total_a_pagar == \"0.00\") and params.iva_total_to_pay and (\"-\" in params.iva_total_to_pay) %}\n                            <!-- Tarjeta de Saldo a Favor -->\n                            <div class=\"unified-status-card\">\n                                <h2 style=\"margin: 0 0 10px 0; font-family: 'DM Sans', sans-serif; color: #243f60; font-size: 20px; font-weight: 700; line-height: 1.4; text-align: center;\">\n                                    🎉 Tienes saldo a favor! 🥳\n                                <\/h2>\n                                <span style=\"font-size: 42px; font-weight: 800; color: #243f60; margin: 10px 0 20px 0; display: block; line-height: 1.2;\">\n                                    ${{ params.iva_saldo_favor }}\n                                <\/span>\n                                <p style=\"font-size: 14.5px; color: #475569; margin: 0; line-height: 1.6; text-align: center;\">\n                                    ¡Excelente noticia! Tu declaración fue presentada exitosamente y no debes pagar impuestos ya que obtuviste un saldo a favor.\n                                <\/p>\n                            <\/div>\n\n                        {% else %}\n                            <!-- Tarjeta de Saldo en Cero -->\n                            <div class=\"unified-status-card\">\n                                <h2 style=\"margin: 0 0 10px 0; font-family: 'DM Sans', sans-serif; color: #243f60; font-size: 20px; font-weight: 700; line-height: 1.4; text-align: center;\">\n                                    ✅ ¡Saldo en cero!\n                                <\/h2>\n                                <p style=\"font-size: 14.5px; color: #475569; margin: 10px 0 0 0; line-height: 1.6; text-align: center;\">\n                                    Tu declaración fue presentada exitosamente. No tienes impuestos a pagar este mes.\n                                <\/p>\n                            <\/div>\n                        {% endif %}\n\n                        <!-- CTA Principal Ver mi Declaración -->\n                        <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin: 35px 0; border-collapse: collapse; empty-cells: show;\">\n                            <tbody>\n                                <tr>\n                                    <td align=\"center\" style=\"border-collapse: collapse; min-width: 5px; text-size-adjust: 100%; font-family: 'DM Sans', Helvetica, Arial, sans-serif; border: 0px solid transparent;\">\n                                        <a href=\"{{ params.payment_link | default: 'https://web.heru.app/declaraciones' }}\" class=\"cta-button\" target=\"_blank\" style=\"font-family: 'DM Sans', Helvetica, Arial, sans-serif;\">\n                                            Ver mi declaración\n                                        <\/a>\n                                    <\/td>\n                                <\/tr>\n                            <\/tbody>\n                        <\/table>\n\n                        <!-- Nota aclaratoria -->\n                        <p style=\"color: #4a5568; line-height: 1.6; text-align: center; font-size: 12px; margin: 0px 0px 30px;\">\n                            Los acuses y el detalle de tu declaración están adjuntos a este correo.<br>\n                            Una vez realizado tu pago, el SAT puede tardar hasta 72 horas en reflejarlo.\n                        <\/p>\n\n                        <!-- Bloque Detalle de Declaración Estilo Recibo Premium -->\n                        {% if params.regime_name == 'Simplificado de Confianza' and (params.regime_name or params.incomes_accumulated or params.isr_retained or params.isr_by_rate or params.iva_charged or params.iva_withheld or params.iva_deductions) or params.regime_name != 'Simplificado de Confianza' and (params.regime_name or params.incomes_accumulated or params.isr_retained or params.iva_charged or params.iva_withheld or params.iva_deductions) %}\n                        \n                        <div style=\"border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; margin-top: 35px; margin-bottom: 35px; box-shadow: 0 4px 15px rgba(30, 41, 59, 0.02);\">\n                            <div style=\"background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 14px 20px; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px;\">\n                                📊 Detalle de tu declaración\n                            <\/div>\n                            <div style=\"padding: 0 20px;\">\n                                <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" style=\"border-collapse: collapse;\">\n                                    <tbody>\n                                        {% if params.regime_name == 'Simplificado de Confianza' %}\n                                            {% if params.regime_name %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">Régimen<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">{{ params.regime_name }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.incomes_accumulated %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">Ingresos del mes<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #243f60; font-weight: 700;\">${{ params.incomes_accumulated }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.isr_retained %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">ISR retenido<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">${{ params.isr_retained }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.isr_by_rate %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">Tasa aplicable %<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">{{ params.isr_by_rate }}%<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.iva_charged %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">IVA cobrado<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">${{ params.iva_charged }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.iva_withheld %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">IVA retenido<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">${{ params.iva_withheld }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.iva_deductions %}\n                                            <tr>\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">Deducciones Autorizadas (IVA pagado)<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">${{ params.iva_deductions }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                        {% else %}\n                                            {% if params.regime_name %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">Régimen<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">{{ params.regime_name }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.incomes_accumulated %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">Ingresos del mes<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #243f60; font-weight: 700;\">${{ params.incomes_accumulated }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.isr_retained %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">ISR retenido<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">${{ params.isr_retained }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.iva_charged %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">IVA cobrado<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">${{ params.iva_charged }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.iva_withheld %}\n                                            <tr style=\"border-bottom: 1px solid #f1f5f9;\">\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">IVA retenido<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">${{ params.iva_withheld }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                            {% if params.iva_deductions %}\n                                            <tr>\n                                                <td style=\"padding: 14px 0; font-size: 14px; color: #64748b; font-weight: 500;\">Deducciones Autorizadas (IVA pagado)<\/td>\n                                                <td align=\"right\" style=\"padding: 14px 0; font-size: 14px; color: #1e293b; font-weight: 700;\">${{ params.iva_deductions }}<\/td>\n                                            <\/tr>\n                                            {% endif %}\n                                        {% endif %}\n                                    <\/tbody>\n                                <\/table>\n                            <\/div>\n                        <\/div>\n                        \n                        {% endif %}\n\n                        <!-- Explicación del resultado (Copy exacto) -->\n                        <p style=\"color: #4a5568; line-height: 1.6; text-align: left; font-size: 15px; margin: 0px 0px 25px;\">\n                            {{ params.explicacion_resultado }}\n                        <\/p>\n\n                        <!-- Nota de ayuda (Copy exacto) -->\n                        {% if params.fecha_limite_pago and params.total_a_pagar and params.total_a_pagar != \"0\" and params.total_a_pagar != \"0.00\" %}\n                        <p style=\"color: #64748b; line-height: 1.6; text-align: left; font-size: 14px; margin: 0px 0px 25px; font-style: italic;\">\n                            <em style=\"font-style: italic;\">\n                                <strong style=\"font-weight: 700;\">Nota:<\/strong> Si por algún motivo no logras pagar a tiempo, no te preocupes, te ayudaremos con una nueva línea de captura.\n                                <a href=\"mailto:ayuda@heru.app.com\" style=\"color: #3b82f6; text-decoration: underline; font-style: italic; font-size: 14px;\">\n                                    Contáctanos\n                                <\/a>.\n                            <\/em>\n                        <\/p>\n                        {% endif %}\n\n                    <\/td>\n                <\/tr>\n\n                <!-- Footer oficial idéntico y centrado -->\n                <tr>\n                    <td style=\"padding: 45px 40px; background-color: #f8fafc; text-align: center; border-top: 1px solid #f1f5f9; border-collapse: collapse;\">\n                        <!-- Logo centrado en texto -->\n                        <div style=\"font-family: 'Lexend', sans-serif; font-size: 18px; font-weight: 700; color: #243f60; margin-bottom: 4px; text-align: center;\">heru<\/div>\n                        <div style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #64748b; margin-bottom: 24px; text-align: center;\">impuestos sin estrés<\/div>\n                        \n                        <!-- Bloque legal e informativo -->\n                        <div style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 12px; color: #64748b; line-height: 1.6; max-width: 480px; margin: 0 auto 20px auto; text-align: center;\">\n                            Recibiste este correo porque te registraste en heru para liberarte del estrés de cumplir con tus impuestos.\n                        <\/div>\n                        \n                        <!-- Link de desuscripción -->\n                        <div style=\"text-align: center; margin-top: 20px;\">\n                            <a href=\"#\" style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #64748b; text-decoration: underline;\">Desuscribirse<\/a>\n                        <\/div>\n\n                        <!-- Banner promocional al final del correo (Posicionado debajo del footer) -->\n                        <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-top: 35px; margin-bottom: 5px; border-collapse: collapse;\">\n                            <tbody>\n                                <tr>\n                                    <td align=\"center\" style=\"border-collapse: collapse; min-width: 5px; text-size-adjust: 100%;\">\n                                        <a href=\"https://www.heru.app/descargar/\" target=\"_blank\" style=\"text-decoration: none; border: 0; outline: none; display: block;\">\n                                            <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/6a5968026a1a0525d404d19a.png\" alt=\"Heru Promoción\" width=\"100%\" style=\"display: block; width: 100%; max-width: 100%; height: auto; border: 0px; border-radius: 8px;\">\n                                        <\/a>\n                                    <\/td>\n                                <\/tr>\n                            <\/tbody>\n                        <\/table>\n\n                    <\/td>\n                <\/tr>\n            <\/tbody>\n        <\/table>\n    <\/div>\n\n<\/body>\n<\/html>"}, "1217": {"name": "email facturación 5 dias plataformas", "subject": "5 días para cerrar el mes, factura tus gastos y paga menos impuestos", "htmlContent": "<!doctype html>\n<html lang=\"es\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:v=\"urn:schemas-microsoft-com:vml\">\n<head>\n  <title><\/title>\n  <meta charset=\"UTF-8\" />\n  <meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\" />\n  <meta name=\"x-apple-disable-message-reformatting\" />\n  <style type=\"text/css\">\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: 'Helvetica', Arial, sans-serif; }\n    @media only screen and (max-width: 480px) {\n      .container { width: 100% !important; }\n      .content-padding { padding-left: 15px !important; padding-right: 15px !important; }\n    }\n  <\/style>\n<\/head>\n<body style=\"font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; background-color: #f4f7f9; margin: 0; padding: 0;\">\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"background-color: #f4f7f9; border-collapse: collapse;\" width=\"100%\">\n  <tbody>\n    <tr>\n      <td align=\"center\" style=\"padding: 10px 0;\">\n        <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"container\" role=\"presentation\" style=\"background-color: #ffffff; border-radius: 8px; overflow: hidden; width: 550px; margin: 0 auto; border-collapse: collapse;\" width=\"550\">\n          <tbody>\n\n            <!-- LOGO -->\n            <tr>\n              <td style=\"padding: 16px 25px 10px 25px; background-color: #ffffff;\">\n                <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru.\" width=\"70\" style=\"display: block;\" />\n              <\/td>\n            <\/tr>\n\n            <!-- HERO -->\n            <tr>\n              <td style=\"background-color: #1a3a5a; padding: 30px 25px;\">\n                <p style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; font-weight: 600; color: #7eb3f5; margin: 0 0 10px 0; letter-spacing: 0.8px; text-transform: uppercase;\">🗓️ Cierre de mes en 5 días<\/p>\n                <h1 style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 24px; font-weight: bold; color: #ffffff; margin: 0; line-height: 1.3;\">Factura tus gastos antes de que cierre el mes y paga menos impuestos<\/h1>\n              <\/td>\n            <\/tr>\n\n            <!-- CUERPO -->\n            <tr>\n              <td class=\"content-padding\" style=\"padding: 25px 25px 20px 25px;\">\n\n                <div style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 14px; color: #4a5568; line-height: 1.7; margin-bottom: 22px;\">\n                  <p style=\"margin: 0 0 12px 0;\">Hola 👋<\/p>\n                  <p style=\"margin: 0 0 12px 0;\">Quedan <strong style=\"color: #2d3748;\">5 días para que cierre el mes<\/strong> y todavía estás a tiempo de facturar tus gastos.<\/p>\n                  <p style=\"margin: 0;\">¿Para qué sirve facturar tus gastos? Simple: cuando tienes facturas de lo que gastas para trabajar, el SAT te permite restarlas de lo que debes pagar. Menos impuestos, más dinero en tu bolsillo. 💰<\/p>\n                <\/div>\n\n                <!-- Tip box -->\n                <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" style=\"margin-bottom: 22px; border-collapse: collapse;\">\n                  <tr>\n                    <td style=\"background-color: #eef4ff; border-left: 4px solid #518dec; border-radius: 4px; padding: 14px 16px; font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #2d3748; line-height: 1.7;\">\n                      <strong>💡 ¿Qué puedes facturar si trabajas en Uber, DiDi, Rappi u otra plataforma?<\/strong><br/><br/>\n                      ⛽ Gasolina y mantenimiento del vehículo<br/>\n                      🛡️ Seguro de auto o moto<br/>\n                      📱 Plan de celular e internet<br/>\n                      🔧 Reparaciones y refacciones<br/>\n                      🧼 Artículos de limpieza para tu vehículo<br/>\n                      💸 Las comisiones que te cobra la plataforma<br/><br/>\n                      <em style=\"color: #718096;\">¿Tienes dudas de qué aplica para ti? Entra al artículo completo 👇<\/em>\n                    <\/td>\n                  <\/tr>\n                <\/table>\n\n                <!-- CTA -->\n                <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" style=\"margin-bottom: 24px; border-collapse: collapse;\">\n                  <tr>\n                    <td align=\"center\">\n                      <a href=\"https://noticias.heru.app/en/articles/8679745\" style=\"display: inline-block; background-color: #518dec; color: #ffffff; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: bold; text-decoration: none; padding: 14px 32px; border-radius: 6px;\">Ver qué gastos puedo facturar →<\/a>\n                    <\/td>\n                  <\/tr>\n                <\/table>\n\n                <!-- Cierre -->\n                <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-top: 1px solid #edf2f7; border-collapse: collapse;\" width=\"100%\">\n                  <tbody><tr><td style=\"padding-top: 18px; font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #4a5568;\">\n                    <p style=\"margin: 0 0 4px 0;\">¿Tienes dudas? Escríbenos a <a href=\"mailto:ayuda@heru-app.com\" style=\"color: #518dec; text-decoration: none; font-weight: bold;\">ayuda@heru-app.com<\/a><\/p>\n                    <span style=\"font-weight: bold; color: #2d3748; display: block;\">Equipo heru.<\/span>\n                  <\/td><\/tr><\/tbody>\n                <\/table>\n\n              <\/td>\n            <\/tr>\n\n            <!-- FOOTER -->\n            <tr>\n              <td style=\"padding: 15px 25px 25px 25px; border-top: 1px solid #edf2f7; font-family: 'Helvetica', Arial, sans-serif; font-size: 11px; color: #a0aec0; line-height: 1.4;\">\n                Mensaje automático · No es necesario responder.\n              <\/td>\n            <\/tr>\n\n          <\/tbody>\n        <\/table>\n      <\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/body>\n<\/html>"}, "1219": {"name": "facturacion 5 dias resico", "subject": "5 días para cerrar el mes, factura tus gastos y paga menos impuestos", "htmlContent": "<!doctype html>\n<html lang=\"es\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:v=\"urn:schemas-microsoft-com:vml\">\n<head>\n  <title><\/title>\n  <meta charset=\"UTF-8\" />\n  <meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\" />\n  <meta name=\"x-apple-disable-message-reformatting\" />\n  <style type=\"text/css\">\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: 'Helvetica', Arial, sans-serif; }\n    @media only screen and (max-width: 480px) {\n      .container { width: 100% !important; }\n      .content-padding { padding-left: 15px !important; padding-right: 15px !important; }\n    }\n  <\/style>\n<\/head>\n<body style=\"font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; background-color: #f4f7f9; margin: 0; padding: 0;\">\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"background-color: #f4f7f9; border-collapse: collapse;\" width=\"100%\">\n  <tbody>\n    <tr>\n      <td align=\"center\" style=\"padding: 10px 0;\">\n        <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"container\" role=\"presentation\" style=\"background-color: #ffffff; border-radius: 8px; overflow: hidden; width: 550px; margin: 0 auto; border-collapse: collapse;\" width=\"550\">\n          <tbody>\n\n            <!-- LOGO -->\n            <tr>\n              <td style=\"padding: 16px 25px 10px 25px; background-color: #ffffff;\">\n                <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru.\" width=\"70\" style=\"display: block;\" />\n              <\/td>\n            <\/tr>\n\n            <!-- HERO -->\n            <tr>\n              <td style=\"background-color: #1a3a5a; padding: 30px 25px;\">\n                <p style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; font-weight: 600; color: #7eb3f5; margin: 0 0 10px 0; letter-spacing: 0.8px; text-transform: uppercase;\">🗓️ Cierre de mes en 5 días<\/p>\n                <h1 style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 24px; font-weight: bold; color: #ffffff; margin: 0; line-height: 1.3;\">Factura tus gastos antes de que cierre el mes y paga menos impuestos<\/h1>\n              <\/td>\n            <\/tr>\n\n            <!-- CUERPO -->\n            <tr>\n              <td class=\"content-padding\" style=\"padding: 25px 25px 20px 25px;\">\n\n                <div style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 14px; color: #4a5568; line-height: 1.7; margin-bottom: 22px;\">\n                  <p style=\"margin: 0 0 12px 0;\">Hola 👋<\/p>\n                  <p style=\"margin: 0 0 12px 0;\">Quedan <strong style=\"color: #2d3748;\">5 días para que cierre el mes<\/strong> y todavía estás a tiempo de facturar tus gastos.<\/p>\n                  <p style=\"margin: 0;\">En RESICO tu ISR ya es muy bajo, pero hay algo que mucha gente no sabe: <strong style=\"color: #2d3748;\">tus facturas de gastos sí sirven para reducir el IVA que pagas cada mes.<\/strong> Cada factura que pides es dinero que puedes restar de lo que le debes al SAT. 💰<\/p>\n                <\/div>\n\n                <!-- Tip box -->\n                <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" style=\"margin-bottom: 22px; border-collapse: collapse;\">\n                  <tr>\n                    <td style=\"background-color: #eef4ff; border-left: 4px solid #518dec; border-radius: 4px; padding: 14px 16px; font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #2d3748; line-height: 1.7;\">\n                      <strong>💡 ¿Qué gastos te ayudan a pagar menos IVA en RESICO?<\/strong><br/><br/>\n                      ⛽ Combustible y mantenimiento de tu vehículo de trabajo<br/>\n                      💻 Equipo de cómputo, software y herramientas<br/>\n                      🌐 Internet y telefonía para tu negocio<br/>\n                      🏢 Renta de oficina o local<br/>\n                      📢 Publicidad y marketing<br/>\n                      📝 Papelería y artículos de oficina<br/><br/>\n                      <em style=\"color: #718096;\">¿Tienes dudas de qué aplica para ti? Entra al artículo completo 👇<\/em>\n                    <\/td>\n                  <\/tr>\n                <\/table>\n\n                <!-- CTA -->\n                <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" style=\"margin-bottom: 24px; border-collapse: collapse;\">\n                  <tr>\n                    <td align=\"center\">\n                      <a href=\"https://noticias.heru.app/en/articles/8679617\" style=\"display: inline-block; background-color: #518dec; color: #ffffff; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: bold; text-decoration: none; padding: 14px 32px; border-radius: 6px;\">Ver qué puedo deducir en RESICO →<\/a>\n                    <\/td>\n                  <\/tr>\n                <\/table>\n\n                <!-- Cierre -->\n                <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-top: 1px solid #edf2f7; border-collapse: collapse;\" width=\"100%\">\n                  <tbody><tr><td style=\"padding-top: 18px; font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #4a5568;\">\n                    <p style=\"margin: 0 0 4px 0;\">¿Tienes dudas? Escríbenos a <a href=\"mailto:ayuda@heru-app.com\" style=\"color: #518dec; text-decoration: none; font-weight: bold;\">ayuda@heru-app.com<\/a><\/p>\n                    <span style=\"font-weight: bold; color: #2d3748; display: block;\">Equipo heru.<\/span>\n                  <\/td><\/tr><\/tbody>\n                <\/table>\n\n              <\/td>\n            <\/tr>\n\n            <!-- FOOTER -->\n            <tr>\n              <td style=\"padding: 15px 25px 25px 25px; border-top: 1px solid #edf2f7; font-family: 'Helvetica', Arial, sans-serif; font-size: 11px; color: #a0aec0; line-height: 1.4;\">\n                Mensaje automático · No es necesario responder.\n              <\/td>\n            <\/tr>\n\n          <\/tbody>\n        <\/table>\n      <\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/body>\n<\/html>"}, "1354": {"name": "Solicitud de factura por QR aceptada", "subject": "heru | Facturación electrónica", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <title>Tu factura ya está lista<\/title>\n  <style>\n    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap');\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #f4f7f9; font-family: 'DM Sans', Helvetica, Arial, sans-serif; color: #1e293b; }\n    p, strong, td, span, a { font-family: 'DM Sans', Helvetica, Arial, sans-serif !important; }\n    .main-table { width: 100%; max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }\n    .header { padding: 30px 40px; background-color: #ffffff; }\n    .hero { background-color: #003366; padding: 40px; color: #ffffff; }\n    .content { padding: 40px; }\n    .data-table { width: 100%; margin: 10px 0 25px; border-top: 1px solid #f1f5f9; }\n    .data-row td { padding: 15px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; line-height: 1.4; }\n    .data-label { color: #64748b; text-align: left; padding-right: 10px; }\n    .data-value { color: #003366; font-weight: 700; text-align: right; word-break: break-word; }\n    .status-pill { display: inline-block; background-color: #f0fff4; border: 1.5px solid #c6f6d5; color: #2f855a; font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 999px; }\n    /* Ficha de factura emitida */\n    .result-card { border-radius: 16px; padding: 25px; margin: 10px 0 30px; border: 1.5px solid; background-color: #f0fff4; border-color: #c6f6d5; }\n    .card-title-text { font-size: 17px; font-weight: 700; color: #1e293b; line-height: 1.3; }\n    .card-amount-text { font-size: 32px; font-weight: 800; color: #38a169; }\n    .card-divider { border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 15px 0; }\n    .card-footer-text { font-size: 14px; font-weight: 500; color: #475569; line-height: 1.5; }\n    /* Bloque de cross-sell heru */\n    .cross-card { background-color: #f0f7ff; border: 1.5px solid #d1e9ff; border-radius: 16px; padding: 25px; margin: 30px 0; }\n    .cross-title { font-size: 17px; font-weight: 800; color: #003366; margin: 0 0 8px; line-height: 1.3; }\n    .cross-text { font-size: 14px; font-weight: 500; color: #475569; line-height: 1.6; margin: 0; }\n    .btn-primary { background-color: #0091ff; color: #ffffff !important; padding: 14px 35px; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 14px; display: inline-block; }\n    .btn-secondary { background-color: #ffffff; color: #0091ff !important; padding: 13px 34px; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 14px; display: inline-block; border: 1.5px solid #0091ff; }\n    .footer { padding: 30px 40px; background-color: #f8fafc; color: #64748b; font-size: 12px; text-align: center; }\n    @media screen and (max-width: 600px) {\n      .content, .hero, .header { padding: 20px !important; }\n      .slogan { display: none; }\n      .data-row td { display: block !important; width: 100% !important; padding: 5px 0 !important; border: none !important; }\n      .data-label { text-align: left !important; font-size: 12px !important; padding-top: 10px !important; }\n      .data-value { text-align: left !important; font-size: 16px !important; padding-bottom: 10px !important; border-bottom: 1px solid #f1f5f9 !important; }\n      .result-card { padding: 20px !important; }\n      .card-title-text { font-size: 15px !important; display: block !important; width: 100% !important; margin-bottom: 5px !important; }\n      .card-amount-text { font-size: 26px !important; display: block !important; width: 100% !important; text-align: left !important; }\n      .cross-card { padding: 20px !important; }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div style=\"background-color: #f4f7f9; padding: 10px 0;\">\n    <table class=\"main-table\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n      <!-- Header -->\n      <tr>\n        <td class=\"header\">\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td align=\"left\">\n                <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru.\" width=\"80\">\n              <\/td>\n              <td align=\"right\" class=\"slogan\" style=\"font-size: 11px; color: #94a3b8; font-weight: 500;\">\n                Tus facturas, sin complicaciones\n              <\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n      <!-- Hero -->\n      <tr>\n        <td class=\"hero\">\n          <p style=\"text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 12px; opacity: 0.7;\">\n            Factura emitida\n          <\/p>\n          <h1 style=\"margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700;\">\n            {{ params.emisor_name }} aceptó tu solicitud. Tu factura ya está lista.\n          <\/h1>\n          <p style=\"margin-top: 15px; font-size: 15px; opacity: 0.9;\">\n            Se emitió correctamente ante el SAT. Aquí tienes el detalle.\n          <\/p>\n        <\/td>\n      <\/tr>\n      <!-- Body -->\n      <tr>\n        <td class=\"content\">\n          <p style=\"color: #475569; font-size: 15px; margin-bottom: 5px; line-height: 1.6;\">\n            ¡Hola <strong>{{ params.name }}<\/strong>!\n          <\/p>\n          <p style=\"color: #475569; font-size: 15px; margin-bottom: 20px; line-height: 1.6;\">\n            <strong>{{ params.emisor_name }}<\/strong> aceptó tu solicitud de factura y <strong>ésta se ha emitido correctamente<\/strong>. Descárgala o revísala directamente desde tu <a href=\"https://www.heru.app\">app heru<\/a> vinculando tu RFC.\n          <\/p>\n\n          <!-- Ficha de factura -->\n          <div class=\"result-card\">\n            <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <\/table>\n            <div class=\"card-footer-text\">\n              Tu comprobante (PDF y XML) ya está disponible. Consérvalo para tus deducciones.\n            <\/div>\n          <\/div>\n\n          <!-- Detalle de la factura -->\n          <table class=\"data-table\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr class=\"data-row\">\n              <td class=\"data-label\">Emisor<\/td>\n              <td class=\"data-value\">{{ params.emisor_name }}<\/td>\n            <\/tr>\n            <tr class=\"data-row\">\n              <td class=\"data-label\">Folio fiscal (UUID)<\/td>\n              <td class=\"data-value\">{{ params.uuid }}<\/td>\n            <\/tr>\n            <tr class=\"data-row\">\n              <td class=\"data-label\">Fecha de emisión<\/td>\n              <td class=\"data-value\">{{ params.fecha_emision }}<\/td>\n            <\/tr>\n            <tr class=\"data-row\">\n              <td class=\"data-label\">Monto<\/td>\n              <td class=\"data-value\">${{ params.monto_factura }} mxn<\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- CTA principal -->\n          <div style=\"margin: 30px 0; text-align: center;\">\n            <a href=\"{{ params.link_factura }}\" class=\"btn-primary\">Ver mi factura<\/a>\n          <\/div>\n\n          <!-- CROSS-SELL -->\n          <div class=\"cross-card\">\n            <p class=\"cross-title\">Ten todas tus facturas en un solo lugar<\/p>\n            <p class=\"cross-text\">\n              Vincula tu <strong>RFC<\/strong> en la app heru y visualiza, organiza y descarga automáticamente todas las facturas que recibes y emites, <strong>gratis<\/strong> y sin pagar software de facturación.\n            <\/p>\n            <div style=\"margin-top: 20px;\">\n              <a href=\"{{ params.download_link }}\" class=\"btn-secondary\">Vincular mi RFC en heru<\/a>\n            <\/div>\n          <\/div>\n\n          <p style=\"font-size: 13px; color: #94a3b8; margin-top: 40px; border-top: 1px solid #f1f5f9; padding-top: 25px; text-align: center; line-height: 1.5;\">\n            ¿Tienes dudas sobre tu factura? Escríbenos desde la app o en\n            <a href=\"mailto:ayuda@heru-app.com\" style=\"color: #0091ff; text-decoration: none; font-weight: 500;\">ayuda@heru-app.com<\/a>.\n            Estamos para ayudarte.\n          <\/p>\n        <\/td>\n      <\/tr>\n      <!-- Footer -->\n      <tr>\n        <td class=\"footer\">\n          <p style=\"margin-bottom: 5px;\">\n            Este correo es una confirmación automática generada por heru. No responder a este mensaje.\n          <\/p>\n        <\/td>\n      <\/tr>\n    <\/table>\n  <\/div>\n<\/body>\n<\/html>\n"}, "1355": {"name": "Solicitud de factura por QR rechazada", "subject": "heru | Facturación electrónica", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <title>Sobre tu solicitud de factura<\/title>\n  <style>\n    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap');\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #f4f7f9; font-family: 'DM Sans', Helvetica, Arial, sans-serif; color: #1e293b; }\n    p, strong, td, span, a { font-family: 'DM Sans', Helvetica, Arial, sans-serif !important; }\n    .main-table { width: 100%; max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }\n    .header { padding: 30px 40px; background-color: #ffffff; }\n    .hero { background-color: #003366; padding: 40px; color: #ffffff; }\n    .content { padding: 40px; }\n    .data-table { width: 100%; margin: 10px 0 25px; border-top: 1px solid #f1f5f9; }\n    .data-row td { padding: 15px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; line-height: 1.4; }\n    .data-label { color: #64748b; text-align: left; padding-right: 10px; }\n    .data-value { color: #003366; font-weight: 700; text-align: right; word-break: break-word; }\n    .status-pill { display: inline-block; background-color: #fef2f2; border: 1.5px solid #fecaca; color: #b91c1c; font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 999px; }\n    /* Ficha de motivo */\n    .reason-card { border-radius: 16px; padding: 25px; margin: 10px 0 30px; border: 1.5px solid #fecaca; background-color: #fef2f2; }\n    .reason-label { text-transform: uppercase; font-size: 11px; letter-spacing: 1px; font-weight: 700; color: #b91c1c; margin: 0 0 8px; }\n    .reason-text { font-size: 16px; font-weight: 700; color: #1e293b; line-height: 1.5; margin: 0; }\n    /* Bloque de cross-sell heru */\n    .cross-card { background-color: #f0f7ff; border: 1.5px solid #d1e9ff; border-radius: 16px; padding: 25px; margin: 30px 0; }\n    .cross-title { font-size: 17px; font-weight: 800; color: #003366; margin: 0 0 8px; line-height: 1.3; }\n    .cross-text { font-size: 14px; font-weight: 500; color: #475569; line-height: 1.6; margin: 0; }\n    .btn-primary { background-color: #0091ff; color: #ffffff !important; padding: 14px 35px; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 14px; display: inline-block; }\n    .btn-secondary { background-color: #ffffff; color: #0091ff !important; padding: 13px 34px; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 14px s<\/a>\n            <\/div>\n          <\/div>\n\n          <p style=\"font-size: 13px; color: #94a3b8; margin-top: 40px; border-top: 1px solid #f1f5f9; padding-top: 25px; text-align: center; line-height: 1.5;\">\n            ¿Tienes dudas sobre tu solicitud? Escríbenos desde la app o en\n            <a href=\"mailto:ayuda@heru-app.com\" style=\"color: #0091ff; text-decoration: none; font-weight: 500;\">ayuda@heru-app.com<\/a>.\n            Estamos para ayudarte.\n          <\/p>\n        <\/td>\n      <\/tr>\n      <!-- Footer -->\n      <tr>\n        <td class=\"footer\">\n          <p style=\"margin-bottom: 5px;\">\n            Este correo es una confirmación automática generada por heru, no recibe respuestas.\n          <\/p>\n        <\/td>\n      <\/tr>\n    <\/table>\n  <\/div>\n<\/body>\n<\/html>\n"}, "1239": {"name": "plan_mensual_5_dias", "subject": "Tu Plan Mensual de heru se renueva en 5 días", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <title>Tu Plan Mensual de Heru se renueva en 5 días<\/title>\n  <style>\n    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap');\n\n    body, table, td, a {\n      -webkit-text-size-adjust: 100%;\n      -ms-text-size-adjust: 100%;\n    }\n    table, td {\n      mso-table-lspace: 0pt;\n      mso-table-rspace: 0pt;\n      border-collapse: collapse !important;\n    }\n    img {\n      -ms-interpolation-mode: bicubic;\n      border: 0;\n      height: auto;\n      line-height: 100%;\n      outline: none;\n      text-decoration: none;\n    }\n    body {\n      height: 100% !important;\n      margin: 0 !important;\n      padding: 0 !important;\n      width: 100% !important;\n      background-color: #f4f7f9;\n      font-family: 'DM Sans', Helvetica, Arial, sans-serif;\n      color: #1e293b;\n    }\
