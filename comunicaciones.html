td class=\"content\">\n          <p style=\"color: #475569; font-size: 15px; margin-bottom: 5px; line-height: 1.6;\">\n            ¡Hola <strong>{{params.nombre}}<\/strong>!\n          <\/p>\n          <p style=\"color: #475569; font-size: 15px; margin-bottom: 25px; line-height: 1.6;\">\n            Te escribimos para recordarte que tu <strong>Plan Anual de heru<\/strong> está por renovarse el <strong>{{params.fecha_renovacion}}<\/strong>.<br><br>El cobro se procesará automáticamente con el método de pago registrado y tu plan continuará activo por un año más, sin interrupciones.\n          <\/p>\n\n          <!-- Tabla de Datos -->\n          <table class=\"data-table\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr class=\"data-row\">\n              <td class=\"data-label\">Plan<\/td>\n              <td class=\"data-value\">{{params.producto}}<\/td>\n            <\/tr>\n            <tr class=\"data-row\">\n              <td class=\"data-label\">Fecha de renovación<\/td>\n              <td class=\"data-value\">{{params.fecha_renovacion}}<\/td>\n            <\/tr>\n            <tr class=\"data-row\">\n              <td class=\"data-label\">Método de pago<\/td>\n              <td class=\"data-value\">{{params.metodo_pago}}<\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Beneficios sutiles -->\n          <p style=\"color: #475569; font-size: 14px; margin: 0 0 30px 0; line-height: 1.7;\">\n            Esto significa un año más de declaraciones mensuales presentadas en automático, tu contador de heru disponible para resolver dudas y alertas en tiempo real cuando el SAT te requiera algo.\n          <\/p>\n\n          <!-- Bloque de Soporte -->\n          <p style=\"font-size: 13px; color: #94a3b8; margin-top: 30px; border-top: 1px solid #f1f5f9; padding-top: 25px; text-align: center; line-height: 1.5;\">\n            Si tienes alguna duda sobre tu renovación, escríbenos desde la app o en\n            <a href=\"mailto:ayuda@heru-app.com\" style=\"color: #0091ff; text-decoration: none; font-weight: 500;\">ayuda@heru-app.com<\/a>.\n            Estamos para ayudarte.\n          <\/p>\n\n        <\/td>\n      <\/tr>\n\n      <!-- Footer -->\n      <tr>\n        <td class=\"footer\">\n          <p style=\"margin-bottom: 5px;\">\n            Recibes este correo porque tienes una suscripción activa con heru. No respondas a este mensaje.\n          <\/p>\n        <\/td>\n      <\/tr>\n\n    <\/table>\n  <\/div>\n<\/body>\n\n<\/html>"}, "1262": {"name": "renovacion_exitosa", "subject": "tu renovación con heru ha sido exitosa ✅", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"x-apple-disable-message-reformatting\">\n<title>Renovación Exitosa - heru<\/title>\n<style>\n  /* CONFIGURACIÓN GENERAL */\n  body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }\n  table { border-collapse: collapse; }\n  img { display: block; border: 0; outline: none; text-decoration: none; max-width: 100%; }\n  a { text-decoration: none; }\n  .preheader { display: none; max-height: 0; overflow: hidden; mso-hide: all; opacity: 0; }\n\n  /* ESTILOS DE LA MARCA */\n  .bg-heru { background-color: #003366 !important; }\n  .text-heru { color: #003366 !important; }\n\n  .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; }\n  .slogan { font-size: 11px; color: #94a3b8; font-weight: 500; }\n\n  /* JERARQUÍA DE TEXTO EN EL BANNER */\n  .banner-tag { margin: 0 0 10px 0; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; opacity: 0.75; color: #ffffff; }\n  .banner-title { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700; color: #ffffff; }\n  .banner-subtitle { margin: 12px 0 0 0; font-size: 15px; line-height: 1.5; opacity: 0.9; color: #ffffff; }\n\n  .body-text { font-size: 15px; color: #334155; line-height: 1.6; margin: 0; }\n  .body-muted { font-size: 14px; color: #777777; line-height: 1.5; margin: 0; }\n\n  /* ESTILO COMPROBANTE DASHED */\n  .receipt-card-compact {\n    background-color: #f8fafc;\n    border: 1px dashed #cbd5e1;\n    border-radius: 12px;\n    overflow: hidden;\n  }\n\n  .cta-button { display: inline-block; background-color: #003366; color: #ffffff !important; padding: 16px 40px; border-radius: 50px; font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 6px rgba(0,51,102,0.2); }\n\n  @media only screen and (max-width: 600px) {\n    .container { width: 100% !important; border-radius: 0; }\n    .header-pad { padding: 20px 24px !important; }\n    .banner-pad { padding: 28px 24px !important; }\n    .banner-title { font-size: 21px !important; }\n    .px-mobile { padding-left: 24px !important; padding-right: 24px !important; }\n    .receipt-pad { padding-left: 20px !important; padding-right: 20px !important; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<span class=\"preheader\">Queremos confirmarte que el pago de tu suscripción a heru ha sido procesado exitosamente.<\/span>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  <tr>\n    <td align=\"center\" style=\"padding: 40px 12px;\">\n\n      <table role=\"presentation\" class=\"container\" width=\"600\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\n        <!-- HEADER (Estilo original del inicio) -->\n        <tr>\n          <td class=\"header-pad\" style=\"padding: 24px 36px; background-color: #ffffff;\">\n            <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              <tr>\n                <td align=\"left\">\n                  <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru\" width=\"72\" />\n                <\/td>\n                <td align=\"right\" class=\"slogan\">\n                  Tus impuestos sin estrés\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/td>\n        <\/tr>\n\n        <!-- BANNER AZUL -->\n        <tr>\n          <td class=\"banner-pad bg-heru\" style=\"padding: 28px 36px; color: #ffffff;\">\n            <p class=\"banner-tag\">Suscripción Activa<\/p>\n            <h1 class=\"banner-title\">Tu renovación ha sido exitosa<\/h1>\n            <p class=\"banner-subtitle\">Seguimos trabajando juntos para que mantengas tus impuestos al día.<\/p>\n          <\/td>\n        <\/tr>\n\n        <!-- CUERPO DEL MENSAJE (Estructura de párrafos limpios) -->\n        <tr>\n          <td style=\"padding: 40px 40px 16px;\" class=\"px-mobile\">\n            <p class=\"body-text\">¡Hola <strong>{{ params.first_name | default: '👋🏻' }}<\/strong>! <\/p>\n          <\/td>\n        <\/tr>\n        <tr>\n          <td style=\"padding: 0 40px 25px;\" class=\"px-mobile\">\n            <p class=\"body-text\">Queremos confirmarte que el pago de tu suscripción a <strong>heru<\/strong> ha sido procesado exitosamente. Tu cuenta se mantiene activa con todos sus beneficios y podrás seguir contando con nuestro apoyo para el cumplimiento de tus obligaciones fiscales sin preocupaciones.<\/p>\n          <\/td>\n        <\/tr>\n\n        <!-- TARJETA COMPROBANTE COMPACTO -->\n        <tr>\n          <td style=\"padding: 0 40px 32px;\" class=\"px-mobile receipt-pad\">\n            <table class=\"receipt-card-compact\" width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              <!-- Cabecera de la Tarjeta -->\n              <tr>\n                <td style=\"padding: 10px 15px; background-color: #f1f5f9; border-bottom: 1px dashed #cbd5e1;\">\n                  <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                    <tr>\n                      <td valign=\"middle\" align=\"left\">\n                        <span style=\"font-size: 9px; font-weight: 800; color: #475569; letter-spacing: 1px; text-transform: uppercase; display: block;\">\n                          Comprobante de renovación\n                        <\/span>\n                      <\/td>\n                    <\/tr>\n                  <\/table>\n                <\/td>\n              <\/tr>\n              <!-- Detalles de Compra -->\n              <tr>\n                <td style=\"padding: 15px 20px;\">\n                  <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                    <tr>\n                      <td valign=\"top\" align=\"left\">\n                        <h3 style=\"font-size: 14px; font-weight: 800; color: #003366; margin: 0 0 4px 0; line-height: 1.2;\">\n                          {{ params.product_name | default: 'Suscripción con heru' }}\n                        <\/h3>\n\n                        <span style=\"font-size: 11px; color: #475569; font-weight: 500; display: block;\">\n                          Estado: <strong>Activo • Renovación automática<\/strong>\n                        <\/span>\n                      <\/td>\n                      <td valign=\"middle\" align=\"right\" style=\"width: 100px; padding-left: 10px; border-left: 1px dashed #cbd5e1;\">\n                        <span style=\"font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 2px; letter-spacing: 0.5px;\">Monto<\/span>\n                        <span style=\"font-size: 18px; font-weight: 800; color: #0091ff; display: block; line-height: 1.1;\">\n                          ${{ params.amount }}\n                        <\/span>\n                        <span style=\"font-size: 10px; color: #64748b; font-weight: 600; display: block;\">MXN<\/span>\n                      <\/td>\n                    <\/tr>\n                  <\/table>\n                <\/td>\n              <\/tr>\n            <\/table>\n          <\/td>\n        <\/tr>\n\n        <!-- CTA PRINCIPAL -->\n        <tr>\n          <td align=\"center\" style=\"padding: 0 40px 40px;\" class=\"px-mobile\">\n            <a href=\"https://web.heru.app/\" class=\"cta-button\">Ir a mi plataforma<\/a>\n          <\/td>\n        <\/tr>\n\n        <!-- CIERRE CON SEPARADOR -->\n        <tr>\n          <td style=\"padding: 0 40px 40px;\" class=\"px-mobile\">\n            <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n              <tr><td style=\"border-top: 1px solid #e8e8e6; height: 1px; line-height: 1px; font-size: 1px;\">&nbsp;<\/td><\/tr>\n            <\/table>\n\n            <p style=\"margin-top: 24px; font-size: 15px; font-weight: 700; color: #1e293b; text-align: center; line-height: 1.5;\">\n              ¡Gracias por confiar en heru para el manejo de tus impuestos!\n            <\/p>\n\n\n          <\/td>\n        <\/tr>\n\n        <!-- FOOTER (Estilo original del ejemplo) -->\n        <tr>\n          <td style=\"background-color: #fafafa; padding: 32px 40px 28px;\" class=\"px-mobile\" align=\"center\">\n            <p style=\"font-size: 14px; font-weight: 700; color: #003366; margin: 0;\">heru<\/p>\n            <p style=\"font-size: 12px; color: #888888; margin: 4px 0 20px;\">impuestos sin estrés<\/p>\n\n            <p style=\"font-size: 12px; color: #888888; line-height: 1.5; margin: 0; max-width: 420px; text-align: center;\">\n              Recibiste este correo porque te registraste en heru para liberarte del estrés de cumplir con tus impuestos.\n            <\/p>\n\n            <p style=\"margin-top: 16px;\">\n              <a href=\"{{ unsubscribe_url }}\" style=\"font-size: 12px; color: #888888; text-decoration: underline;\">Desuscribirse<\/a>\n            <\/p>\n          <\/td>\n        <\/tr>\n\n      <\/table>\n\n    <\/td>\n  <\/tr>\n<\/table>\n\n<\/body>\n<\/html>"}, "1280": {"name": "Renewal SPEI", "subject": "⏰ Tu suscripción está por vencer", "htmlContent": "<!DOCTYPE html>\n<html lang=\"es\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:v=\"urn:schemas-microsoft-com:vml\">\n<head>\n\t<title>Renovación Pendiente por SPEI - heru<\/title>\n\t<style type=\"text/css\">\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: 'Helvetica', Arial, sans-serif; }\n    @media only screen and (max-width: 600px) {\n        .container { width: 100% !important; }\n        .content-padding { padding-left: 15px !important; padding-right: 15px !important; }\n        .logo-cell { font-size: 32px !important; }\n        .data-label { font-size: 13px !important; width: 100% !important; display: block !important; padding-bottom: 2px !important; text-align: left !important; }\n        .data-value { font-size: 13px !important; width: 100% !important; display: block !important; text-align: left !important; padding-bottom: 12px !important; }\n        .mob-banner-title { font-size: 18px !important; line-height: 1.3 !important; }\n        .clabe-text { font-size: 15px !important; letter-spacing: 1px !important; }\n    }\n\t<\/style>\n<\/head>\n<body style=\"font-family: 'Helvetica', Arial, sans-serif; margin: 0; padding: 0;\">\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"background-color: #f4f7f9; border-collapse: collapse;\" width=\"100%\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td align=\"center\" style=\"padding: 10px 0;\">\n\t\t\t<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"container\" role=\"presentation\" style=\"background-color: #ffffff; border-radius: 8px; overflow: hidden; width: 550px; margin: 0 auto; border-collapse: collapse;\" width=\"550\">\n\t\t\t\t<tbody>\n\n          <!-- HEADER PREMIUM UNIFICADO -->\n\t\t\t\t\t<tr>\n\t\t\t\t\t\t<td style=\"padding: 20px 25px; background-color: #ffffff; border-bottom: 1px solid #f1f5f9;\">\n              <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\">\n                <tbody>\n                  <tr>\n                    <td align=\"left\" valign=\"middle\">\n                      <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru\" width=\"72\" style=\"display: block; border: 0;\" />\n                    <\/td>\n                    <td align=\"right\" valign=\"middle\" style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 11px; color: #94a3b8; font-weight: 500;\">\n                      tus impuestos sin estrés\n                    <\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n\t\t\t\t\t\t<\/td>\n\t\t\t\t\t<\/tr>\n\n          <!-- BANNER HERO -->\n\t\t\t\t\t<tr>\n\t\t\t\t\t\t<td style=\"background-color: #1a3a5a; padding: 30px 25px;\">\n              <div style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 11px; font-weight: bold; color: #ffffff; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; opacity: 0.8;\">RENOVACIÓN PENDIENTE<\/div>\n              <h1 class=\"mob-banner-title\" style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 26px; font-weight: bold; color: #ffffff; margin: 0; line-height: 1.2;\">Tu suscripción está por vencer. Renueva por SPEI.<\/h1>\n\t\t\t\t\t\t<\/td>\n\t\t\t\t\t<\/tr>\n\n          <!-- CUERPO DEL CORREO -->\n\t\t\t\t\t<tr>\n\t\t\t\t\t\t<td class=\"content-padding\" style=\"padding: 25px 25px 20px 25px;\">\n              <div style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 14px; color: #4a5568; line-height: 1.5; margin-bottom: 20px;\">\n                Hola 👋<br /><br />\n                Tu suscripción está por vencer. Para continuar con tu servicio fiscal sin interrupciones, realiza una <strong>transferencia SPEI<\/strong> con los siguientes datos:\n              <\/div>\n\n              <!-- Ficha técnica SPEI -->\n              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"background-color: #f7fafc; border-radius: 8px; border: 1px solid #edf2f7; border-collapse: collapse;\" width=\"100%\">\n                <tbody>\n                  <tr>\n                    <td style=\"padding: 20px;\">\n                      <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                        <tbody>\n                          <tr>\n                            <td style=\"padding-bottom: 15px;\">\n                              <div style=\"font-size: 11px; color: #999999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;\">CLABE<\/div>\n                              <div class=\"clabe-text\" style=\"font-size: 22px; font-weight: bold; color: #1a3a5a; letter-spacing: 2px; font-family: 'Courier New', monospace;\">{{params.clabe}}<\/div>\n                            <\/td>\n                          <\/tr>\n                          <tr>\n                            <td style=\"padding-bottom: 12px; border-top: 1px solid #edf2f7; padding-top: 12px;\">\n                              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                                <tbody>\n                                  <tr>\n                                    <td class=\"data-label\" style=\"font-size: 11px; color: #999999; text-transform: uppercase; letter-spacing: 0.5px;\" width=\"40%\">Banco<\/td>\n                                    <td align=\"right\" class=\"data-value\" style=\"font-size: 14px; font-weight: bold; color: #1a3a5a;\" width=\"60%\">{{params.bankName}}<\/td>\n                                  <\/tr>\n                                <\/tbody>\n                              <\/table>\n                            <\/td>\n                          <\/tr>\n                          <tr>\n                            <td style=\"padding-bottom: 12px; border-top: 1px solid #edf2f7; padding-top: 12px;\">\n                              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                                <tbody>\n                                  <tr>\n                                    <td class=\"data-label\" style=\"font-size: 11px; color: #999999; text-transform: uppercase; letter-spacing: 0.5px;\" width=\"40%\">Beneficiario<\/td>\n                                    <td align=\"right\" class=\"data-value\" style=\"font-size: 14px; font-weight: bold; color: #1a3a5a;\" width=\"60%\">Heru<\/td>\n                                  <\/tr>\n                                <\/tbody>\n                              <\/table>\n                            <\/td>\n                          <\/tr>\n                          <tr>\n                            <td style=\"border-top: 1px solid #edf2f7; padding-top: 15px;\">\n                              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                                <tbody>\n                                  <tr>\n                                    <td style=\"font-size: 13px; color: #999999;\">Monto a pagar<\/td>\n                                    <td align=\"right\" style=\"font-size: 20px; font-weight: bold; color: #518dec;\">${{params.amount}} MXN<\/td>\n                                  <\/tr>\n                                <\/tbody>\n                              <\/table>\n                            <\/td>\n                          <\/tr>\n                        <\/tbody>\n                      <\/table>\n                    <\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n\n              <!-- Aviso de límite de días -->\n              <div style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #e53e3e; font-weight: bold; text-align: center; padding: 15px 0; line-height: 1.4;\">\n                ⏰ Tienes {{params.daysUntilDue}} días para realizar el pago\n              <\/div>\n\n              <!-- Nota aclaratoria -->\n              <div style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 12px; color: #a0aec0; line-height: 1.5; padding: 10px 0; border-top: 1px solid #edf2f7;\">\n                Una vez realizada la transferencia, tu pago se verá reflejado en un plazo de 1 a 3 días hábiles y tu suscripción se renovará automáticamente.\n              <\/div>\n\n              <!-- CTA principal -->\n              <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse; padding-top: 10px;\" width=\"100%\">\n                <tbody>\n                  <tr>\n                    <td align=\"center\" style=\"padding: 15px 0;\">\n                      <a href=\"https://web.heru.app/?flow=failed_renewal\" style=\"background-color: #1a3a5a; color: #ffffff; font-family: 'Helvetica', Arial, sans-serif; font-size: 14px; font-weight: bold; text-decoration: none; padding: 12px 30px; border-radius: 50px; display: inline-block;\">Ir a mi cuenta heru<\/a>\n                    <\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n\t\t\t\t\t\t<\/td>\n\t\t\t\t\t<\/tr>\n\n          <!-- FOOTER PREMIUM INTEGRADO -->\n          <tr>\n            <td style=\"background-color: #fafafa; padding: 32px 36px 28px; border-top: 1px solid #edf2f7;\" align=\"center\">\n              <p style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 14px; font-weight: 700; color: #003366; margin: 0;\">heru<\/p>\n              <p style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 12px; color: #888888; margin: 4px 0 20px;\">impuestos sin estrés<\/p>\n\n              <p style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 12px; color: #888888; line-height: 1.5; margin: 0; max-width: 420px; text-align: center;\">\n                Recibiste este correo porque te registraste en heru para liberarte del estrés de cumplir con tus impuestos.\n              <\/p>\n\n              <p style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 11px; color: #a0aec0; line-height: 1.4; margin: 16px 0 0 0; text-align: center;\">\n                Notificación automática de renovación • No es necesario responder.\n              <\/p>\n\n              <p style=\"margin-top: 16px; margin-bottom: 0; font-family: 'Helvetica', Arial, sans-serif;\">\n                <a href=\"{{ unsubscribe_url }}\" style=\"font-size: 12px; color: #888888; text-decoration: underline;\">Desuscribirse<\/a>\n              <\/p>\n            <\/td>\n          <\/tr>\n\n\t\t\t\t<\/tbody>\n\t\t\t<\/table>\n\t\t\t<\/td>\n\t\t<\/tr>\n\t<\/tbody>\n<\/table>\n<\/body>\n<\/html>"}, "1173": {"name": "Renovación fallida 1", "subject": "Tuvimos un problema con el cobro de tu plan, {{ params.first_name }}", "htmlContent": "<!doctype html>\n<html lang=\"es\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:v=\"urn:schemas-microsoft-com:vml\">\n<head>\n  <title><\/title>\n  <meta charset=\"UTF-8\" />\n  <meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\" />\n  <meta name=\"x-apple-disable-message-reformatting\" />\n  <style type=\"text/css\">\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: 'Helvetica', Arial, sans-serif; }\n    @media only screen and (max-width: 480px) {\n      .container { width: 100% !important; }\n      . overflow: hidden; border: 1px solid #e2e8f0;\">\n\n      <!-- HEADER blanco con logo + slogan -->\n      <tr>\n        <td class=\"header-pad\" style=\"padding: 24px 36px; background-color: #ffffff;\">\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td align=\"left\">\n                <img src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru\" width=\"72\" />\n              <\/td>\n              <td align=\"right\" class=\"slogan\" style=\"font-size: 11px; color: #94a3b8; font-weight: 500;\">\n                Tus impuestos sin estrés\n              <\/td>\n            <\/tr>\n          <\/table>\n        <\/td>\n      <\/tr>\n\n      <!-- BANNER azul (mismo color en todos) -->\n      <tr>\n        <td class=\"banner-pad\" style=\"background-color: #003366; padding: 36px 36px; color: #ffffff;\">\n          <p style=\"margin: 0 0 12px 0; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; opacity: 0.75; color: #ffffff;\">\n            Esto importa más de lo que crees\n          <\/p>\n          <h1 class=\"banner-title\" style=\"margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; color: #ffffff;\">\n            Adivinar tus impuestos sale caro.\n          <\/h1>\n          <p class=\"banner-subtitle\" style=\"margin: 14px 0 0 0; font-size: 15px; line-height: 1.5; opacity: 0.9; color: #ffffff;\">\n            Vincula tu RFC y deja de navegar a ciegas con tus finanzas fiscales.\n          <\/p>\n        <\/td>\n      <\/tr>\n\n      <!-- CUERPO -->\n      <tr>\n        <td class=\"mobile-pad\" style=\"padding: 36px;\">\n\n          <!-- Apertura -->\n          <p class=\"opener-short\" style=\"margin: 0 0 12px 0; font-size: 19px; font-weight: 700; color: #0f172a; line-height: 1.3;\">\n            Hola, esto importa más de lo que crees.\n          <\/p>\n          <p class=\"opener-full\" style=\"margin: 0 0 22px 0; font-size: 15px; line-height: 1.6; color: #475569;\">\n            Mientras tu RFC no esté vinculado en heru, <strong>sigues navegando a ciegas con tus impuestos<\/strong>: sin saber cuánto pagas realmente, cuánto te deben, ni si estás al corriente con el SAT.\n          <\/p>\n\n          <!-- 2 preguntas -->\n          <p style=\"margin: 0 0 8px 0; font-size: 14px; line-height: 1.5; color: #64748b; font-style: italic;\">\n            ¿Sabes exactamente cuánto vas a pagar de impuestos este mes?\n          <\/p>\n          <p style=\"margin: 0 0 26px 0; font-size: 14px; line-height: 1.5; color: #64748b; font-style: italic;\">\n            ¿Cuánto te van a devolver al final del año?\n          <\/p>\n\n          <!-- Lista de \"lo que te pierdes\" -->\n          <p style=\"margin: 0 0 14px 0; font-size: 12px; font-weight: 700; color: #dc2626; text-transform: uppercase; letter-spacing: 1.5px;\">\n            Lo que desbloqueas al vincular:\n          <\/p>\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 26px;\">\n            \n                <tr>\n                  <td valign=\"top\" width=\"20\" style=\"padding: 6px 12px 6px 0; font-size: 16px; color: #dc2626; line-height: 1.4;\">✓<\/td>\n                  <td valign=\"top\" style=\"padding: 6px 0; font-size: 14px; line-height: 1.5; color: #475569;\">Dashboard con todos tus ingresos, gastos e impuestos<\/td>\n                <\/tr>\n                <tr>\n                  <td valign=\"top\" width=\"20\" style=\"padding: 6px 12px 6px 0; font-size: 16px; color: #dc2626; line-height: 1.4;\">✓<\/td>\n                  <td valign=\"top\" style=\"padding: 6px 0; font-size: 14px; line-height: 1.5; color: #475569;\">Histórico de declaraciones y montos pagados<\/td>\n                <\/tr>\n                <tr>\n                  <td valign=\"top\" width=\"20\" style=\"padding: 6px 12px 6px 0; font-size: 16px; color: #dc2626; line-height: 1.4;\">✓<\/td>\n                  <td valign=\"top\" style=\"padding: 6px 0; font-size: 14px; line-height: 1.5; color: #475569;\">Saber al momento si estás al corriente con el SAT<\/td>\n                <\/tr>\n          <\/table>\n\n          <!-- CTA conversacional -->\n          <p style=\"margin: 0 0 22px 0; font-size: 16px; font-weight: 700; line-height: 1.4; color: #0f172a;\">\n            Vincula tu RFC ahora <span style=\"color: #dc2626;\">y deja de adivinar.<\/span>\n          <\/p>\n\n          <!-- Quote -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #f8fafc; border-left: 4px solid #dc2626; border-radius: 0 12px 12px 0; margin-bottom: 26px;\">\n            <tr>\n              <td style=\"padding: 14px 18px;\">\n                <p style=\"margin: 0 0 5px 0; font-size: 13px; line-height: 1.5; color: #334155; font-style: italic;\">\n                  \"Por primera vez en mi vida entiendo cuánto pago de impuestos y por qué.\"\n                <\/p>\n                <p style=\"margin: 0; font-size: 11px; color: #94a3b8;\">\n                  — Usuario de heru\n                <\/p>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Cupón (bonus) -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #fef2f2; border: 1.5px solid #fecaca; border-radius: 16px; margin-bottom: 16px;\">\n            <tr>\n              <td align=\"center\" style=\"padding: 20px 16px;\">\n                <p style=\"margin: 0; font-size: 11px; color: #991b1b; opacity: 0.8; font-weight: 600; letter-spacing: 0.5px;\">\n                  Y como bonus por vincular hoy\n                <\/p>\n                <h2 class=\"discount-text\" style=\"margin: 4px 0; font-size: 36px; color: #991b1b; line-height: 1; font-weight: 800;\">\n                  40% OFF\n                <\/h2>\n                <p style=\"margin: 4px 0 0 0; font-size: 12px; color: #475569;\">\n                  al activar tu plan · cupón <strong>CONECTA40<\/strong>\n                <\/p>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- CTA principal -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            <tr>\n              <td align=\"center\" style=\"padding: 12px 0 4px 0;\">\n                <table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"box-shadow: 0 8px 14px -4px rgba(0, 145, 255, 0.3);\">\n                  <tr>\n                    <td align=\"center\" style=\"border-radius: 8px; background-color: #0091ff;\">\n                      <a href=\"https://web.heru.app/login/\" target=\"_blank\" style=\"display: inline-block; padding: 16px 36px; font-size: 14px; font-weight: 700; color: #ffffff; text-decoration: none; letter-spacing: 0.5px;\">\n                        VINCULAR MI RFC AHORA\n                      <\/a>\n                    <\/td>\n                  <\/tr>\n                <\/table>\n                <p style=\"margin: 10px 0 0 0; font-size: 12px; color: #94a3b8;\">\n                  Toma menos de 2 minutos · 🔒 Cifrado seguro\n                <\/p>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- ────────────────────────────────────────── -->\n          <!-- CTA WhatsApp (discreto, no roba atención)  -->\n          <!-- ────────────────────────────────────────── -->\n          <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-top: 30px;\">\n            <tr>\n              <td style=\"padding: 16px 18px; background-color: #f0f9f4; border: 1px solid #d1fae5; border-radius: 12px;\">\n                <table width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                  <tr>\n                    <td valign=\"middle\" width=\"40\" style=\"padding-right: 12px; font-size: 24px; line-height: 1;\">💬<\/td>\n                    <td valign=\"middle\">\n                      <p class=\"wa-cta-text\" style=\"margin: 0 0 2px 0; font-size: 14px; font-weight: 700; color: #065f46; line-height: 1.3;\">\n                        ¿Necesitas ayuda con tus credenciales?\n                      <\/p>\n                      <p style=\"margin: 0; font-size: 12px; color: #047857; line-height: 1.4;\">\n                        Escríbenos por WhatsApp →\n                        <a href=\"https://heru.trb.ai/wa/3Sha9L4\" target=\"_blank\" style=\"color: #047857; text-decoration: underline; font-weight: 700;\">\n                          Contactar ahora\n                        <\/a>\n                      <\/p>\n                    <\/td>\n                  <\/tr>\n                <\/table>\n              <\/td>\n            <\/tr>\n          <\/table>\n\n          <!-- Soporte email -->\n          <p style=\"font-size: 12px; color: #94a3b8; margin-top: 24px; border-top: 1px solid #f1f5f9; padding-top: 22px; text-align: center; line-height: 1.5;\">\n            ¿Otra duda? Escríbenos a <a href=\"mailto:ayuda@heru-app.com\" style=\"color: #0091ff; text-decoration: none; font-weight: 500;\">ayuda@heru-app.com<\/a>\n          <\/p>\n        <\/td>\n      <\/tr>\n\n      <!-- Footer -->\n      <tr>\n        <td align=\"center\" style=\"padding: 24px 36px; background-color: #f8fafc; color: #64748b; font-size: 11px; text-align: center;\">\n          <p style=\"margin: 0 0 6px 0; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;\">Equipo heru<\/p>\n          <p style=\"margin: 0; font-size: 10px; color: #cbd5e1;\">\n            <a href=\"{{ unsubscribe }}\" style=\"color: #94a3b8; text-decoration: underline;\">Date de baja aquí<\/a>\n          <\/p>\n        <\/td>\n      <\/tr>\n    <\/table>\n  <\/div>\n<\/body>\n<\/html>\n"}, "945": {"name": "CSAT_Declaración_presentada", "subject": "¡Lo lograste! ¿Qué te pareció la experiencia heru?", "htmlContent": "<!DOCTYPE html><html lang=\"en\"><head><title><\/title><\/head><body aria-disabled=\"false\">\n\n\n\n\n\n\n<p fr-original-style=\"\" style=\"font-size: 16px; font-family: Arial;\">\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n<title>Feedback de tu Declaración<\/title>\n\n<\/p>\n\n<style>\n\n/* Estilos generales del cuerpo del correo */\n\n\nbody {\n\nmargin: 0; padding: 0; background-color: #f7f9fc;/* Un fondo azulado muy claro, como en la web */\n\nfont-family: Arial, sans-serif; -webkit-font-smoothing: antialiased;\n\n}\n\n/* Contenedor principal */\n\n\n.container {\n\nwidth: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px 0;/* Más padding vertical */\n\nborder-radius: 12px;/* Bordes redondeados para el contenedor */\n\noverflow: hidden;/* Para que el footer no se salga de los bordes redondeados */\n\n/* CAMBIO REALIZADO AQUÍ: Se ha añadido text-align: center; */\n\n/* Esto forzará a que todo el contenido de texto dentro del contenedor esté centrado por defecto. */\n\ntext-align: center;\n\n}\n\n/* Estilos de texto inspirados en heru */\n\n\n.header {\n\nfont-size: 26px;/* Un poco más grande */\n\nfont-weight: bold; color: #00A9E0;/* Azul brillante principal de heru */\n\n/* text-align: center; <-- Eliminado ya que el .container se encarga */\n\nmargin-bottom: 10px; padding: 0 20px;\n\n}\n\n\n.subheader {\n\nfont-size: 16px; color: #555555;\n\n/* text-align: center; <-- Eliminado ya que el .container se encarga */\n\nline-height: 1.6;/* Mayor interlineado */\n\nmargin-bottom: 30px; padding: 0 20px;\n\n}\n\n/* Estilos de la escala NPS - Tema heru */\n\n/* CAMBIO REALIZADO AQUÍ: Se ajustó el max-width para la escala de 5 botones */\n\n\n.nps-scale-table {\n\nwidth: 100%; max-width: 350px;/* Reducido de 560px para 5 botones */\n\nmargin: 0 auto 15px auto; border-collapse: separate; border-spacing: 6px;/* Un poco más de espacio entre botones */\n\ntable-layout: fixed;\n\n}\n\n\n.nps-scale-table td {\n\ntext-align: center; font-weight: bold; font-size: 16px; border-radius: 8px;\n\n}\n\n\n.nps-scale-table a {\n\ntext-decoration: none; display: block; padding: 12px 0; border-radius: 8px;\n\n}\n\n/* Nueva paleta de colores para la escala (Ajustada para 1-5) */\n\n/* 1-2 = Detractor */\n\n\n.detractor a {\n\nbackground-color: #E0E0E0; color: #333333;\n\n}\n\n/* Gris claro neutral */\n\n/* 3 = Pasivo */\n\n\n.passive a {\n\nbackground-color: #B3E5FC; color: #0D47A1;\n\n}\n\n/* Azul claro pasivo */\n\n/* 4-5 = Promotor */\n\n\n.promoter a {\n\nbackground-color: #00A9E0; color: #ffffff;\n\n}\n\n/* Azul brillante de heru */\n\n/* Etiquetas debajo de la escala */\n\n/* CAMBIO REALIZADO AQUÍ: Se ajustó el max-width para que coincida con la escala */\n\n\n.labels-table {\n\nwidth: 100%; max-width: 350px;/* Reducido de 560px */\n\nmargin: 0 auto; font-size: 12px; color: #888888;\n\n}\n\n/* CAMBIO REALIZADO AQUÍ: Se fuerza el text-align left/right para anular el centrado del .container */\n\n\n.labels-table .left {\n\ntext-align: left;\n\n}\n\n\n.labels-table .right {\n\ntext-align: right;\n\n}\n\n\n.footer {\n\n/* text-align: center; <-- Eliminado ya que el .container se encarga */\n\nfont-size: 14px; color: #888888;/* Un gris más sutil para el footer */\n\nmargin-top: 30px; padding: 0 20px;\n\n}\n\n\n\n<\/style>\n\n\n\n<table role=\"presentation\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" fr-original-style=\"\" style=\"border: none; border-collapse: collapse; empty-cells: show; max-width: 100%; font-size: 16px; font-family: Arial;\"><tbody><tr><!-- CAMBIO REALIZADO AQUÍ: He añadido align=\"center\" para asegurar que el contenedor principal esté siempre centrado -->\n\n<td style=\"padding: 20px 0px; min-width: 5px; user-select: text; border: 0px solid transparent; background: unset;\" align=\"center\" fr-original-style=\"padding: 20px 0;\">\n\n<div fr-original-style=\"\" fr-original-class=\"container\" style=\"font-size: 16px; font-family: Arial; width: 100%; max-width: 600px; margin: 0px auto; background-color: rgb(255, 255, 255); padding: 30px 0px; border-radius: 12px; overflow: hidden; text-align: center;\">\n\n<!-- SECCIÓN DEL LOGO ELIMINADA -->\n\n\n\n<div fr-original-style=\"\" fr-original-class=\"header\" style=\"font-size: 26px; font-family: Arial; font-weight: bold; color: rgb(0, 169, 224); margin-bottom: 10px; padding: 0px 20px;\">\n\n<img src=\"https://img.mailinblue.com/2760736/images/content_library/original/68ddb78fb50f56d8da83d18c.png\" alt=\"Content Library Image\" style=\"width: 226px; display: inline-block; vertical-align: bottom; margin-right: 5px; margin-left: 5px; max-width: calc(100% - 10px); text-align: center; cursor: pointer; padding: 0px 1px; position: relative;\" fr-original-style=\"width: 226px; display: inline-block; vertical-align: bottom; margin-right: 5px; margin-left: 5px; max-width: calc(100% - 10px); text-align: center;\" fr-original-class=\"fr-draggable\">\n\n<br>\n\n<br>¡Misión cumplida {{params.nombre}}!\n\n<br> <\/div>\n\n<div fr-original-style=\"\" fr-original-class=\"subheader\" style=\"font-size: 16px; font-family: Arial; color: rgb(85, 85, 85); line-height: 1.6; margin-bottom: 30px; padding: 0px 20px;\">\n\nTu declaración de impuestos de {{ params.periodo }} ha sido presentada con éxito.\n\n<br>Para mejorar tu experiencia futura, nos encantaría que nos calificaras.\n\n<\/div>\n\n\n\n<!-- CAMBIO REALIZADO AQUÍ: Pregunta actualizada a \"calidad\" -->\n\n<div style=\"font-weight: bold; margin-bottom: 20px; color: rgb(51, 51, 51); font-size: 16px; font-family: Arial; line-height: 1.6; padding: 0px 20px;\" fr-original-style=\"font-weight: bold; margin-bottom: 20px; color: #333;\" fr-original-class=\"subheader\">\n\nConsiderando todo el proceso,\n\n<br>¿cómo calificarías la calidad de nuestro servicio?\n\n<\/div>\n\n\n\n<!-- INICIO DE LA ESCALA NPS INTERACTIVA -->\n\n                    <!-- CAMBIO REALIZADO AQUÍ: Se modificó la tabla para mostrar una escala de 1 a 5 -->\n\n                    <table role=\"presentation\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" fr-original-style=\"\" fr-original-class=\"nps-scale-table\" style=\"border: none; border-collapse: separate; empty-cells: show; max-width: 350px; font-size: 16px; font-family: Arial; width: 100%; margin: 0px auto 15px; border-spacing: 6px; table-layout: fixed;\"><tbody><tr><!-- 1-2 = Detractores -->\n\n                            <!-- CAMBIO REALIZADO AQUÍ: URL del botón actualizada -->\n\n                            <td fr-original-style=\"\" fr-original-class=\"detractor\" style=\"min-width: 5px; user-select: text; border: 1px solid transparent; text-align: center; font-weight: bold; font-size: 16px; border-radius: 8px; background: unset;\"><a href=\"https://web.heru.app/declarations/?declaration_presented_rating=1&declaration_period={{params.period_number}}\" fr-original-style=\"\" style=\"user-select: auto; text-decoration: none; display: block; padding: 12px 0px; border-radius: 8px; background-color: rgb(224, 224, 224); color: rgb(51, 51, 51);\">1<\/a><\/td>\n\n                            <!-- CAMBIO REALIZADO AQUÍ: URL del botón actualizada -->\n\n                            <td fr-original-style=\"\" fr-original-class=\"detractor\" style=\"min-width: 5px; user-select: text; border: 1px solid transparent; text-align: center; font-weight: bold; font-size: 16px; border-radius: 8px; background: unset;\"><a href=\"https://web.heru.app/declarations/?declaration_presented_rating=2&declaration_period={{params.period_number}}\" fr-original-style=\"\" style=\"user-select: auto; text-decoration: none; display: block; padding: 12px 0px; border-radius: 8px; background-color: rgb(224, 224, 224); color: rgb(51, 51, 51);\">2<\/a><\/td>\n\n                            <!-- 3 = Pasivo -->\n\n                            <!-- CAMBIO REALIZADO AQUÍ: URL del botón actualizada -->\n\n                            <td fr-original-style=\"\" fr-original-class=\"passive\" style=\"min-width: 5px; user-select: text; border: 1px soli   cohVinc:`WITH lk AS (SELECT user_id,min((created_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date) dia FROM financials.link WHERE created_at>=now()-interval '30 days' AND LOWER(status)='active' GROUP BY user_id),

  cohDeclRonda:`WITH decl AS (SELECT user_id,(sent_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date dia FROM marketing.email_log WHERE sent_at>=now()-interval '30 days' AND source='closing_workflow' AND template_id='976' GROUP BY 1,2),

function drawTrend(){

  const dias=[...new Set(rows.map(r=>r.dia))].sort();const cfg={Email:C.email,Push:C.push,Llamadas:C.calls};
  const ds=Object.keys(cfg).map(c=>({label:c,data:dias.map(d=>{const h=rows.find(r=>r.dia===d&&r.canal===c);return h?+h.total:(scaleLog?null:0)}),borderColor:cfg[c],backgroundColor:cfg[c],fill:false,tension:.3,borderWidth:2,pointRadius:0,pointHoverRadius:4,spanGaps:true}));
  if(charts.trend)charts.trend.destroy();
  charts.trend=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:dias.map(d=>d.slice(5)),datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',align:'start'},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}},scales:{x:GX,y:{type:scale,...GY,ticks:{callback:v=>fmt(v)}}}}});

}

        <div class="grid g5">${kpi('Campañas',C.email,fmt(cs.length),'enviadas · 30d')}${kpi('Apertura',C.green,pct1(tot.opens,tot.delivered),`${fmt(tot.opens)} de ${fmt(tot.delivered)}`)}${kpi('Clic',C.push,pct1(tot.clicks,tot.delivered),`${fmt(tot.clicks)} únicos`)}${kpi('Rebotes',C.amber,pct1(tot.soft+tot.hard,tot.sent),fmt(tot.soft+tot.hard))}${kpi('Bajas',C.red,fmt(tot.unsub),'desuscripciones')}</div></div>

        <div class="grid g4">${kpi('Remitentes',C.grey,fmt(senderCount),'senders activos')}${kpi('Listas',C.grey,fmt(listCount),'de contactos')}${kpi('Segmentos',C.grey,fmt(segCount),'dinámicos')}${kpi('Plantillas',C.grey,fmt(tmpl),'transaccionales')}</div></div>
      <div class="section"><h2>Campañas recientes</h2><p class="sub">Apertura en verde si ≥25%, ámbar si ≥12%.</p>
        <div class="card"><div class="scroll"><table class="tbl"><thead><tr><th>Fecha</th><th>Asunto</th><th>Remitente</th><th class="num">Entregados</th><th class="num">Apertura</th><th class="num">Clic</th><th class="num">Rebote</th><th class="num">Bajas</th></tr></thead><tbody>${crows||'<tr><td>Sin campañas.</td></tr>'}</tbody></table></div></div></div>
      <div class="grid g2">
        <div class="section" style="margin:0"><h2>Listas más grandes</h2><p class="sub">Top 10 de ${fmt(listCount)} por suscriptores.</p><div class="card"><div class="chart-box sm"><canvas id="listsChart"></canvas></div></div></div>
        <div class="section" style="margin:0"><h2>Correo transaccional por origen</h2><p class="sub">Qué flujo automático dispara más correos (30d).</p><div class="card"><div class="chart-box sm"><canvas id="sourceChart"></canvas></div></div></div>
      </div>
      <p class="note">Cuenta Brevo: KUARTO APARTE · plan Business · dominio news.somosheru.com.</p>`;
    hBar('listsChart',topLists.map(l=>l.name.length>24?l.name.slice(0,22)+'…':l.name),topLists.map(l=>l.uniqueSubscribers||0),topLists.map((_,i)=>C.bars[i%C.bars.length]));
    const ts=dbSrc.slice(0,12);hBar('sourceChart',ts.map(s=>s.source.length>24?s.source.slice(0,22)+'…':s.source),ts.map(s=>+s.total),ts.map((_,i)=>C.bars[i%C.bars.length]));
    setUpd();
  }catch(e){body.innerHTML='<div class="err">Error: '+(e.message||e)+'</div>';brDone=false}
}

document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');const v=b.dataset.view;document.getElementById('view-'+v).classList.add('active');
  if(v==='resumen')loadResumen();if(v==='recorrido'){loadRecorrido();precargarPlantillas();}if(v==='cohortes')loadCohortes();if(v==='brevo'){loadBrevo();precargarPlantillas();}});
loadResumen();
try{setUpd=function(){var e=document.getElementById('upd');if(e)e.textContent='Snapshot 27 jul 2026 \u00b7 datos congelados';};setUpd();}catch(e){}
</script>
</body>
