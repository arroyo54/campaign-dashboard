   ren AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '32 days' AND (source LIKE 'journey_renovacion%' OR template_id='1239'))
   SELECT (SELECT count(*) FROM reg) u_reg,
    (SELECT count(DISTINCT e.user_id) FROM marketing.email_log e JOIN reg r ON r.id=e.user_id WHERE e.sent_at>=now()-interval '32 days' AND e.template_id='1245') r_1245,
    (SELECT count(*) FROM lk) u_lk,
    (SELECT count(DISTINCT e.user_id) FROM marketing.email_log e JOIN lk l ON l.user_id=e.user_id WHERE e.sent_at>=now()-interval '33 days' AND e.template_id='1253') r_1253,
    (SELECT count(*) FROM buy) u_buy,
    (SELECT count(DISTINCT e.user_id) FROM marketing.email_log e JOIN buy b ON b.user_id=e.user_id WHERE e.sent_at>=now()-interval '33 days' AND e.template_id IN ('1255','1256','1257','1258','1261','1266','1267','1282','1299')) r_compra,
    (SELECT count(*) FROM decl) u_decl,
    (SELECT count(DISTINCT e.user_id) FROM marketing.email_log e JOIN decl d ON d.user_id=e.user_id WHERE e.sent_at>=now()-interval '33 days' AND e.template_id='945') r_945,
    (SELECT count(*) FROM ren) u_ren,
    (SELECT count(DISTINCT e.user_id) FROM marketing.email_log e JOIN ren rn ON rn.user_id=e.user_id WHERE e.sent_at>=now()-interval '33 days' AND e.template_id='1262') r_1262`,
  emailFaseDia:`SELECT (sent_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date::text dia,
      CASE
       WHEN template_id IN ('1130','1125','1129','1131') THEN 'Extracción'
       WHEN template_id IN ('1245','1340') THEN 'Registro'
       WHEN template_id IN ('1171','1172','1253') THEN 'Vincular SAT'
       WHEN template_id IN ('1183','1182') THEN 'Conversión'
       WHEN template_id IN ('1255','1261','1256','1266','1267','1299','1282','1257','1258','1264','1263','1279','1283','1278','1284','1265','1277','1293') THEN 'Postcompra'
       WHEN template_id IN ('976','1248','1249','1250','1251','1359','1206','1162') THEN 'Declaración'
       WHEN template_id IN ('1217','1219','1354','1355','1353') THEN 'Facturación'
       WHEN template_id IN ('1239','1236','1237','1262','1280','1173','1174','1175') THEN 'Renovación'
       WHEN template_id IN ('1223','1224','1225','1226','1227','1228','1234') THEN 'Churn'
       WHEN template_id IN ('945','1160','1184') THEN 'Encuestas'
       ELSE 'Otros' END fase, count(*) n
     FROM marketing.email_log WHERE sent_at>=now()-interval '30 days' GROUP BY 1,2 ORDER BY 1`,
  source:`SELECT COALESCE(source,'(sin origen)') source,count(*) total,count(*) FILTER (WHERE status='failed') fallidos FROM marketing.email_log WHERE sent_at>=now()-interval '30 days' GROUP BY 1 ORDER BY 2 DESC`,
  cohRegistro:`WITH cohort AS (SELECT id,email,(joined_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date reg_dia FROM users.user_account WHERE joined_at>=now()-interval '30 days'),
      mail AS (SELECT user_id,count(*) FILTER (WHERE status='sent') env,count(*) FILTER (WHERE status='failed') fail FROM marketing.email_log WHERE sent_at>=now()-interval '32 days' AND user_id IS NOT NULL GROUP BY user_id),
      push AS (SELECT DISTINCT user_id FROM marketing.notification WHERE created_at>=now()-interval '32 days'),
      lnk AS (SELECT DISTINCT user_id FROM financials.link WHERE created_at>=now()-interval '32 days' AND LOWER(status)='active')
      SELECT c.reg_dia::text dia,count(*) registros,count(*) FILTER (WHERE COALESCE(m.env,0)>0) con_email,count(*) FILTER (WHERE COALESCE(m.fail,0)>0) email_fallo,count(*) FILTER (WHERE m.user_id IS NULL AND c.email IS NOT NULL AND c.email<>'') huecos,count(p.user_id) con_push,count(l.user_id) vinculo
      FROM cohort c LEFT JOIN mail m ON m.user_id=c.id LEFT JOIN push p ON p.user_id=c.id LEFT JOIN lnk l ON l.user_id=c.id GROUP BY c.reg_dia ORDER BY c.reg_dia`,
  cohCoverage:`WITH cohort AS (SELECT id,email FROM users.user_account WHERE joined_at>=now()-interval '30 days'),
      mail AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '32 days' AND user_id IS NOT NULL)
      SELECT count(*) total,count(*) FILTER (WHERE email IS NOT NULL AND email<>'') con_correo,count(*) FILTER (WHERE m.user_id IS NOT NULL) se_envio,count(*) FILTER (WHERE (email IS NOT NULL AND email<>'') AND m.user_id IS NULL) hueco
      FROM cohort c LEFT JOIN mail m ON m.user_id=c.id`,
  cohVinc:`WITH lk AS (SELECT user_id,min((created_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date) dia FROM financials.link WHERE created_at>=now()-interval '30 days' AND LOWER(status)='active' GROUP BY user_id),
      conf AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND template_id='1253'),
      comp AS (SELECT DISTINCT user_id FROM payments_v2.transaction WHERE created_at>=now()-interval '33 days' AND succeed AND is_finished),
      fl AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND status='failed'),
      att AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days'),
      pu AS (SELECT DISTINCT user_id FROM marketing.notification WHERE created_at>=now()-interval '33 days')
      SELECT l.dia::text dia,count(*) vincularon,count(cf.user_id) recibio_confirmacion,count(c.user_id) compraron,count(pn.user_id) con_push,count(x.user_id) fallos,count(*) FILTER (WHERE t.user_id IS NULL) huecos
      FROM lk l LEFT JOIN conf cf ON cf.user_id=l.user_id LEFT JOIN comp c ON c.user_id=l.user_id LEFT JOIN fl x ON x.user_id=l.user_id LEFT JOIN att t ON t.user_id=l.user_id LEFT JOIN pu pn ON pn.user_id=l.user_id GROUP BY l.dia ORDER BY l.dia`,
  cohCompra:`WITH renu AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND (source LIKE 'journey_renovacion%' OR template_id IN ('1262','1239','1173','1174','1175'))),
      buy AS (SELECT user_id,min((created_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date) dia FROM payments_v2.transaction WHERE created_at>=now()-interval '30 days' AND succeed AND is_finished AND user_id NOT IN (SELECT user_id FROM renu) GROUP BY user_id),
      conf AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND template_id IN ('1255','1256','1257','1258','1261','1266','1267','1282','1299')),
      decl AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND template_id='976'),
      fl AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND status='failed'),
      att AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days'),
      pu AS (SELECT DISTINCT user_id FROM marketing.notification WHERE created_at>=now()-interval '33 days')
      SELECT b.dia::text dia,count(*) compraron,count(cf.user_id) recibio_confirmacion,count(d.user_id) recibio_declaracion,count(pn.user_id) con_push,count(x.user_id) fallos,count(*) FILTER (WHERE t.user_id IS NULL) huecos
      FROM buy b LEFT JOIN conf cf ON cf.user_id=b.user_id LEFT JOIN decl d ON d.user_id=b.user_id LEFT JOIN fl x ON x.user_id=b.user_id LEFT JOIN att t ON t.user_id=b.user_id LEFT JOIN pu pn ON pn.user_id=b.user_id GROUP BY b.dia ORDER BY b.dia`,
  cohDeclRonda:`WITH decl AS (SELECT user_id,(sent_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date dia FROM marketing.email_log WHERE sent_at>=now()-interval '30 days' AND source='closing_workflow' AND template_id='976' GROUP BY 1,2),
      csat AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND template_id='945'),
      fl AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND status='failed'),
      att AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days'),
      pu AS (SELECT DISTINCT user_id FROM marketing.notification WHERE created_at>=now()-interval '33 days')
      SELECT d.dia::text dia,count(*) declaraciones,count(cs.user_id) recibio_csat,count(pn.user_id) con_push,count(x.user_id) fallos,count(*) FILTER (WHERE t.user_id IS NULL) huecos FROM decl d LEFT JOIN csat cs ON cs.user_id=d.user_id LEFT JOIN fl x ON x.user_id=d.user_id LEFT JOIN att t ON t.user_id=d.user_id LEFT JOIN pu pn ON pn.user_id=d.user_id GROUP BY d.dia ORDER BY d.dia`,
  cohRegu:`WITH regu_pv AS (SELECT id FROM plans.product_version WHERE product_id IN (13,24,25,26,27,31,32,33,42,43,44,45,97,98,99,100,101,102,103,104,105,111,112,122,1118)),
      buyers AS (SELECT sc.user_id, min((sc.created_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date) dia FROM plans.shopping_cart sc JOIN plans.shopping_item si ON si.shopping_cart_id=sc.id WHERE si.product_version_id IN (SELECT id FROM regu_pv) AND sc.created_at>=now()-interval '30 days' AND LOWER(sc.status) IN ('processed','closed') GROUP BY sc.user_id),
      pany AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND template_id IN ('1248','1249','1250','1251','976')),
      fl AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND status='failed')
      SELECT b.dia::text dia,count(*) compraron,count(pa.user_id) recibio_flujo,count(*) FILTER (WHERE pa.user_id IS NULL) huecos,count(x.user_id) fallos
      FROM buyers b LEFT JOIN pany pa ON pa.user_id=b.user_id LEFT JOIN fl x ON x.user_id=b.user_id GROUP BY b.dia ORDER BY b.dia`,
  cohRenov:`WITH avis AS (SELECT user_id,min((sent_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date) dia FROM marketing.email_log WHERE sent_at>=now()-interval '30 days' AND (source LIKE 'journey_renovacion%' OR template_id='1239') GROUP BY user_id),
      exito AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND template_id='1262'),
      fall AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND template_id IN ('1173','1174','1175')),
      fl AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days' AND status='failed'),
      att AS (SELECT DISTINCT user_id FROM marketing.email_log WHERE sent_at>=now()-interval '33 days'),
      pu AS (SELECT DISTINCT user_id FROM marketing.notification WHERE created_at>=now()-interval '33 days')
      SELECT a.dia::text dia,count(*) en_renovacion,count(e.user_id) renovo_exito,count(f.user_id) tuvo_fallida,count(pn.user_id) con_push,count(x.user_id) fallos,count(*) FILTER (WHERE t.user_id IS NULL) huecos
      FROM avis a LEFT JOIN exito e ON e.user_id=a.user_id LEFT JOIN fall f ON f.user_id=a.user_id LEFT JOIN fl x ON x.user_id=a.user_id LEFT JOIN att t ON t.user_id=a.user_id LEFT JOIN pu pn ON pn.user_id=a.user_id GROUP BY a.dia ORDER BY a.dia`
};

function tplRender(t,tplId){const body=document.getElementById('tplBody'),ttl=document.getElementById('tplTitle');
  ttl.innerHTML=`<b>${t.name||('tpl '+tplId)}</b> <span style="color:#9599a8">— ${t.subject||''}</span>`;
  body.innerHTML='';const f=document.createElement('iframe');f.style.width='100%';f.style.height='100%';f.style.border='0';f.style.background='#fff';body.appendChild(f);f.srcdoc=t.html||('<div style="font-family:sans-serif;padding:24px;color:#6b7280;line-height:1.6">Vista previa del dise\u00f1o no incrustada para esta plantilla (<b>'+tplId+'</b>).<br>El env\u00edo s\u00ed se contabiliza en las m\u00e9tricas.</div>');}
function verPlantillaMulti(csv){var ids=String(csv||'').split(',').map(function(x){return x.trim();}).filter(Boolean);var pk=document.getElementById('tplPicker');if(!ids.length)return;if(!pk){verPlantilla(ids[0]);return;}if(ids.length===1){pk.style.display='none';pk.innerHTML='';verPlantilla(ids[0]);return;}pk.style.display='flex';pk.innerHTML='';function setActive(id){Array.prototype.forEach.call(pk.children,function(c){var on=c.dataset.id===String(id);c.style.background=on?'#4f46e5':'#fff';c.style.color=on?'#fff':'#5b6070';c.style.borderColor=on?'#4f46e5':'var(--sep)';});}ids.forEach(function(id){var t=(window.__STATIC_DATA&&__STATIC_DATA.tpl&&__STATIC_DATA.tpl[id])||{};var b=document.createElement('button');b.textContent=t.name||('tpl '+id);b.dataset.id=id;b.style.cssText='font-size:11px;padding:5px 10px;border:1px solid var(--sep);border-radius:999px;background:#fff;color:#5b6070;cursor:pointer;font-family:inherit';b.addEventListener('click',function(){setActive(id);verPlantilla(id);});pk.appendChild(b);});setActive(ids[0]);verPlantilla(ids[0]);}
async function verPlantilla(tplId){const ov=document.getElementById('tplModal'),body=document.getElementById('tplBody'),ttl=document.getElementById('tplTitle');
  ov.style.display='flex';const key='heruTpl_'+tplId;
  // 1) cache local (persiste aunque Brevo se desconecte)
  try{const c=localStorage.getItem(key);if(c){tplRender(JSON.parse(c),tplId);return;}}catch(e){}
  ttl.textContent='Cargando plantilla '+tplId+'…';body.innerHTML='<div class="loading">Trayendo la plantilla desde Brevo (se guardará para la próxima)…</div>';
  try{const r=await callTool(BREVO+'templates_get_smtp_template',{templateId:String(tplId)});
    const t={name:r.name,subject:r.subject,html:r.htmlContent||''};
    try{localStorage.setItem(key,JSON.stringify(t));}catch(e){}
    tplRender(t,tplId);
  }catch(e){ttl.textContent='Plantilla no disponible';body.innerHTML='<div class="err" style="margin:16px">No se pudo cargar la plantilla '+tplId+'.<br><br>Necesita el conector de Brevo activo. Si ya lo reconectaste, cierra este panel, recárgalo y vuelve a intentar — la primera vez la trae de Brevo y luego queda guardada.<br><br><span style="color:#9599a8">Detalle: '+(e.message||e)+'</span></div>'}
}
// Pre-carga en segundo plano: intenta cachear todas las plantillas del recorrido al abrir el panel
async function precargarPlantillas(){const ids=[...new Set(FASES.flatMap(f=>(f.mails||[]).flatMap(m=>m.tpls||[])))].filter(Boolean);
  for(const id of ids){const key='heruTpl_'+id;try{if(localStorage.getItem(key))continue;}catch(e){}
    try{const r=await callTool(BREVO+'templates_get_smtp_template',{templateId:String(id)});
      try{localStorage.setItem(key,JSON.stringify({name:r.name,subject:r.subject,html:r.htmlContent||''}));}catch(e){}
    }catch(e){/* Brevo no disponible: se cachea cuando esté */ break;}
    await new Promise(r=>setTimeout(r,120));}
}

function cohCell(r,c,anchor){const[h,f,mode]=c;

function __parseCSV(t){var R=[],f='',row=[],q=false,i=0,c;for(;i<t.length;i++){c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else{q=false;}}else{f+=c;}}else{if(c=='"'){q=true;}else if(c==','){row.push(f);f='';}else if(c=='\n'){row.push(f);R.push(row);row=[];f='';}else if(c=='\r'){}else{f+=c;}}}if(f.length||row.length){row.push(f);R.push(row);}return R;}
async function loadFromSheet(){var res=await fetch(SHEET_URL,{cache:'no-store'});if(!res.ok)throw new Error('sheet '+res.status);var rows=__parseCSV(await res.text());var M={};for(var j=0;j<rows.length;j++){var r=rows[j];if(!r||r.length<2)continue;var k=(r[0]||'').trim();if(!k||k=='clave')continue;try{M[k]=JSON.parse(r[1]);}catch(e){}}
  for(var kk in SQL){if(M[kk]!==undefined)__STATIC_DATA.pg[kk]=M[kk];}
  if(M.timing)TIMING=M.timing;
  var B=__STATIC_DATA.brevo;if(M.brevo){if(M.brevo.senders)B['senders_get_senders']=M.brevo.senders;if(M.brevo.lists)B['lists_get_lists']=M.brevo.lists;if(M.brevo.segments)B['segments_get_segments']=M.brevo.segments;if(M.brevo.templatesCount!=null)B['templates_get_smtp_templates']={count:M.brevo.templatesCount};}
  if(M.brevo&&M.brevo.campaigns)B['email_campaign_management_get_email_campaigns']=M.brevo.campaigns;
  window.__WA={kpi:M.waKpi||null,trend:M.waTrend||[],agent:M.waAgent||[],labels:M.waLabels||[],detail:M.waDetail||[]};
  window.__ML={kpi:M.mlKpi||[],flows:M.mlFlows||[]};
  if(M.generado){try{var u=document.getElementById('upd');if(u)u.textContent='Datos al '+M.generado+' · en vivo desde Google Sheet';}catch(e){}}
}
