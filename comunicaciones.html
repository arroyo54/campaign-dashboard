u — impuestos sin estrés\" width=\"75\" />\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Hero Greeting -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" align=\"left\" style=\"padding: 45px 40px 10px 40px;\">\n              \u003ch1 class=\"font-lexend hero-title\" style=\"margin: 0; font-size: 26px; font-weight: 700; color: #0f172a; line-height: 1.2;\">\n                Estás a la mitad del camino, {{ params.FIRST_NAME }} 🎯\n              \u003c/h1>\n              \u003cp style=\"margin-top: 15px; font-size: 14px; line-height: 1.6; color: #475569;\">\n                Este es uno de los descuentos más altos que ofrecemos. Si has estado posponiendo tus pendientes fiscales, este es un buen momento para resolverlos:\n              \u003c/p>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Discount Card -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" style=\"padding: 10px 40px 30px 40px;\">\n              \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #fefce8; border: 1.5px solid #fef9c3; border-radius: 24px; text-align: center; padding: 35px 30px;\">\n                \u003ctr>\n                  \u003ctd>\n                    \u003ctable align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #ffffff; border-radius: 8px; padding: 4px 12px; margin-bottom: 12px;\">\n                      \u003ctr>\n                        \u003ctd class=\"font-lexend\" style=\"font-size: 10px; font-weight: 700; color: #ca8a04; text-transform: uppercase; letter-spacing: 1.5px;\">\n                          Beneficio Exclusivo ✨\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table>\n                    \u003ch2 class=\"font-lexend discount-text\" style=\"margin: 0; font-size: 32px; color: #854d0e; line-height: 1.2; font-weight: 700;\">\n                      50% OFF\n                    \u003c/h2>\n                  \u003c/td>\n                \u003c/tr>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Instruction Text -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" align=\"left\" style=\"padding: 0 40px 30px 40px;\">\n              \u003cp style=\"margin-bottom: 25px; font-size: 14px; line-height: 1.6; color: #475569;\">\n                Este cupón es válido para el servicio que tú elijas: desde tu \u003cstrong>Declaración Anual\u003c/strong>, \u003cstrong>declaración mensual\u003c/strong>, hasta \u003cstrong>regularizar meses anteriores\u003c/strong>. Solo aplica el código al momento de tu compra:\n              \u003c/p>\n\n              \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                \u003ctr>\n                  \u003ctd class=\"plan-cell\" width=\"31%\" align=\"center\" style=\"background-color: #ffffff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);\">\n                    \u003cdiv style=\"font-size: 20px; margin-bottom: 5px;\">📅\u003c/div>\n                    \u003cp class=\"font-lexend\" style=\"margin: 0; font-size: 10px; font-weight: 700; color: #1e293b; text-transform: uppercase;\">Anual\u003c/p>\n                  \u003c/td>\n                  \u003ctd width=\"3%\">&nbsp;\u003c/td>\n                  \u003ctd class=\"plan-cell\" width=\"31%\" align=\"center\" style=\"background-color: #ffffff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);\">\n                    \u003cdiv style=\"font-size: 20px; margin-bottom: 5px;\">✅\u003c/div>\n                    \u003cp class=\"font-lexend\" style=\"margin: 0; font-size: 10px; font-weight: 700; color: #1e293b; text-transform: uppercase;\">Mensual\u003c/p>\n                  \u003c/td>\n                  \u003ctd width=\"3%\">&nbsp;\u003c/td>\n                  \u003ctd class=\"plan-cell\" width=\"31%\" align=\"center\" style=\"background-color: #ffffff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);\">\n                    \u003cdiv style=\"font-size: 20px; margin-bottom: 5px;\">🔴\u003c/div>\n                    \u003cp class=\"font-lexend\" style=\"margin: 0; font-size: 10px; font-weight: 700; color: #1e293b; text-transform: uppercase;\">Pendientes\u003c/p>\n                  \u003c/td>\n                \u003c/tr>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Coupon & CTA Section -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" align=\"center\" style=\"padding: 0 40px 40px 40px;\">\n\n              \u003c!-- Ticket-Style Coupon Block -->\n              \u003ctable class=\"coupon-table\" width=\"75%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #f0f9ff; border: 2px dashed #0091ff; border-radius: 16px; margin-bottom: 35px;\">\n                \u003ctr>\n                  \u003ctd align=\"center\" style=\"padding: 35px 20px;\">\n                    \u003cp class=\"font-lexend\" style=\"margin: 0 0 15px 0; font-size: 11px; letter-spacing: 2.5px; font-weight: 700; color: #0076cf; text-transform: uppercase; line-height: 1;\">\n                      Cupón:\n                    \u003c/p>\n\n                    \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\">\n                      \u003ctr>\n                        \u003ctd style=\"padding-right: 12px; vertical-align: middle;\">\n                          \u003cimg src=\"https://img.icons8.com/ios-filled/24/0091ff/ticket.png\" width=\"22\" alt=\"\" style=\"display: block;\" />\n                        \u003c/td>\n                        \u003ctd style=\"vertical-align: middle;\">\n                          \u003ch2 class=\"font-lexend coupon-text\" style=\"margin: 0; font-size: 32px; color: #1e293b; letter-spacing: 5px; font-weight: 700; line-height: 1;\">\n                            VUELVE50\n                          \u003c/h2>\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table>\n                  \u003c/td>\n                \u003c/tr>\n              \u003c/table>\n\n              \u003c!-- Main Button -->\n              \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                \u003ctr>\n                  \u003ctd align=\"center\">\n                    \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"box-shadow: 0 10px 15px -3px rgba(0, 145, 255, 0.25);\">\n                      \u003ctr>\n                        \u003ctd align=\"center\" style=\"border-radius: 12px; background-color: #0091ff;\">\n                          \u003ca href=\"https://web.heru.app/plans\" target=\"_blank\" style=\"display: inline-block; padding: 22px 45px; font-size: 15px; font-weight: 700; color: #ffffff; text-decoration: none; font-family: 'Lexend', sans-serif; letter-spacing: 0.5px;\">\n                            APLICAR MI CUPÓN AQUÍ\n                          \u003c/a>\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table>\n                  \u003c/td>\n                \u003c/tr>\n              \u003c/table>\n\n              \u003c!-- Urgency Text -->\n              \u003cp style=\"margin-top: 30px; font-size: 13px; color: #475569; line-height: 1.5; text-align: center;\">\n                ⏰ Tu cupón \u003cstrong>VUELVE50\u003c/strong> vence pronto. Si no lo usas, ya no podrás recuperarlo.\n              \u003c/p>\n\n              \u003cp style=\"margin-top: 25px; font-size: 12px; color: #94a3b8; line-height: 1.5; text-align: center;\">\n                Mitad del camino significa que aún estás a tiempo. Aprovecha hoy.\n              \u003c/p>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Footer -->\n          \u003ctr>\n            \u003ctd align=\"center\" style=\"padding: 40px; background-color: #fcfdfe; border-top: 1px solid #f1f5f9;\">\n              \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\">\n                \u003ctr>\n                  \u003ctd style=\"padding: 0 10px;\">\u003ca href=\"https://facebook.com/heru\" target=\"_blank\">\u003cimg src=\"https://img.icons8.com/material-rounded/24/94a3b8/facebook-new.png\" width=\"18\" alt=\"Facebook\">\u003c/a>\u003c/td>\n                  \u003ctd style=\"padding: 0 10px;\">\u003ca href=\"https://instagram.com/heru\" target=\"_blank\">\u003cimg src=\"https://img.icons8.com/material-rounded/24/94a3b8/instagram-new.png\" width=\"18\" alt=\"Instagram\">\u003c/a>\u003c/td>\n                  \u003ctd style=\"padding: 0 10px;\">\u003ca href=\"https://linkedin.com/company/heru\" target=\"_blank\">\u003cimg src=\"https://img.icons8.com/material-rounded/24/94a3b8/linkedin.png\" width=\"18\" alt=\"LinkedIn\">\u003c/a>\u003c/td>\n                \u003c/tr>\n              \u003c/table>\n              \u003cp style=\"margin: 20px 0 0 0; font-size: 11px; font-weight: 700; color: #94a3b8; font-family: 'Lexend', sans-serif; text-transform: uppercase; letter-spacing: 1px;\">Equipo heru\u003c/p>\n              \u003cp style=\"margin: 4px 0 0 0; font-size: 11px; color: #cbd5e1;\">Impuestos sin estrés\u003c/p>\n              \u003cp style=\"margin: 16px 0 0 0; font-size: 10px; color: #cbd5e1;\">\n                ¿Ya no quieres recibir estos correos? \u003ca href=\"{{ unsubscribe }}\" style=\"color: #94a3b8; text-decoration: underline;\">Date de baja aquí\u003c/a>\n              \u003c/p>\n            \u003c/td>\n          \u003c/tr>\n        \u003c/table>\n      \u003c/td>\n    \u003c/tr>\n  \u003c/table>\n\u003c/body>\n\u003c/html>\n"}, "1265": {"name": "01_educativo_empresarial", "subject": "Solo 2. Ni una más. ⚖️", "htmlContent": "\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003cmeta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  \u003ctitle>Tu mensual son 2 obligaciones - Heru\u003c/title>\n  \u003c!--[if mso]>\n  \u003cstyle type=\"text/css\">\n    body, table, td, a, span, p { font-family: Arial, sans-serif !important; }\n  \u003c/style>\n  \u003c![endif]-->\n  \u003cstyle>\n    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght=400;500;700;800&display=swap');\n\n    body, table, td, a {\n      -webkit-text-size-adjust: 100%;\n      -ms-text-size-adjust: 100%;\n    }\n\n    table, td {\n      mso-table-lspace: 0pt;\n      mso-table-rspace: 0pt;\n      border-collapse: collapse !important;\n    }\n\n    img {\n      -ms-interpolation-mode: bicubic;\n      border: 0;\n      height: auto;\n      line-height: 100%;\n      outline: none;\n      text-decoration: none;\n      display: block;\n    }\n\n    body {\n      height: 100% !important;\n      margin: 0 !important;\n      padding: 0 !important;\n      width: 100% !important;\n      background-color: #f4f7f9;\n      font-family: 'DM Sans', Helvetica, Arial, sans-serif;\n      color: #1e293b;\n    }\n\n    .main-table {\n      width: 100%;\n      max-width: 600px;\n      margin: 20px auto;\n      background-color: #ffffff;\n      border-radius: 4px;\n      overflow: hidden;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS (Paddings compactos de cabecera)\n       ========================================================================= */\n    .banner {\n      background-color: #003366;\n      padding: 10px 40px;\n    }\n\n    .chapter {\n      padding: 14px 40px 0 40px;\n      background-color: #ffffff;\n    }\n\n    .hero {\n      padding: 8px 40px 16px 40px;\n      background-color: #ffffff;\n      border-bottom: 1px solid #e2e8f0;\n    }\n\n    .content {\n      padding: 24px 40px;\n    }\n\n    /* Estilo premium de tarjetas con bordes limpios */\n    .step-card {\n      border-left: 3px solid #0091ff;\n      background-color: #ffffff;\n      border-top: 1px solid #f1f5f9;\n      border-right: 1px solid #f1f5f9;\n      border-bottom: 1px solid #f1f5f9;\n      border-radius: 0 8px 8px 0;\n      padding: 16px;\n      margin-bottom: 16px;\n    }\n\n    .deadline-banner {\n      background-color: #fff7ed;\n      border: 1px solid #fed7aa;\n      border-radius: 8px;\n      padding: 14px 16px;\n      margin: 20px 0;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS PARA MÓVIL\n       ========================================================================= */\n    @media screen and (max-width: 600px) {\n      .content, .hero, .chapter, .banner { \n        padding-left: 20px !important; \n        padding-right: 20px !important; \n      }\n      .main-table { \n        margin: 0 auto !important; \n        border-radius: 0 !important; \n      }\n    }\n  \u003c/style>\n\u003c/head>\n\n\u003cbody>\n  \u003cdiv style=\"background-color: #f4f7f9; padding: 10px 0;\">\n    \u003ctable class=\"main-table\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n      \n      \u003c!-- Banner azul marino -->\n      \u003ctr>\n        \u003ctd class=\"banner\">\n          \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            \u003ctr>\n              \u003ctd align=\"left\">\n                \u003cimg src=\"https://img.mailinblue.com/2760736/images/content_library/original/6a0e028c17d8dcd74a550ebc.jpg\" alt=\"heru\" width=\"70\" style=\"display: block;\">\n              \u003c/td>\n              \u003ctd align=\"right\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; color: #94a3b8;\">3 min de lectura\u003c/td>\n            \u003c/tr>\n          \u003c/table>\n        \u003c/td>\n      \u003c/tr>\n\n      \u003c!-- Chapter number + tag -->\n      \u003ctr>\n        \u003ctd class=\"chapter\">\n          \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            \u003ctr>\n              \u003ctd valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 44px; font-weight: 800; color: #0091ff; line-height: 1; padding-right: 14px;\">01\u003c/td>\n              \u003ctd valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #003366; padding-bottom: 4px;\">EDUCATIVO\u003c/td>\n            \u003c/tr>\n          \u003c/table>\n        \u003c/td>\n      \u003c/tr>\n\n      \u003c!-- Hero (título + subtítulo) -->\n      \u003ctr>\n        \u003ctd class=\"hero\">\n          \u003ch1 style=\"margin: 6px 0 0 0; font-size: 25px; line-height: 1.25; font-weight: 700; font-family: 'DM Sans', sans-serif; color: #003366;\">\n            Tu mensual son 2 obligaciones\n          \u003c/h1>\n          \u003cp style=\"margin: 8px 0 0 0; font-size: 15px; color: #475569; line-height: 1.45; font-family: 'DM Sans', sans-serif;\">\n            ISR e IVA. Sí, son dos. heru hace ambas de forma automática con tus CFDI.\n          \u003c/p>\n        \u003c/td>\n      \u003c/tr>\n\n      \u003c!-- Body Content -->\n      \u003ctr>\n        \u003ctd class=\"content\">\n\n          \u003c!-- Saludo Dinámico Adaptable -->\n          \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin: 0 0 12px 0;\">\n            \u003ctr>\n              \u003ctd style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 4px;\">Hola\u003c/td>\n              \u003ctd style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 1px;\">{{ params.first_name|default:\"👋🏼\" }}\u003c/td>\n              \u003ctd style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap;\">,\u003c/td>\n            \u003c/tr>\n          \u003c/table>\n\n          \u003cp style=\"color: #475569; font-size: 15px; margin: 0 0 20px 0; line-height: 1.6; font-family: 'DM Sans', sans-serif;\">\n            En el régimen de Actividad Empresarial, lo que comúnmente conocemos como \u003cem>\"tu declaración mensual\"\u003c/em> en realidad está compuesto por \u003cstrong style=\"color: #003366;\">dos obligaciones físcales distintas\u003c/strong> que deben presentarse juntas. Te las explicamos de forma muy sencilla:\n          \u003c/p>\n\n          \u003c!-- Card 1: ISR -->\n          \u003cdiv class=\"step-card\">\n            \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              \u003ctr>\n                \u003ctd style=\"font-family: 'DM Sans', sans-serif;\">\n                  \u003cdiv style=\"font-size: 14px; font-weight: 700; color: #003366; margin-bottom: 4px;\">\n                    1. ISR Provisional \u003cspan style=\"white-space: nowrap; display: inline-block;\">💰\u003c/span>\n                  \u003c/div>\n                  \u003cdiv style=\"font-size: 13px; color: #475569; line-height: 1.5;\">\n                    El impuesto sobre la renta del mes, calculado de forma \u003cstrong style=\"color: #003366;\">acumulada\u003c/strong> con lo que llevas en el año. Por eso un mes extraordinariamente bueno puede subir tu tasa temporalmente: el SAT revisa el acumulado anual, no solo el mes en curso.\n                  \u003c/div>\n                \u003c/td>\n              \u003c/tr>\n            \u003c/table>\n          \u003c/div>\n\n          \u003c!-- Card 2: IVA -->\n          \u003cdiv class=\"step-card\">\n            \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              \u003ctr>\n                \u003ctd style=\"font-family: 'DM Sans', sans-serif;\">\n                  \u003cdiv style=\"font-size: 14px; font-weight: 700; color: #003366; margin-bottom: 4px;\">\n                    2. IVA Mensual \u003cspan style=\"white-space: nowrap; display: inline-block;\">🧾\u003c/span>\n                  \u003c/div>\n                  \u003cdiv style=\"font-size: 13px; color: #475569; line-height: 1.5;\">\n                    La diferencia entre el IVA que les cobraste a tus clientes y el IVA que pagaste en tus gastos de trabajo (deducibles). Si cobraste más de lo que gastaste, se paga la diferencia; de lo contrario, generas un saldo a favor.\n                  \u003c/div>\n                \u003c/td>\n              \u003c/tr>\n            \u003c/table>\n          \u003c/div>\n\n          \u003c!-- Lo que hace Heru -->\n          \u003cdiv class=\"deadline-banner\">\n            \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              \u003ctr>\n                \u003ctd style=\"font-family: 'DM Sans', sans-serif;\">\n                  \u003cp style=\"margin: 0; font-size: 13.5px; color: #9a3412; line-height: 1.55;\">\n                    \u003cstrong>¿Cómo te ayuda heru?\u003c/strong> Olvídate de subir facturas de forma manual. Al conectar tu cuenta del SAT, nosotros las descargamos automáticamente, calculamos tus impuestos y presentamos tus 2 obligaciones por ti.\n                  \u003c/p>\n                \u003c/td>\n              \u003c/tr>\n            \u003c/table>\n          \u003c/div>\n\n          \u003c!-- Footer Final (Sin caja de blog, con el enlace corto de soporte en su lugar) -->\n          \u003cdiv style=\"text-align: center; margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 24px;\">\n            \u003cp style=\"margin: 0 0 16px 0; font-size: 12px; color: #94a3b8; line-height: 1.5; font-family: 'DM Sans', sans-serif;\">\n              ¿Quieres saber más? \u003ca href=\"https://www.heru.app/blog/impuestos-actividad-empresarial/\" style=\"color: #0091ff; text-decoration: none; font-weight: 700;\">Guía de tus obligaciones →\u003c/a>\n            \u003c/p>\n\n            \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\" style=\"margin: 0 auto;\">\n              \u003ctr>\n                \u003ctd style=\"padding: 0 8px;\">\n                  \u003ca href=\"https://instagram.com/somosheru\" target=\"_blank\">\n                    \u003cimg src=\"https://cdn-icons-png.flaticon.com/512/174/174855.png\" alt=\"Instagram\" width=\"22\" height=\"22\">\n                  \u003c/a>\n                \u003c/td>\n                \u003ctd style=\"padding: 0 8px;\">\n                  \u003ca href=\"https://www.facebook.com/somosheru\" target=\"_blank\">\n                    \u003cimg src=\"https://cdn-icons-png.flaticon.com/512/124/124010.png\" alt=\"Facebook\" width=\"22\" height=\"22\">\n                  \u003c/a>\n                \u003c/td>\n                \u003ctd style=\"padding: 0 8px;\">\n                  \u003ca href=\"https://www.linkedin.com/company/somosheru/\" target=\"_blank\">\n                    \u003cimg src=\"https://cdn-icons-png.flaticon.com/512/174/174857.png\" alt=\"LinkedIn\" width=\"22\" height=\"22\">\n                  \u003c/a>\n                \u003c/td>\n                \u003ctd style=\"padding: 0 8px;\">\n                  \u003ca href=\"https://heru.trb.ai/wa/3Sha3Zw\" target=\"_blank\">\n                    \u003cimg src=\"https://cdn-icons-png.flaticon.com/512/733/733585.png\" alt=\"WhatsApp\" width=\"22\" height=\"22\">\n                  \u003c/a>\n                \u003c/td>\n              \u003c/tr>\n            \u003c/table>\n          \u003c/div>\n        \u003c/td>\n      \u003c/tr>\n    \u003c/table>\n  \u003c/div>\n\u003c/body>\n\n\u003c/html>"}, "1160": {"name": "CSAT anual presentada", "subject": "Oficialmente libre de la Anual 2025 😮‍💨", "htmlContent": "\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003cmeta http-equiv=\"X-UA-Co     \u003ctr>\n      \u003ctd align=\"center\" style=\"padding: 20px 10px;\">\n        \n        \u003c!-- INICIO TARJETA PRINCIPAL -->\n        \u003ctable cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" width=\"100%\" style=\"max-width: 600px; background-color: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);\">\n          \n          \u003c!-- Header -->\n          \u003ctr>\n            \u003ctd class=\"header-pad\" style=\"padding: 24px 40px; background-color: #ffffff; border-bottom: 1px solid #f1f5f9;\">\n              \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                \u003ctr>\n                  \u003ctd align=\"left\" valign=\"middle\">\n                    \u003cimg src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru.\" width=\"75\" style=\"display: block; font-family: 'DM Sans', Arial, sans-serif; color: #003366; font-weight: bold;\">\n                  \u003c/td>\n                  \u003ctd align=\"right\" valign=\"middle\" class=\"slogan\" style=\"font-size: 12px; color: #94a3b8; font-weight: 500; font-family: 'DM Sans', Arial, sans-serif; letter-spacing: 0.3px;\">\n                    Tu declaración, sin complicaciones\n                  \u003c/td>\n                \u003c/tr>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Hero Section -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" align=\"center\" style=\"background-color: #003366; padding: 45px 40px;\">\n              \u003cp style=\"margin: 0 0 12px 0; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; font-weight: 700; color: #94a3b8; font-family: 'DM Sans', Arial, sans-serif;\">\n                Tranquilidad desbloqueada 🔓\n              \u003c/p>\n              \u003ch1 class=\"hero-title\" style=\"margin: 0; font-size: 28px; line-height: 1.3; font-weight: 700; color: #ffffff; font-family: 'DM Sans', Arial, sans-serif;\">\n                ¡Un pendiente menos{% if params.name %}, {{ params.name }}{% endif %}! ✨\n              \u003c/h1>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Body Content -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad body-content-pad\" align=\"center\" style=\"padding: 45px 40px 45px 40px; background-color: #ffffff;\">\n              \n              \u003cp style=\"margin: 0 0 10px 0; color: #94a3b8; font-size: 16px; line-height: 1.6; text-align: center; font-family: 'DM Sans', Arial, sans-serif;\">\n                Tu declaración anual de \u003cstrong>{{ params.anual_en_curso }}\u003c/strong> ha sido presentada con éxito.\n              \u003c/p>\n              \n              \u003cp style=\"margin: 0 0 35px 0; color: #94a3b8; font-size: 16px; line-height: 1.6; text-align: center; font-family: 'DM Sans', Arial, sans-serif;\">\n                Para nosotros es fundamental seguir mejorando. Considerando todo el proceso:\n              \u003c/p>\n\n              \u003c!-- Pregunta Principal -->\n              \u003ch2 style=\"margin: 0 0 25px 0; font-weight: 700; color: #0f172a; font-size: 20px; line-height: 1.4; text-align: center; font-family: 'DM Sans', Arial, sans-serif;\">\n                ¿Cómo calificarías la calidad de nuestro servicio?\n              \u003c/h2>\n\n              \u003c!-- ESCALA NPS -->\n              \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"max-width: 420px; margin: 0 auto; table-layout: fixed;\">\n                \u003ctr>\n                  \u003c!-- Botón 1 -->\n                  \u003ctd align=\"center\" width=\"20%\">\n                    \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                      \u003ctr>\n                        \u003ctd class=\"btn-circle\" align=\"center\" valign=\"middle\" width=\"48\" height=\"48\" style=\"background-color: #f1f5f9; border-radius: 12px;\">\n                          \u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=1&declaration_period={{params.anual_en_curso}}\" class=\"btn-link\" style=\"display: block; width: 100%; line-height: 48px; color: #475569; font-weight: 700; font-size: 18px; text-decoration: none; font-family: 'DM Sans', Arial, sans-serif;\">1\u003c/a>\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table>\n                  \u003c/td>\n                  \u003c!-- Botón 2 -->\n                  \u003ctd align=\"center\" width=\"20%\">\n                    \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                      \u003ctr>\n                        \u003ctd class=\"btn-circle\" align=\"center\" valign=\"middle\" width=\"48\" height=\"48\" style=\"background-color: #f1f5f9; border-radius: 12px;\">\n                          \u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=2&declaration_period={{params.anual_en_curso}}\" class=\"btn-link\" style=\"display: block; width: 100%; line-height: 48px; color: #475569; font-weight: 700; font-size: 18px; text-decoration: none; font-family: 'DM Sans', Arial, sans-serif;\">2\u003c/a>\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table>\n                  \u003c/td>\n                  \u003c!-- Botón 3 -->\n                  \u003ctd align=\"center\" width=\"20%\">\n                    \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                      \u003ctr>\n                        \u003ctd class=\"btn-circle\" align=\"center\" valign=\"middle\" width=\"48\" height=\"48\" style=\"background-color: #e0f2fe; border-radius: 12px;\">\n                          \u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=3&declaration_period={{params.anual_en_curso}}\" class=\"btn-link\" style=\"display: block; width: 100%; line-height: 48px; color: #0284c7; font-weight: 700; font-size: 18px; text-decoration: none; font-family: 'DM Sans', Arial, sans-serif;\">3\u003c/a>\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table>\n                  \u003c/td>\n                  \u003c!-- Botón 4 -->\n                  \u003ctd align=\"center\" width=\"20%\">\n                    \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                      \u003ctr>\n                        \u003ctd class=\"btn-circle\" align=\"center\" valign=\"middle\" width=\"48\" height=\"48\" style=\"background-color: #0091ff; border-radius: 12px;\">\n                          \u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=4&declaration_period={{params.anual_en_curso}}\" class=\"btn-link\" style=\"display: block; width: 100%; line-height: 48px; color: #ffffff; font-weight: 700; font-size: 18px; text-decoration: none; font-family: 'DM Sans', Arial, sans-serif;\">4\u003c/a>\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table>\n                  \u003c/td>\n                  \u003c!-- Botón 5 -->\n                  \u003ctd align=\"center\" width=\"20%\">\n                    \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                      \u003ctr>\n                        \u003ctd class=\"btn-circle\" align=\"center\" valign=\"middle\" width=\"48\" height=\"48\" style=\"background-color: #0091ff; border-radius: 12px;\">\n                          \u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=5&declaration_period={{params.anual_en_curso}}\" class=\"btn-link\" style=\"display: block; width: 100%; line-height: 48px; color: #ffffff; font-weight: 700; font-size: 18px; text-decoration: none; font-family: 'DM Sans', Arial, sans-serif;\">5\u003c/a>\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table>\n                  \u003c/td>\n                \u003c/tr>\n                \u003c!-- Etiquetas -->\n                \u003ctr>\n                  \u003ctd align=\"center\" valign=\"top\" style=\"padding-top: 10px; color: #94a3b8; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'DM Sans', Arial, sans-serif;\">\n                    Mala\n                  \u003c/td>\n                  \u003ctd colspan=\"3\">\u003c/td>\n                  \u003ctd align=\"center\" valign=\"top\" style=\"padding-top: 10px; color: #94a3b8; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'DM Sans', Arial, sans-serif;\">\n                    Excelente\n                  \u003c/td>\n                \u003c/tr>\n              \u003c/table>\n\n              \u003cp style=\"margin: 35px 0 0 0; color: #94a3b8; font-size: 13px; font-weight: 400; text-align: center; font-family: 'DM Sans', Arial, sans-serif;\">\n                ¡Gracias por ayudarnos a construir una experiencia fiscal libre de estrés!\n              \u003c/p>\n\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Footer Secundario -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" align=\"center\" style=\"padding: 35px 40px; background-color: #f8fafc; border-top: 1px solid #e2e8f0;\">\n              \n              \u003c!-- Redes Sociales -->\n              \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 20px;\">\n                \u003ctr>\n                  \u003ctd align=\"center\" style=\"padding: 0 8px;\">\n                    \u003ca href=\"https://heru.trb.ai/wa/1Z7hPy\" target=\"_blank\" style=\"display: block;\">\u003cimg src=\"https://img.icons8.com/fluency/48/whatsapp.png\" width=\"28\" alt=\"WhatsApp\" style=\"display: block; border: 0;\">\u003c/a>\n                  \u003c/td>\n                  \u003ctd align=\"center\" style=\"padding: 0 8px;\">\n                    \u003ca href=\"https://instagram.com/somosheru\" target=\"_blank\" style=\"display: block;\">\u003cimg src=\"https://img.icons8.com/fluency/48/instagram-new.png\" width=\"28\" alt=\"Instagram\" style=\"display: block; border: 0;\">\u003c/a>\n                  \u003c/td>\n                  \u003ctd align=\"center\" style=\"padding: 0 8px;\">\n                    \u003ca href=\"https://www.facebook.com/somosheru\" target=\"_blank\" style=\"display: block;\">\u003cimg src=\"https://img.icons8.com/fluency/48/facebook-new.png\" width=\"28\" alt=\"Facebook\" style=\"display: block; border: 0;\">\u003c/a>\n                  \u003c/td>\n                  \u003ctd align=\"center\" style=\"padding: 0 8px;\">\n                    \u003ca href=\"https://www.linkedin.com/company/somosheru/\" target=\"_blank\" style=\"display: block;\">\u003cimg src=\"https://img.icons8.com/fluency/48/linkedin.png\" width=\"28\" alt=\"LinkedIn\" style=\"display: block; border: 0;\">\u003c/a>\n                  \u003c/td>\n                \u003c/tr>\n              \u003c/table>\n\n              \u003cp style=\"margin: 0 0 4px 0; font-weight: 800; color: #1e293b; font-size: 16px; font-family: 'DM Sans', Arial, sans-serif;\">heru\u003c/p>\n              \u003cp style=\"margin: 0 0 20px 0; color: #64748b; font-size: 14px; font-weight: 500; font-family: 'DM Sans', Arial, sans-serif;\">Impuestos sin estrés\u003c/p>\n              \n              \u003cp style=\"margin: 0; color: #94a3b8; font-size: 11px; line-height: 1.5; font-family: 'DM Sans', Arial, sans-serif;\">\n                Este correo es una confirmación automática generada por heru.\u003cbr>No responder a este mensaje.\n              \u003c/p>\n            \u003c/td>\n          \u003c/tr>\n\n        \u003c/table>\n\n      \u003c/td>\n    \u003c/tr>\n  \u003c/table>\n\n\u003c/body>\n\u003c/html>"}, "1249": {"name": "P1 — Preparando", "subject": "Ya arrancamos con tu declaración de {{ params.mes_declaracion }} 🚀", "htmlContent": "\u003c!doctype html>\n\u003chtml lang=\"es\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:v=\"urn:schemas-microsoft-com:vml\">\n\u003chead>\n  \u003ctitle>Ya arrancamos con tu declaración\u003c/title>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\" />\n  \u003cmeta name=\"x-apple-disable-message-reformatting\" />\n  \u003cstyle type=\"text/css\">\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: 'Helvetica', Arial, sans-serif; }\n    @media only screen and (max-width: 480px) {\n      .container { width: 100% !important; }\n      .content-padding { padding-left: 15px !important; padding-right: 15px !important; }\n      .logo-cell { font-size: 32px !important; }\n      .cta-btn { padding: 12px 20px !important; font-size: 14px !important; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody style=\"font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; background-color: #f4f7f9; margin: 0; padding: 0;\">\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"background-color: #f4f7f9; border-collapse: collapse;\" width=\"100%\">\n  \u003ctbody>\n    \u003ctr>\n      \u003ctd align=\"center\" style=\"padding: 10px 0;\">\n      \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"container\" role=\"presentation\" style=\"background-color: #ffffff; border-radius: 8px; overflow: hidden; width: 550px; margin: 0 auto; border-collapse: collapse;\" width=\"550\">\n        \u003ctbody>\n\n          \u003c!-- HEADER: Logo -->\n          \u003ctr>\n            \u003ctd style=\"padding: 10px 25px; background-color: #ffffff;\">\n            \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n              \u003ctbody>\n                \u003ctr>\n                  \u003ctd align=\"left\" class=\"logo-cell\" style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 34px; font-weight: bold; color: #518dec; line-height: 1; letter-spacing: -1.5px; padding: 0;\" valign=\"middle\">heru\u003c/td>\n                \u003c/tr>\n              \u003c/tbody>\n            \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- HERO -->\n          \u003ctr>\n            \u003ctd style=\"background-color: #1a3a5a; padding: 32px 25px 28px 25px;\">\n              \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                \u003ctbody>\n                  \u003ctr>\n                    \u003ctd style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 22px; font-weight: bold; color: #ffffff; line-height: 1.3;\">\n                      ¡Ya arrancamos con tu declaración! 🚀\n                    \u003c/td>\n                  \u003c/tr>\n                  \u003ctr>\n                    \u003ctd style=\"padding-top: 10px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #ffffff; line-height: 1.5;\">\n                      Declaración de \u003cstrong>{{ params.mes_declaracion }} {{ params.anio_declaracion }}\u003c/strong> en proceso.\n                    \u003c/td>\n                  \u003c/tr>\n                \u003c/tbody>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- BODY -->\n          \u003ctr>\n            \u003ctd class=\"content-padding\" style=\"padding: 28px 25px;\">\n              \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                \u003ctbody>\n                  \u003ctr>\n                    \u003ctd style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      Hola \u003cstrong>{{ params.name }}\u003c/strong> 👋\n                    \u003c/td>\n                  \u003c/tr>\n                  \u003ctr>\n                    \u003ctd style=\"padding-top: 14px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      ¡Buenas noticias! Ya arrancamos con tu declaración de \u003cstrong>{{ params.mes_declaracion }} {{ params.anio_declaracion }}\u003c/strong>. Estamos preparando toda tu información fiscal para tenerla lista.\n                    \u003c/td>\n                  \u003c/tr>\n                  \u003ctr>\n                    \u003ctd style=\"padding-top: 14px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      No tienes que hacer nada. Nosotros nos encargamos de todo el proceso. Te avisamos en cuanto tengamos novedades. 💪\n                    \u003c/td>\n                  \u003c/tr>\n\n                  \u003c!-- Bloque de estado -->\n                  \u003ctr>\n                    \u003ctd style=\"padding-top: 24px;\">\n                      \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse; background-color: #f4f7f9; border-radius: 8px; width: 100%;\">\n                        \u003ctbody>\n                          \u003ctr>\n                            \u003ctd style=\"padding: 16px 20px;\">\n                              \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                                \u003ctbody>\n                                  \u003ctr>\n                                    \u003ctd style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #888888; padding-bottom: 4px;\">ESTADO DE TU DECLARACIÓN\u003c/td>\n                                  \u003c/tr>\n                                  \u003ctr>\n                                    \u003ctd style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: bold; color: #518dec;\">⏳ Preparando tu información\u003c/td>\n                                  \u003c/tr>\n                                \u003c/tbody>\n                              \u003c/table>\n                            \u003c/td>\n                          \u003c/tr>\n                        \u003c/tbody>\n                      \u003c/table>\n                    \u003c/td>\n                  \u003c/tr>\n                \u003c/tbody>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- CTA -->\n          \u003ctr>\n            \u003ctd align=\"center\" style=\"padding: 0 25px 28px 25px;\">\n              \u003ca href=\"https://web.heru.app/declarations/\" style=\"background-color: #518dec; color: #ffffff; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: bold; text-decoration: none; padding: 14px 32px; border-radius: 6px; display: inline-block;\">Ingresa a heru\u003c/a>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- FOOTER -->\n          \u003ctr>\n            \u003ctd style=\"background-color: #f4f7f9; padding: 20px 25px; border-top: 1px solid #e8ecf0;\">\n              \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                \u003ctbody>\n                  \u003ctr>\n                    \u003ctd style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #888888; line-height: 1.5;\">\n                      Estamos contigo en cada paso.\u003cbr/>\n                      \u003cstrong style=\"color: #518dec;\">El equipo de heru 💚\u003c/strong>\n                    \u003c/td>\n                  \u003c/tr>\n                \u003c/tbody>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n        \u003c/tbody>\n      \u003c/table>\n      \u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>\n\u003c/body>\n\u003c/html>"}, "1184": {"name": "NPS", "subject": "¿Nos recomendarías? Solo una pregunta 👋", "htmlContent": "\u003c!doctype html>\n\u003chtml lang=\"es\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:v=\"urn:schemas-microsoft-com:vml\">\n\u003chead>\n  \u003ctitle>\u003c/title>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\" />\n  \u003cmeta name=\"x-apple-disable-message-reformatting\" />\n  \u003cstyle type=\"text/css\">\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: 'Helvetica', Arial, sans-serif; }\n    @media only screen and (max-width: 480px) {\n      .container { width: 100% !important; }\n      .content-padding { padding-left: 15px !important; padding-right: 15px !important; }\n      .logo-cell { font-size: 28px !important; }\n      .score-btn { width: 26px !important; height: 26px !important; line-height: 26px !important; font-size: 10px !important; }\n      .score-td { padding: 1px !important; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody style=\"font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; background-color: #f4f7f9; margin: 0; padding: 0;\">\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"background-color: #f4f7f9; border-collapse: collapse;\" width=\"100%\">\n  \u003ctbody>\n    \u003ctr>\n      \u003ctd align=\"center\" s
