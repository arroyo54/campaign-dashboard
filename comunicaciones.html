*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.topbar .title{font-size:18px;font-weight:600;color:var(--ink)}
.topbar .upd{font-size:13px;color:#9599a8}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px 80px}
.ctx{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 6px;font-size:13px;color:var(--muted)}
.ctx b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.ctx .s{color:#d8dae6}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--sep);margin-top:6px}
.tab{display:flex;align-items:center;gap:7px;padding:12px 0;margin-bottom:-1px;font-size:14px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer}
.tab:hover{color:#3f4658}
.tab.active{color:var(--ink);border-bottom-color:var(--brand)}
.tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view{display:none}.view.active{display:block}
.section{margin:40px 0}
.section:first-child{margin-top:28px}
.section h2{font-size:15px;font-weight:600;margin:0 0 3px;line-height:1.3}
.section .sub{font-size:13px;color:var(--muted2);margin:0 0 16px;max-width:680px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9599a8;font-weight:600;margin:36px 0 4px}
.eyebrow.first{margin-top:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.02);padding:24px}
.note{font-size:12px;color:var(--meta);margin-top:12px;max-width:720px}
.chart-box{position:relative;height:300px}.chart-box.sm{height:260px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:820px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:12px;color:var(--muted2);display:flex;align-items:center;gap:7px;margin-bottom:9px}
.kpi .v{font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--meta);margin-top:8px}
.kdot,.fdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.linklike{font-size:12px;color:var(--muted2);text-decoration:underline;cursor:pointer}
.right{text-align:right;margin-top:10px}
.loading{color:#b0b4c3;font-size:13px;padding:30px;text-align:center}
.err{color:#b42318;font-size:13px;background:#fef3f2;border:1px solid #fecdc9;border-radius:10px;padding:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#9599a8;font-weight:600;padding:10px 10px;border-bottom:1px solid var(--sep);position:sticky;top:0;background:#fff}

table.tbl tr:hover td{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:460px;overflow:auto}
.subtabs{display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--sep);margin-bottom:22px}
.subtab{font-size:13px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:9px 0;margin-bottom:-1px;cursor:pointer}
.subtab.active{color:var(--ink);border-bottom-color:var(--brand)}
/* recorrido */
.phase-title{display:flex;align-items:center;gap:10px;margin:34px 0 14px}
.phase-title .fdot{width:10px;height:10px}
.phase-title .ph{font-size:15px;font-weight:600}
.phase-title .pd{font-size:12px;color:var(--muted2)}
.phase-title .pv{margin-left:auto;font-size:12px;color:var(--meta);font-variant-numeric:tabular-nums}
.ftbl td{padding:12px 12px}
.mailrow{cursor:pointer}
.mailrow:hover td{background:#fafbfc}
.mrn{font-weight:600;display:inline-flex;align-items:center;gap:7px}
.mreye{width:14px;height:14px;color:#c7ccd8;fill:none;stroke:currentColor;stroke-width:1.8;flex:0 0 auto}
.mailrow:hover .mreye{color:var(--brand)}
.mrt{display:block;font-size:11px;color:#c0c4d0;margin-top:2px}
.mra{color:#5b6070}
.mrc,.mrch{color:var(--muted2);font-size:12.5px}
.mermaid{text-align:center}
/* modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;align-items:center;justify-content:center;padding:24px;animation:fade .18s ease}
.modal-card{background:#fff;border-radius:16px;width:min(720px,96vw);height:min(86vh,900px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:pop .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--sep)}
.modal-head .ti{font-size:13.5px}
.modal-x{margin-left:auto;background:none;border:none;font-size:20px;line-height:1;color:#b0b4c3;cursor:pointer;padding:2px 6px}
.modal-x:hover{color:#5b6070}
.modal-body{flex:1;overflow:auto;background:#f7f8fa}
</style>
</head>

 100% !important; font-family: 'Helvetica', Arial, sans-serif; }\n    @media only screen and (max-width: 480px) {\n      .container { width: 100% !important; }\n      .content-padding { padding-left: 15px !important; padding-right: 15px !important; }\n      .logo-cell { font-size: 32px !important; }\n      .cta-btn { padding: 12px 20px !important; font-size: 14px !important; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody style=\"font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; background-color: #f4f7f9; margin: 0; padding: 0;\">\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"background-color: #f4f7f9; border-collapse: collapse;\" width=\"100%\">\n  \u003ctbody>\n    \u003ctr>\n      \u003ctd align=\"center\" style=\"padding: 10px 0;\">\n      \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"container\" role=\"presentation\" style=\"background-color: #ffffff; border-radius: 8px; overflow: hidden; width: 550px; margin: 0 auto; border-collapse: collapse;\" width=\"550\">\n        \u003ctbody>\n\n          \u003c!-- HEADER: Logo -->\n          \u003ctr>\n            \u003ctd style=\"padding: 10px 25px; background-color: #ffffff;\">\n            \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n              \u003ctbody>\n                \u003ctr>\n                  \u003ctd align=\"left\" class=\"logo-cell\" style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 34px; font-weight: bold; color: #518dec; line-height: 1; letter-spacing: -1.5px; padding: 0;\" valign=\"middle\">heru\u003c/td>\n                \u003c/tr>\n              \u003c/tbody>\n            \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- HERO: Banner verde -->\n          \u003ctr>\n            \u003ctd style=\"background-color: #1a3a5a; padding: 32px 25px 28px 25px;\">\n              \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                \u003ctbody>\n                  \u003ctr>\n                    \u003ctd style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 22px; font-weight: bold; color: #ffffff; line-height: 1.3;\">\n                      Ya casi te quitamos ese pendiente 📋\n                    \u003c/td>\n                  \u003c/tr>\n                  \u003ctr>\n                    \u003ctd style=\"padding-top: 10px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #ffffff; line-height: 1.5;\">\n                      Tu declaración de \u003cstrong>{{ params.mes_declaracion }} {{ params.anio_declaracion }}\u003c/strong> está lista para arrancar.\n                    \u003c/td>\n                  \u003c/tr>\n                \u003c/tbody>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- BODY -->\n          \u003ctr>\n            \u003ctd class=\"content-padding\" style=\"padding: 28px 25px;\">\n              \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                \u003ctbody>\n                  \u003ctr>\n                    \u003ctd style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      Hola \u003cstrong>{{ params.name }}\u003c/strong> 👋\n                    \u003c/td>\n                  \u003c/tr>\n                  \u003ctr>\n                    \u003ctd style=\"padding-top: 14px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      Estamos listos para trabajar en tu declaración y quitarte ese pendiente de encima. Solo necesitamos un paso de tu parte: conecta tus credenciales del SAT en la app y a partir de ahí \u003cstrong>nos encargamos de todo\u003c/strong>.\n                    \u003c/td>\n                  \u003c/tr>\n                  \u003ctr>\n                    \u003ctd style=\"padding-top: 14px; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;\">\n                      Es rápido, seguro y lo hacemos una sola vez.\n                    \u003c/td>\n                  \u003c/tr>\n\n                  \u003c!-- CTA -->\n                  \u003ctr>\n                    \u003ctd align=\"center\" style=\"padding-top: 28px; padding-bottom: 8px;\">\n                      \u003ca class=\"cta-btn\" href=\"https://web.heru.app/\" style=\"background-color: #518dec; color: #ffffff; font-family: 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: bold; text-decoration: none; padding: 14px 32px; border-radius: 6px; display: inline-block;\">\n                        Conectar mis credenciales\n                      \u003c/a>\n                    \u003c/td>\n                  \u003c/tr>\n                \u003c/tbody>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- FOOTER -->\n          \u003ctr>\n            \u003ctd style=\"background-color: #f4f7f9; padding: 20px 25px; border-top: 1px solid #e8ecf0;\">\n              \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse;\" width=\"100%\">\n                \u003ctbody>\n                  \u003ctr>\n                    \u003ctd style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #888888; line-height: 1.5;\">\n                      Estamos contigo en cada paso.\u003cbr/>\n                      \u003cstrong style=\"color: #518dec;\">El equipo de heru 💚\u003c/strong>\n                    \u003c/td>\n                  \u003c/tr>\n                \u003c/tbody>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n        \u003c/tbody>\n      \u003c/table>\n      \u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>\n\u003c/body>\n\u003c/html>"}, "945": {"name": "CSAT_Declaración_presentada", "subject": "¡Lo lograste! ¿Qué te pareció la experiencia heru?", "htmlContent": "\u003c!DOCTYPE html>\u003chtml lang=\"en\">\u003chead>\u003ctitle>\u003c/title>\u003c/head>\u003cbody aria-disabled=\"false\">\n\n\n\n\n\n\n\u003cp fr-original-style=\"\" style=\"font-size: 16px; font-family: Arial;\">\n\n\u003cmeta charset=\"UTF-8\">\n\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n\u003ctitle>Feedback de tu Declaración\u003c/title>\n\n\u003c/p>\n\n\u003cstyle>\n\n/* Estilos generales del cuerpo del correo */\n\n\nbody {\n\nmargin: 0; padding: 0; background-color: #f7f9fc;/* Un fondo azulado muy claro, como en la web */\n\nfont-family: Arial, sans-serif; -webkit-font-smoothing: antialiased;\n\n}\n\n/* Contenedor principal */\n\n\n.container {\n\nwidth: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px 0;/* Más padding vertical */\n\nborder-radius: 12px;/* Bordes redondeados para el contenedor */\n\noverflow: hidden;/* Para que el footer no se salga de los bordes redondeados */\n\n/* CAMBIO REALIZADO AQUÍ: Se ha añadido text-align: center; */\n\n/* Esto forzará a que todo el contenido de texto dentro del contenedor esté centrado por defecto. */\n\ntext-align: center;\n\n}\n\n/* Estilos de texto inspirados en heru */\n\n\n.header {\n\nfont-size: 26px;/* Un poco más grande */\n\nfont-weight: bold; color: #00A9E0;/* Azul brillante principal de heru */\n\n/* text-align: center; \u003c-- Eliminado ya que el .container se encarga */\n\nmargin-bottom: 10px; padding: 0 20px;\n\n}\n\n\n.subheader {\n\nfont-size: 16px; color: #555555;\n\n/* text-align: center; \u003c-- Eliminado ya que el .container se encarga */\n\nline-height: 1.6;/* Mayor interlineado */\n\nmargin-bottom: 30px; padding: 0 20px;\n\n}\n\n/* Estilos de la escala NPS - Tema heru */\n\n/* CAMBIO REALIZADO AQUÍ: Se ajustó el max-width para la escala de 5 botones */\n\n\n.nps-scale-table {\n\nwidth: 100%; max-width: 350px;/* Reducido de 560px para 5 botones */\n\nmargin: 0 auto 15px auto; border-collapse: separate; border-spacing: 6px;/* Un poco más de espacio entre botones */\n\ntable-layout: fixed;\n\n}\n\n\n.nps-scale-table td {\n\ntext-align: center; font-weight: bold; font-size: 16px; border-radius: 8px;\n\n}\n\n\n.nps-scale-table a {\n\ntext-decoration: none; display: block; padding: 12px 0; border-radius: 8px;\n\n}\n\n/* Nueva paleta de colores para la escala (Ajustada para 1-5) */\n\n/* 1-2 = Detractor */\n\n\n.detractor a {\n\nbackground-color: #E0E0E0; color: #333333;\n\n}\n\n/* Gris claro neutral */\n\n/* 3 = Pasivo */\n\n\n.passive a {\n\nbackground-color: #B3E5FC; color: #0D47A1;\n\n}\n\n/* Azul claro pasivo */\n\n/* 4-5 = Promotor */\n\n\n.promoter a {\n\nbackground-color: #00A9E0; color: #ffffff;\n\n}\n\n/* Azul brillante de heru */\n\n/* Etiquetas debajo de la escala */\n\n/* CAMBIO REALIZADO AQUÍ: Se ajustó el max-width para que coincida con la escala */\n\n\n.labels-table {\n\nwidth: 100%; max-width: 350px;/* Reducido de 560px */\n\nmargin: 0 auto; font-size: 12px; color: #888888;\n\n}\n\n/* CAMBIO REALIZADO AQUÍ: Se fuerza el text-align left/right para anular el centrado del .container */\n\n\n.labels-table .left {\n\ntext-align: left;\n\n}\n\n\n.labels-table .right {\n\ntext-align: right;\n\n}\n\n\n.footer {\n\n/* text-align: center; \u003c-- Eliminado ya que el .container se encarga */\n\nfont-size: 14px; color: #888888;/* Un gris más sutil para el footer */\n\nmargin-top: 30px; padding: 0 20px;\n\n}\n\n\n\n\u003c/style>\n\n\n\n\u003ctable role=\"presentation\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" fr-original-style=\"\" style=\"border: none; border-collapse: collapse; empty-cells: show; max-width: 100%; font-size: 16px; font-family: Arial;\">\u003ctbody>\u003ctr>\u003c!-- CAMBIO REALIZADO AQUÍ: He añadido align=\"center\" para asegurar que el contenedor principal esté siempre centrado -->\n\n\u003ctd style=\"padding: 20px 0px; min-width: 5px; user-select: text; border: 0px solid transparent; background: unset;\" align=\"center\" fr-original-style=\"padding: 20px 0;\">\n\n\u003cdiv fr-original-style=\"\" fr-original-class=\"container\" style=\"font-size: 16px; font-family: Arial; width: 100%; max-width: 600px; margin: 0px auto; background-color: rgb(255, 255, 255); padding: 30px 0px; border-radius: 12px; overflow: hidden; text-align: center;\">\n\n\u003c!-- SECCIÓN DEL LOGO ELIMINADA -->\n\n\n\n\u003cdiv fr-original-style=\"\" fr-original-class=\"header\" style=\"font-size: 26px; font-family: Arial; font-weight: bold; color: rgb(0, 169, 224); margin-bottom: 10px; padding: 0px 20px;\">\n\n\u003cimg src=\"https://img.mailinblue.com/2760736/images/content_library/original/68ddb78fb50f56d8da83d18c.png\" alt=\"Content Library Image\" style=\"width: 226px; display: inline-block; vertical-align: bottom; margin-right: 5px; margin-left: 5px; max-width: calc(100% - 10px); text-align: center; cursor: pointer; padding: 0px 1px; position: relative;\" fr-original-style=\"width: 226px; display: inline-block; vertical-align: bottom; margin-right: 5px; margin-left: 5px; max-width: calc(100% - 10px); text-align: center;\" fr-original-class=\"fr-draggable\">\n\n\u003cbr>\n\n\u003cbr>¡Misión cumplida {{params.nombre}}!\n\n\u003cbr> \u003c/div>\n\n\u003cdiv fr-original-style=\"\" fr-original-class=\"subheader\" style=\"font-size: 16px; font-family: Arial; color: rgb(85, 85, 85); line-height: 1.6; margin-bottom: 30px; padding: 0px 20px;\">\n\nTu declaración de impuestos de {{ params.periodo }} ha sido presentada con éxito.\n\n\u003cbr>Para mejorar tu experiencia futura, nos encantaría que nos calificaras.\n\n\u003c/div>\n\n\n\n\u003c!-- CAMBIO REALIZADO AQUÍ: Pregunta actualizada a \"calidad\" -->\n\n\u003cdiv style=\"font-weight: bold; margin-bottom: 20px; color: rgb(51, 51, 51); font-size: 16px; font-family: Arial; line-height: 1.6; padding: 0px 20px;\" fr-original-style=\"font-weight: bold; margin-bottom: 20px; color: #333;\" fr-original-class=\"subheader\">\n\nConsiderando todo el proceso,\n\n\u003cbr>¿cómo calificarías la calidad de nuestro servicio?\n\n\u003c/div>\n\n\n\n\u003c!-- INICIO DE LA ESCALA NPS INTERACTIVA -->\n\n                    \u003c!-- CAMBIO REALIZADO AQUÍ: Se modificó la tabla para mostrar una escala de 1 a 5 -->\n\n                    \u003ctable role=\"presentation\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" fr-original-style=\"\" fr-original-class=\"nps-scale-table\" style=\"border: none; border-collapse: separate; empty-cells: show; max-width: 350px; font-size: 16px; font-family: Arial; width: 100%; margin: 0px auto 15px; border-spacing: 6px; table-layout: fixed;\">\u003ctbody>\u003ctr>\u003c!-- 1-2 = Detractores -->\n\n                            \u003c!-- CAMBIO REALIZADO AQUÍ: URL del botón actualizada -->\n\n                            \u003ctd fr-original-style=\"\" fr-original-class=\"detractor\" style=\"min-width: 5px; user-select: text; border: 1px solid transparent; text-align: center; font-weight: bold; font-size: 16px; border-radius: 8px; background: unset;\">\u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=1&declaration_period={{params.period_number}}\" fr-original-style=\"\" style=\"user-select: auto; text-decoration: none; display: block; padding: 12px 0px; border-radius: 8px; background-color: rgb(224, 224, 224); color: rgb(51, 51, 51);\">1\u003c/a>\u003c/td>\n\n                            \u003c!-- CAMBIO REALIZADO AQUÍ: URL del botón actualizada -->\n\n                            \u003ctd fr-original-style=\"\" fr-original-class=\"detractor\" style=\"min-width: 5px; user-select: text; border: 1px solid transparent; text-align: center; font-weight: bold; font-size: 16px; border-radius: 8px; background: unset;\">\u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=2&declaration_period={{params.period_number}}\" fr-original-style=\"\" style=\"user-select: auto; text-decoration: none; display: block; padding: 12px 0px; border-radius: 8px; background-color: rgb(224, 224, 224); color: rgb(51, 51, 51);\">2\u003c/a>\u003c/td>\n\n                            \u003c!-- 3 = Pasivo -->\n\n                            \u003c!-- CAMBIO REALIZADO AQUÍ: URL del botón actualizada -->\n\n                            \u003ctd fr-original-style=\"\" fr-original-class=\"passive\" style=\"min-width: 5px; user-select: text; border: 1px solid transparent; text-align: center; font-weight: bold; font-size: 16px; border-radius: 8px; background: unset;\">\u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=3&declaration_period={{params.period_number}}\" fr-original-style=\"\" style=\"user-select: auto; text-decoration: none; display: block; padding: 12px 0px; border-radius: 8px; background-color: rgb(179, 229, 252); color: rgb(13, 71, 161);\">3\u003c/a>\u003c/td>\n\n                            \u003c!-- 4-5 = Promotores -->\n\n                            \u003c!-- CAMBIO REALIZADO AQUÍ: URL del botón actualizada -->\n\n                            \u003ctd fr-original-style=\"\" fr-original-class=\"promoter\" style=\"min-width: 5px; user-select: text; border: 1px solid transparent; text-align: center; font-weight: bold; font-size: 16px; border-radius: 8px; background: unset;\">\u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=4&declaration_period={{params.period_number}}\" fr-original-style=\"\" style=\"user-select: auto; text-decoration: none; display: block; padding: 12px 0px; border-radius: 8px; background-color: rgb(0, 169, 224); color: rgb(255, 255, 255);\">4\u003c/a>\u003c/td>\n\n                            \u003c!-- CAMBIO REALIZADO AQUÍ: URL del botón actualizada -->\n\n                            \u003ctd fr-original-style=\"\" fr-original-class=\"promoter\" style=\"min-width: 5px; user-select: text; border: 1px solid transparent; text-align: center; font-weight: bold; font-size: 16px; border-radius: 8px; background: unset;\">\u003ca href=\"https://web.heru.app/declarations/?declaration_presented_rating=5&declaration_period={{params.period_number}}\" fr-original-style=\"\" style=\"user-select: auto; text-decoration: none; display: block; padding: 12px 0px; border-radius: 8px; background-color: rgb(0, 169, 224); color: rgb(255, 255, 255);\">5\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\n                    \u003c!-- FIN DE LA ESCALA NPS INTERACTIVA -->\n\n\n\n\u003c!-- Etiquetas de ayuda -->\n\n\u003c!-- CAMBIO REALIZADO AQUÍ: Etiquetas actualizadas a \"calidad\". -->\n\n\n\n\u003ctable role=\"presentation\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" fr-original-style=\"\" fr-original-class=\"labels-table\" style=\"border: none; border-collapse: collapse; empty-cells: show; max-width: 350px; font-size: 12px; font-family: Arial; width: 100%; margin: 0px auto; color: rgb(136, 136, 136);\">\u003ctbody>\u003ctr>\u003ctd fr-original-style=\"\" fr-original-class=\"left\" style=\"min-width: 5px; user-select: text; border: 1px solid transparent; background: unset; text-align: left;\">Mala\u003c/td>\n\n\u003ctd fr-original-style=\"\" fr-original-class=\"right\" style=\"min-width: 5px; user-select: text; border: 1px solid transparent; background: unset; text-align: right;\">Excelente\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\n\n\n\u003cdiv fr-original-style=\"\" fr-original-class=\"footer\" style=\"font-size: 14px; font-family: Arial; color: rgb(136, 136, 136); margin-top: 30px; padding: 0px 20px;\">\n\n¡Gracias por ayudarnos a que los impuestos dejen de ser un dolor de cabeza!\n\n\u003c/div>\n\n\n\n\u003c!-- INICIO DEL NUEVO FOOTER SOCIAL -->\n\n\u003c!-- CAMBIO REALIZADO AQUÍ: Se ha simplificado la estructura de la tabla del footer -->\n\n\n\n\u003ctable role=\"presentation\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" widt rés\n\n\u003c/div>\n\n\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\n\u003c!-- FIN DEL NUEVO FOOTER SOCIAL -->\n\n\u003c/div>\n\n\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\n\n\n\n\n\u003c/body>\u003c/html>"}, "1264": {"name": "01_educativo_platec", "subject": "Tienes que ver esto 👀", "htmlContent": "\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003cmeta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  \u003ctitle>El Régimen de Plataformas: Lo que debes saber - Heru\u003c/title>\n  \u003c!--[if mso]>\n  \u003cstyle type=\"text/css\">\n    body, table, td, a, span, p { font-family: Arial, sans-serif !important; }\n  \u003c/style>\n  \u003c![endif]-->\n  \u003cstyle>\n    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght=400;500;700;800&display=swap');\n\n    body, table, td, a {\n      -webkit-text-size-adjust: 100%;\n      -ms-text-size-adjust: 100%;\n    }\n\n    table, td {\n      mso-table-lspace: 0pt;\n      mso-table-rspace: 0pt;\n      border-collapse: collapse !important;\n    }\n\n    img {\n      -ms-interpolation-mode: bicubic;\n      border: 0;\n      height: auto;\n      line-height: 100%;\n      outline: none;\n      text-decoration: none;\n      display: block;\n    }\n\n    body {\n      height: 100% !important;\n      margin: 0 !important;\n      padding: 0 !important;\n      width: 100% !important;\n      background-color: #f4f7f9;\n      font-family: 'DM Sans', Helvetica, Arial, sans-serif;\n      color: #1e293b;\n    }\n\n    .main-table {\n      width: 100%;\n      max-width: 600px;\n      margin: 20px auto;\n      background-color: #ffffff;\n      border-radius: 4px;\n      overflow: hidden;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS (Paddings compactos de cabecera)\n       ========================================================================= */\n    .banner {\n      background-color: #003366;\n      padding: 10px 40px;\n    }\n\n    .chapter {\n      padding: 16px 40px 0 40px;\n      background-color: #ffffff;\n    }\n\n    .hero {\n      padding: 10px 40px 18px 40px;\n      background-color: #ffffff;\n      border-bottom: 1px solid #e2e8f0;\n    }\n\n    .content {\n      padding: 24px 40px;\n    }\n\n    /* Estilo del mosaico de aplicaciones */\n    .blog-section-title {\n      font-size: 16px;\n      font-weight: 800;\n      color: #003366;\n      margin: 28px 0 12px 0;\n      font-family: 'DM Sans', sans-serif;\n    }\n\n    .platform-card {\n      background-color: #ffffff;\n      border: 1px solid #e2e8f0;\n      border-radius: 8px;\n      padding: 12px 14px;\n      text-decoration: none;\n    }\n\n    /* =========================================================================\n       ZONA DE AJUSTES RÁPIDOS PARA MÓVIL (Facilidad de edición)\n       ========================================================================= */\n    @media screen and (max-width: 600px) {\n      .content, .hero, .chapter, .banner { \n        padding-left: 20px !important; \n        padding-right: 20px !important; \n      }\n      .main-table { \n        margin: 0 auto !important; \n        border-radius: 0 !important; \n      }\n      /* Apila las columnas del mosaico en móviles */\n      .grid-col {\n        display: block !important;\n        width: 100% !important;\n        box-sizing: border-box;\n      }\n      .grid-spacer {\n        display: block !important;\n        height: 10px !important;\n        width: 100% !important;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\n\u003cbody>\n  \u003cdiv style=\"background-color: #f4f7f9; padding: 10px 0;\">\n    \u003ctable class=\"main-table\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n\n      \u003c!-- Banner azul marino -->\n      \u003ctr>\n        \u003ctd class=\"banner\">\n          \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            \u003ctr>\n              \u003ctd align=\"left\">\n                \u003cimg src=\"https://img.mailinblue.com/2760736/images/content_library/original/6a0e028c17d8dcd74a550ebc.jpg\" alt=\"heru\" width=\"70\" style=\"display: block;\">\n              \u003c/td>\n              \u003ctd align=\"right\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; color: #94a3b8;\">2 min de lectura\u003c/td>\n            \u003c/tr>\n          \u003c/table>\n        \u003c/td>\n      \u003c/tr>\n\n      \u003c!-- Chapter -->\n      \u003ctr>\n        \u003ctd class=\"chapter\">\n          \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n            \u003ctr>\n              \u003ctd valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 44px; font-weight: 800; color: #0091ff; line-height: 1; padding-right: 14px;\">01\u003c/td>\n              \u003ctd valign=\"bottom\" style=\"font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #003366; padding-bottom: 4px;\">EDUCATIVO\u003c/td>\n            \u003c/tr>\n          \u003c/table>\n        \u003c/td>\n      \u003c/tr>\n\n      \u003c!-- Hero -->\n      \u003ctr>\n        \u003ctd class=\"hero\">\n          \u003ch1 style=\"margin: 6px 0 0 0; font-size: 25px; line-height: 1.25; font-weight: 700; font-family: 'DM Sans', sans-serif; color: #003366;\">\n            El Régimen de Plataformas\n          \u003c/h1>\n          \u003cp style=\"margin: 8px 0 0 0; font-size: 15px; color: #475569; line-height: 1.45; font-family: 'DM Sans', sans-serif;\">\n            Entender tus impuestos es más sencillo de lo que crees.\n          \u003c/p>\n        \u003c/td>\n      \u003c/tr>\n\n      \u003c!-- Body -->\n      \u003ctr>\n        \u003ctd class=\"content\">\n\n          \u003c!-- Saludo Dinámico Horizontal (A prueba de Laptop y Móvil) -->\n          \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin: 0 0 12px 0;\">\n            \u003ctr>\n              \u003ctd style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 4px;\">Hola\u003c/td>\n              \u003ctd style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap; padding-right: 1px;\">{{ params.first_name|default:\"👋🏼\" }}\u003c/td>\n              \u003ctd style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; color: #475569; white-space: nowrap;\">,\u003c/td>\n            \u003c/tr>\n          \u003c/table>\n\n          \u003c!-- Párrafo Único Conceptual de Plataformas -->\n          \u003cp style=\"color: #475569; font-size: 15px; margin: 0 0 16px 0; line-height: 1.6; font-family: 'DM Sans', sans-serif;\">\n            En este camino hay algo seguro: \u003cstrong>la app te va a retener impuestos sí o sí\u003c/strong>. La verdadera diferencia es qué decides hacer con esa retención: si la dejas como tu \u003cstrong>Pago Definitivo\u003c/strong> para simplificar tus declaraciones mensuales al máximo, o como un \u003cstrong>Pago Provisional\u003c/strong> para declarar tus gastos de trabajo mes con mes y pagar menos (o hasta recuperar saldo a favor).\n          \u003c/p>\n\n          \u003c!-- Párrafo de Transición / Invitación -->\n          \u003cp style=\"color: #475569; font-size: 15px; margin: 0 0 24px 0; line-height: 1.6; font-family: 'DM Sans', sans-serif;\">\n            Para que no andes batallando, mapeamos las principales aplicaciones. Aquí tienes las guías de cada una para entender cómo funcionan sus retenciones y llevar tus impuestos al día de la forma más fácil:\n          \u003c/p>\n\n          \u003c!-- Bloque de Mosaico (Fila 1: Uber & DiDi) -->\n          \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 10px;\">\n            \u003ctr>\n              \u003ctd class=\"grid-col\" width=\"49%\" valign=\"top\">\n                \u003ca href=\"https://www.heru.app/blog/impuestos-uber-mexico/\" class=\"platform-card\" style=\"display: block;\">\n                  \u003cspan style=\"font-size: 14px; font-weight: 700; color: #003366; font-family: 'DM Sans', sans-serif;\">🚗 Uber\u003c/span>\n                  \u003cdiv style=\"font-size: 11.5px; color: #475569; line-height: 1.4; margin-top: 4px; font-family: 'DM Sans', sans-serif;\">\n                    Todo sobre retenciones y declaraciones para conductores de Uber.\n                  \u003c/div>\n                \u003c/a>\n              \u003c/td>\n              \u003ctd class=\"grid-spacer\" width=\"2%\">&nbsp;\u003c/td>\n              \u003ctd class=\"grid-col\" width=\"49%\" valign=\"top\">\n                \u003ca href=\"https://www.heru.app/blog/impuestos-didi-mexico-2025/\" class=\"platform-card\" style=\"display: block;\">\n                  \u003cspan style=\"font-size: 14px; font-weight: 700; color: #003366; font-family: 'DM Sans', sans-serif;\">🚙 DiDi Express y Food\u003c/span>\n                  \u003cdiv style=\"font-size: 11.5px; color: #475569; line-height: 1.4; margin-top: 4px; font-family: 'DM Sans', sans-serif;\">\n                    Cómo declarar tus ingresos de DiDi de forma correcta.\n                  \u003c/div>\n                \u003c/a>\n              \u003c/td>\n            \u003c/tr>\n          \u003c/table>\n\n          \u003c!-- Bloque de Mosaico (Fila 2: Rappi & Mercado Libre) -->\n          \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 10px;\">\n            \u003ctr>\n              \u003ctd class=\"grid-col\" width=\"49%\" valign=\"top\">\n                \u003ca href=\"https://www.heru.app/blog/impuestos-rappi-mexico-2025/\" class=\"platform-card\" style=\"display: block;\">\n                  \u003cspan style=\"font-size: 14px; font-weight: 700; color: #003366; font-family: 'DM Sans', sans-serif;\">🚲 Rappitenderos\u003c/span>\n                  \u003cdiv style=\"font-size: 11.5px; color: #475569; line-height: 1.4; margin-top: 4px; font-family: 'DM Sans', sans-serif;\">\n                    La guía definitiva de impuestos para repartidores en Rappi.\n                  \u003c/div>\n                \u003c/a>\n              \u003c/td>\n              \u003ctd class=\"grid-spacer\" width=\"2%\">&nbsp;\u003c/td>\n              \u003ctd class=\"grid-col\" width=\"49%\" valign=\"top\">\n                \u003ca href=\"https://www.heru.app/blog/impuestos-mercado-libre-vendedores-2025/\" class=\"platform-card\" style=\"display: block;\">\n                  \u003cspan style=\"font-size: 14px; font-weight: 700; color: #003366; font-family: 'DM Sans', sans-serif;\">📦 Mercado Libre\u003c/span>\n                  \u003cdiv style=\"font-size: 11.5px; color: #475569; line-height: 1.4; margin-top: 4px; font-family: 'DM Sans', sans-serif;\">\n                    Evita retenciones excesivas al vender en Mercado Libre.\n                  \u003c/div>\n                \u003c/a>\n              \u003c/td>\n            \u003c/tr>\n          \u003c/table>\n\n          \u003c!-- Bloque de Mosaico (Fila 3: Mercado Envíos & Zubale) -->\n          \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-bottom: 24px;\">\n            \u003ctr>\n              \u003ctd class=\"grid-col\" width=\"49%\" valign=\"top\">\n                \u003ca href=\"https://www.heru.app/blog/impuestos-mercado-envios-2025/\" class=\"platform-card\" style=\"display: block;\">\n                  \u003cspan style=\"font-size: 14px; font-weight: 700; color: #003366; font-family: 'DM Sans', sans-serif;\">🚚 Mercado Envíos\u003c/span>\n                  \u003cdiv style=\"font-size: 11.5px; color: #475569; line-height: 1.4; margin-top: 4px; font-family: 'DM Sans', sans-serif;\">\n                    Guía de obligaciones fiscales para repartidores independientes.\n                  \u003c/div>\n                \u003c/a>\n              \u003c/td>\n              \u003ctd class=\"grid-spacer\" width=\"2%\">&nbsp;\u003c/td>\n              \u003ctd class=\"grid-col\" width=\"49%\" valign=\"top\">\n                \u003ca href=\"https://www.heru.app/blog/impuestos-zubale-2025/\" class=\"platform-card\" style=\"display: block;\">\n                  \u003cspan style=\"font-size: 14px; font-weight: 700; color: #003366; font-family: 'DM Sans', sans-serif;\">📱 Zubale\u003c/span>\n                  \u003cdiv style=\"font-size: 11.5px; color: #475569; line-height: 1.4; margin-top: 4px; font-family: 'DM Sans', sans-serif;\">\n                    Cómo declarar tus misiones y tareas completadas en Zubale.\n                  \u003c/div>\n                \u003c/a>\n              \u003c/td>\n            \u003c/tr>\n          \u003c/table>\n\n          \u003c!-- Nota de cierre para otras plataformas -->\n          \u003cp style=\"color: #475569; font-size: 14px; margin: 24px 0 0 0; line-height: 1.6; font-family: 'DM Sans', sans-serif; text-align: center;\">\n            ¿No ves tu aplicación en la lista? No te preocupes, puedes consultar nuestra \u003ca href=\"https://www.heru.app/blog/como-calcular-impuesto-plataformas-tecnologicas-2025/\" style=\"color: #0091ff; text-decoration: none; font-weight: 700;\">Guía General de Plataformas Tecnológicas →\u003c/a> donde te explicamos a fondo las reglas aplicables para todos los servicios digitales.\n          \u003c/p>\n\n          \u003c!-- Footer -->\n          \u003cdiv style=\"text-align: center; margin-top: 30px;\">\n           \n            \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\" style=\"margin: 0 auto;\">\n              \u003ctr>\n                \u003ctd style=\"padding: 0 8px;\">\u003ca href=\"https://instagram.com/somosheru\" target=\"_blank\">\u003cimg src=\"https://cdn-icons-png.flaticon.com/512/174/174855.png\" alt=\"Instagram\" width=\"22\" height=\"22\">\u003c/a>\u003c/td>\n                \u003ctd styl style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #64748b; margin-bottom: 24px;\">impuestos sin estrés\u003c/div>\n                        \n                        \u003cdiv style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 12px; color: #64748b; line-height: 1.6; max-width: 480px; margin: 0 auto 20px auto;\">\n                            Recibiste este correo de seguridad porque tu dirección está vinculada a una cuenta de heru.\n                        \u003c/div>\n                        \n                        \u003cdiv style=\"text-align: center; margin-top: 20px;\">\n                            \u003ca href=\"#\" style=\"font-family: 'Helvetica', Arial, sans-serif; font-size: 13px; color: #64748b; text-decoration: underline;\">Desuscribirse\u003c/a>\n                        \u003c/div>\n                    \u003c/td>\n                \u003c/tr>\n            \u003c/tbody>\n        \u003c/table>\n    \u003c/div>\n\n\u003c/body>\n\u003c/html>"}, "1182": {"name": "Terminar Carrito 2", "subject": "¿Seguimos? Tu plan heru está listo para activarse", "htmlContent": "\u003c!doctype html>\n\u003chtml lang=\"es\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:v=\"urn:schemas-microsoft-com:vml\">\n\u003chead>\n  \u003ctitle>\u003c/title>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\" />\n  \u003cmeta name=\"x-apple-disable-message-reformatting\" />\n  \u003cstyle type=\"text/css\">\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: 'Helvetica', Arial, sans-serif; }\n    @media only screen and (max-width: 480px) {\n      .container { width: 100% !important; }\n      .content-padding { padding-left eight: bold; color: #2d3748; display: block;\">Equipo heru.\u003c/span>\n                \u003c/td>\u003c/tr>\u003c/tbody>\n              \u003c/table>\n\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- FOOTER -->\n          \u003ctr>\n            \u003ctd style=\"padding: 15px 25px 25px 25px; border-top: 1px solid #edf2f7; font-family: 'Helvetica', Arial, sans-serif; font-size: 11px; color: #a0aec0; line-height: 1.4;\">\n              Mensaje automático · No es necesario responder.\u003cbr />\n              Si ya completaste tu compra, ignora este mensaje.\n            \u003c/td>\n          \u003c/tr>\n\n        \u003c/tbody>\n      \u003c/table>\n      \u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>\n\u003c/body>\n\u003c/html>"}, "1228": {"name": "churns_semana_9", "subject": "ÚLTIMA SEMANA: 90% off, no se repite", "htmlContent": "\n\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  \u003ctitle>ÚLTIMA SEMANA: 90% off, no se repite\u003c/title>\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap\" rel=\"stylesheet\" />\n  \u003c!--[if mso]>\n  \u003cstyle type=\"text/css\">\n    body, table, td, a, p, span, h1, h2, div { font-family: Arial, Helvetica, sans-serif !important; }\n  \u003c/style>\n  \u003c![endif]-->\n  \u003cstyle>\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }\n    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }\n    body {\n      height: 100% !important;\n      margin: 0 !important;\n      padding: 0 !important;\n      width: 100% !important;\n      background-color: #f8fafc;\n      font-family: 'Helvetica', Arial, sans-serif;\n      color: #1e293b;\n    }\n    h1, h2, .font-lexend { font-family: 'Lexend', sans-serif !important; }\n    @media screen and (max-width: 600px) {\n      .mobile-pad { padding: 30px 20px !important; }\n      .hero-title { font-size: 24px !important; }\n      .discount-text { font-size: 28px !important; }\n      .coupon-text { font-size: 26px !important; letter-spacing: 3px !important; }\n      .coupon-table { width: 90% !important; }\n      .plan-cell { display: block !important; width: 100% !important; padding-bottom: 15px !important; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody style=\"background-color: #f8fafc; margin: 0; padding: 0;\">\n\n  \u003c!-- Preheader (texto de preview en bandeja) -->\n  \u003cdiv style=\"display: none; max-height: 0; overflow: hidden; mso-hide: all;\">\n    Última semana — tu cupón VUELVE90 con 90% off se acaba pronto.\n  \u003c/div>\n\n  \u003ctable width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" bgcolor=\"#f8fafc\">\n    \u003ctr>\n      \u003ctd align=\"center\" style=\"padding: 20px 10px;\">\n        \u003ctable width=\"100%\" style=\"max-width: 600px; background-color: #ffffff; border-radius: 32px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);\">\n\n          \u003c!-- Header con logo -->\n          \u003ctr>\n            \u003ctd align=\"left\" style=\"padding: 32px 40px; border-bottom: 1px solid #f1f5f9;\">\n              \u003cimg src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru — impuestos sin estrés\" width=\"75\" />\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Hero Greeting -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" align=\"left\" style=\"padding: 45px 40px 10px 40px;\">\n              \u003ch1 class=\"font-lexend hero-title\" style=\"margin: 0; font-size: 26px; font-weight: 700; color: #0f172a; line-height: 1.2;\">\n                Última semana, {{ params.FIRST_NAME }} ⏳\n              \u003c/h1>\n              \u003cp style=\"margin-top: 15px; font-size: 14px; line-height: 1.6; color: #475569;\">\n                Esta es la última semana que podemos ofrecerte un beneficio así. Después esta campaña se cierra y este tipo de descuento no se repite. Es tu última oportunidad para regresar a heru con 90% off:\n              \u003c/p>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Discount Card -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" style=\"padding: 10px 40px 30px 40px;\">\n              \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #fef2f2; border: 1.5px solid #fecaca; border-radius: 24px; text-align: center; padding: 35px 30px;\">\n                \u003ctr>\n                  \u003ctd>\n                    \u003ctable align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #ffffff; border-radius: 8px; padding: 4px 12px; margin-bottom: 12px;\">\n                      \u003ctr>\n                        \u003ctd class=\"font-lexend\" style=\"font-size: 10px; font-weight: 700; color: #dc2626; text-transform: uppercase; letter-spacing: 1.5px;\">\n                          Beneficio Exclusivo ✨\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table>\n                    \u003ch2 class=\"font-lexend discount-text\" style=\"margin: 0; font-size: 32px; color: #991b1b; line-height: 1.2; font-weight: 700;\">\n                      90% OFF\n                    \u003c/h2>\n                  \u003c/td>\n                \u003c/tr>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Instruction Text -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" align=\"left\" style=\"padding: 0 40px 30px 40px;\">\n              \u003cp style=\"margin-bottom: 25px; font-size: 14px; line-height: 1.6; color: #475569;\">\n                Este cupón es válido para el servicio que tú elijas: desde tu \u003cstrong>Declaración Anual\u003c/strong>, \u003cstrong>declaración mensual\u003c/strong>, hasta \u003cstrong>regularizar meses anteriores\u003c/strong>. Solo aplica el código al momento de tu compra:\n              \u003c/p>\n\n              \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n                \u003ctr>\n                  \u003ctd class=\"plan-cell\" width=\"31%\" align=\"center\" style=\"background-color: #ffffff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);\">\n                    \u003cdiv style=\"font-size: 20px; margin-bottom: 5px;\">📅\u003c/div>\n                    \u003cp class=\"font-lexend\" style=\"margin: 0; font-size: 10px; font-weight: 700; color: #1e293b; text-transform: uppercase;\">Anual\u003c/p>\n                  \u003c/td>\n                  \u003ctd width=\"3%\">&nbsp;\u003c/td>\n                  \u003ctd class=\"plan-cell\" width=\"31%\" align=\"center\" style=\"background-color: #ffffff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);\">\n                    \u003cdiv style=\"font-size: 20px; margin-bottom: 5px;\">✅\u003c/div>\n                    \u003cp class=\"font-lexend\" style=\"margin: 0; font-size: 10px; font-weight: 700; color: #1e293b; text-transform: uppercase;\">Mensual\u003c/p>\n                  \u003c/td>\n                  \u003ctd width=\"3%\">&nbsp;\u003c/td>\n                  \u003ctd class=\"plan-cell\" width=\"31%\" align=\"center\" style=\"background-color: #ffffff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);\">\n                    \u003cdiv style=\"font-size: 20px; margin-bottom: 5px;\">🔴\u003c/div>\n                    \u003cp class=\"font-lexend\" style=\"margin: 0; font-size: 10px; font-weight: 700; color: #1e293b; text-transform: uppercase;\">Pendientes\u003c/p>\n                  \u003c/td>\n                \u003c/tr>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n\n          \u003c!-- Coupon & CTA Section -->\n          \u003ctr>\n            \u003ctd class=\"mobile-pad\" align=\"center\" style=\"padding: 0 40px 40px 40px;\">\n\n              \u003c!-- Ticket-Style Coupon Block -->\n              \u003ctable class=\"coupon-table\" width=\"75%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"background-color: #f0f9ff; border: 2px dashed #0091ff; border-radius: 16px; margin-bottom: 35px;\">\n                \u003ctr>\n                  \u003ctd align=\"center\" style=\"padding: 35px 20px;\">\n                    \u003cp class=\"font-lexend\" style=\"margin: 0 0 15px 0; font-size: 11px; letter-spacing: 2.5px; font-weight: 700; color: #0076cf; text-transform: uppercase; line-height: 1;\">\n                      Cupón:\n                    \u003c/p>\n\n                    \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\">\n                      \u003ctr>\n                        \u003ctd style=\"padding-right: 12px; vertical-align: middle;\">\n                          \u003cimg src=\"https://img.icons8.com/ios-filled/24/0091ff/ticket.png\" width=\"22\" alt=\"\" style=\"display: block;\" />\n                        \u003c/td>\n                        \u003ctd style=\"vertical-align: middle;\">\n                          \u003ch2 class=\"font-lexend coupon-text\" style=\"margin: 0; font-size: 32px; color: #1e293b; letter-spacing: 5px; font-weight: 700; line-height: 1;\">\n                            VUELVE90\n                          \u003c/h2>\n                        \u003c/td>\n                      \u003c/tr>\n                    \u003c/table          \u003ctd style=\"padding: 0 10px;\">\u003ca href=\"https://facebook.com/heru\" target=\"_blank\">\u003cimg src=\"https://img.icons8.com/material-rounded/24/94a3b8/facebook-new.png\" width=\"18\" alt=\"Facebook\">\u003c/a>\u003c/td>\n                  \u003ctd style=\"padding: 0 10px;\">\u003ca href=\"https://instagram.com/heru\" target=\"_blank\">\u003cimg src=\"https://img.icons8.com/material-rounded/24/94a3b8/instagram-new.png\" width=\"18\" alt=\"Instagram\">\u003c/a>\u003c/td>\n                  \u003ctd style=\"padding: 0 10px;\">\u003ca href=\"https://linkedin.com/company/heru\" target=\"_blank\">\u003cimg src=\"https://img.icons8.com/material-rounded/24/94a3b8/linkedin.png\" width=\"18\" alt=\"LinkedIn\">\u003c/a>\u003c/td>\n                \u003c/tr>\n              \u003c/table>\n              \u003cp style=\"margin: 20px 0 0 0; font-size: 11px; font-weight: 700; color: #94a3b8; font-family: 'Lexend', sans-serif; text-transform: uppercase; letter-spacing: 1px;\">Equipo heru\u003c/p>\n              \u003cp style=\"margin: 4px 0 0 0; font-size: 11px; color: #cbd5e1;\">Impuestos sin estrés\u003c/p>\n              \u003cp style=\"margin: 16px 0 0 0; font-size: 10px; color: #cbd5e1;\">\n                ¿Ya no quieres recibir estos correos? \u003ca href=\"{{ unsubscribe }}\" style=\"color: #94a3b8; text-decoration: underline;\">Date de baja aquí\u003c/a>\n              \u003c/p>\n            \u003c/td>\n          \u003c/tr>\n        \u003c/table>\n      \u003c/td>\n    \u003c/tr>\n  \u003c/table>\n\u003c/body>\n\u003c/html>\n"}, "1245": {"name": "bienvenida_heru1", "subject": "Qué bueno tenerte aquí, {{ params.first_name }}", "htmlContent": "\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003cmeta name=\"x-apple-disable-message-reformatting\">\n\u003ctitle>Un paso más cerca de quitarte el estrés fiscal\u003c/title>\n\u003cstyle>\n  body { margin: 0; padding: 0; background-color: #f5f5f3; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }\n  table { border-collapse: collapse; }\n  img { display: block; border: 0; outline: none; text-decoration: none; max-width: 100%; }\n  a { text-decoration: none; }\n  .preheader { display: none; max-height: 0; overflow: hidden; mso-hide: all; opacity: 0; }\n\n  /* Container */\n  .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; }\n\n  /* Header bar */\n  .slogan { font-size: 11px; color: #003366; font-weight: 500; }\n\n  /* Banner */\n  .banner-title { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; color: #ffffff; }\n  .banner-subtitle { margin: 14px 0 0 0; font-size: 15px; line-height: 1.5; opacity: 0.9; color: #ffffff; }\n\n  /* Body */\n  .body-text { font-size: 16px; color: #1a1a1a; line-height: 1.6; margin: 0; }\n  .body-muted { font-size: 14px; color: #777777; line-height: 1.5; margin: 0; }\n\n  /* Video card */\n  .video-card { background-color: #f8f8f6; border: 1px solid #e8e8e6; border-radius: 12px; overflow: hidden; }\n  .video-label { font-size: 14px; font-weight: 600; color: #003366; padding: 16px 20px; margin: 0; text-align: center; }\n  .play-circle { width: 64px; height: 64px; background-color: #003366; border-radius: 50%; text-align: center; line-height: 64px; font-size: 22px; color: #ffffff; }\n\n  /* CTA */\n  .cta-button { display: inline-block; background-color: #003366; color: #ffffff !important; padding: 16px 44px; border-radius: 8px; font-size: 16px; font-weight: 600; text-decoration: none; }\n\n  /* Footer */\n  .footer-bg { background-color: #fafafa; }\n  .footer-text { font-size: 12px; color: #888888; line-height: 1.5; margin: 0; text-align: center; }\n  .footer-brand { font-size: 14px; font-weight: 700; color: #003366; margin: 0; text-align: center; letter-spacing: -0.3px; }\n\n  @media only screen and (max-width: 600px) {\n    .container { width: 100% !important; }\n    .header-pad { padding-left: 24px !important; padding-right: 24px !important; }\n    .banner-pad { padding: 16px 24px !important; }\n    .banner-title { font-size: 18px !important; }\n    .banner-subtitle { font-size: 12px !important; }\n    .slogan { font-size: 8px !important; }\n    .px-mobile { padding-left: 24px !important; padding-right: 24px !important; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cspan class=\"preheader\">Vincula tu RFC y deja de navegar a ciegas con tus finanzas.\u003c/span>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\n    \u003ctd align=\"center\" style=\"padding: 24px 12px;\">\n\n      \u003ctable role=\"presentation\" class=\"container\" width=\"600\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\n        \u003c!-- =================== HEADER =================== -->\n        \u003ctr>\n          \u003ctd class=\"header-pad\" style=\"padding: 24px 36px; background-color: #ffffff;\">\n            \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              \u003ctr>\n                \u003ctd align=\"left\">\n                  \u003cimg src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru\" width=\"72\" />\n                \u003c/td>\n                \u003ctd align=\"right\" class=\"slogan\" style=\"font-size: 11px; color: #94a3b8; font-weight: 500;\">\n                  Tus impuestos sin estrés\n                \u003c/td>\n              \u003c/tr>\n            \u003c/table>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- =================== BANNER azul (mismo color en todos) =================== -->\n        \u003ctr>\n          \u003ctd class=\"banner-pad\" style=\"background-color: #003366; padding: 20px 36px; color: #ffffff;\">\n            \u003cp style=\"margin: 0 0 12px 0; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; opacity: 0.75; color: #ffffff;\">\n              Bienvenido a heru\n            \u003c/p>\n            \u003ch1 class=\"banner-title\" style=\"margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; color: #ffffff;\">\n              Un paso más cerca de quitarte el estrés fiscal\n            \u003c/h1>\n            \u003cp class=\"banner-subtitle\" style=\"margin: 14px 0 0 0; font-size: 15px; line-height: 1.5; opacity: 0.9; color: #ffffff;\">\n              Vincula tu RFC y deja de navegar a ciegas con tus finanzas fiscales.\n            \u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- =================== BODY =================== -->\n        \u003ctr>\n          \u003ctd style=\"padding: 40px 40px 16px;\" class=\"px-mobile\">\n            \u003cp class=\"body-text\">¡Hola{% if params.first_name %}, \u003cstrong>{{ params.first_name }}\u003c/strong>{% endif %}!\u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003ctr>\n          \u003ctd style=\"padding: 8px 40px 24px;\" class=\"px-mobile\">\n            \u003cp class=\"body-text\">Para empezar a usar heru necesitas conectar tu cuenta del SAT. Es rápido, seguro y solo lo haces \u003cstrong>una vez\u003c/strong>.\u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- =================== VIDEO CARD =================== -->\n        \u003ctr>\n          \u003ctd style=\"padding: 0px 40px 32px;\" class=\"px-mobile\">\n            \u003ca href=\"https://www.youtube.com/watch?v=bc-CH-nXI24\" target=\"_blank\" style=\"text-decoration: none; color: inherit;\">\n              \u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"video-card\" style=\"background-color: #f8f8f6; border: 1px solid #e8e8e6; border-radius: 12px; overflow: hidden;\">\n\n                \u003ctr>\n                  \u003ctd style=\"position: relative; padding: 0; background-color: #1e3a8a;\" align= on\" target=\"_blank\">Vincular mi RFC\u003c/a>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- =================== POSTSCRIPT =================== -->\n        \u003ctr>\n          \u003ctd style=\"padding: 0 40px 40px;\" class=\"px-mobile\">\n            \u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n              \u003ctr>\u003ctd style=\"border-top: 1px solid #e8e8e6; height: 1px; line-height: 1px; font-size: 1px;\">&nbsp;\u003c/td>\u003c/tr>\n            \u003c/table>\n            \u003cp class=\"body-muted\" style=\"margin-top: 24px;\">\n              \u003cstrong style=\"color: #003366;\">PD:\u003c/strong> también puedes revisar \u003ca href=\"https://web.heru.app/plans\" target=\"_blank\" style=\"color: #003366; font-weight: 600;\">nuestros planes\u003c/a> mientras tanto.\n            \u003c/p>\n            \u003cp class=\"body-muted\" style=\"margin-top: 20px;\">— Equipo heru\u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- =================== FOOTER =================== -->\n        \u003ctr>\n          \u003ctd class=\"footer-bg\" style=\"background-color: #fafafa; padding: 28px 40px 16px;\" class=\"px-mobile\">\n            \u003cp class=\"footer-brand\">heru\u003c/p>\n            \u003cp class=\"footer-text\" style=\"margin-top: 4px;\">impuestos sin estrés\u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003ctr>\n          \u003ctd class=\"footer-bg\" style=\"background-color: #fafafa; padding: 0 40px 28px;\" class=\"px-mobile\">\n            \u003cp class=\"footer-text\">Recibiste este correo porque te registraste en heru para liberarte del estrés de cumplir con tus impuestos.\u003c/p>\n            \u003cp class=\"footer-text\" style=\"margin-top: 12px;\">\n              \u003ca href=\"{{ unsubscribe }}\" style=\"color: #888888; text-decoration: underline;\">Desuscribirse\u003c/a>\n            \u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n font-weight: bold; color: #2d3748; display: block;\">Equipo heru.\u003c/span>\n                \u003c/td>\u003c/tr>\u003c/tbody>\n              \u003c/table>\n            \u003c/td>\n          \u003c/tr>\n          \u003c!-- FOOTER -->\n          \u003ctr>\n            \u003ctd style=\"padding: 15px 25px 25px 25px; border-top: 1px solid #edf2f7; font-family: 'Helvetica', Arial, sans-serif; font-size: 11px; color: #a0aec0; line-height: 1.4;\">\n              Mensaje automático · No es necesario responder.\u003cbr />\n              Si ya completaste tu compra, ignora este mensaje.\n            \u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>\n\u003c/body>\n\u003c/html>"}, "1253": {"name": "Vinculacion_exitosa_heru", "subject": "Tu perfil fiscal esta listo ✅", "htmlContent": "\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003cmeta name=\"x-apple-disable-message-reformatting\">\n\u003ctitle>¡Perfil 100% Completado!\u003c/title>\n\u003cstyle>\n  /* CONFIGURACIÓN GENERAL */\n  body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }\n  table { border-collapse: collapse; }\n  img { display: block; border: 0; outline: none; text-decoration: none; max-width: 100%; }\n  a { text-decoration: none; }\n  .preheader { display: none; max-height: 0; overflow: hidden; mso-hide: all; opacity: 0; }\n\n  /* ESTILOS DE LA MARCA */\n  .bg-heru { background-color: #003366 !important; }\n  .text-heru { color: #003366 !important; }\n\n  .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; }\n  .slogan { font-size: 11px; color: #94a3b8; font-weight: 500; }\n  \n  /* JERARQUÍA DE TEXTO EN EL BANNER */\n  .banner-tag { margin: 0 0 10px 0; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; opacity: 0.75; color: #ffffff; }\n  .banner-title { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; color: #ffffff; }\n  .banner-subtitle { margin: 12px 0 0 0; font-size: 15px; line-height: 1.5; opacity: 0.9; color: #ffffff; }\n  \n  .body-text { font-size: 16px; color: #334155; line-height: 1.6; margin: 0; }\n  .body-muted { font-size: 14px; color: #777777; line-height: 1.5; margin: 0; }\n  \n  /* ESTILOS DE LISTA DE BENEFICIOS (CHECKLIST) */\n  .check-item { background-color: #f8fafc; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #0ea5e9; }\n  .check-icon { font-size: 18px; color: #0ea5e9; font-weight: bold; margin-right: 12px; }\n  .check-text { font-size: 14px; font-weight: 600; color: #1e293b; vertical-align: middle; }\n\n  .cta-button { display: inline-block; background-color: #003366; color: #ffffff !important; padding: 16px 40px; border-radius: 50px; font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 6px rgba(0,51,102,0.2); }\n\n  @media only screen and (max-width: 600px) {\n    .container { width: 100% !important; border-radius: 0; }\n    .header-pad { padding: 20px 24px !important; }\n    .banner-pad { padding: 28px 24px !important; }\n    .banner-title { font-size: 22px !important; }\n    .px-mobile { padding-left: 24px !important; padding-right: 24px !important; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cspan class=\"preheader\">¡Felicidades! Tus credenciales del SAT ya están vinculadas en Heru.\u003c/span>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\n    \u003ctd align=\"center\" style=\"padding: 40px 12px;\">\n\n      \u003ctable role=\"presentation\" class=\"container\" width=\"600\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\n        \u003c!-- HEADER -->\n        \u003ctr>\n          \u003ctd class=\"header-pad\" style=\"padding: 24px 36px; background-color: #ffffff;\">\n            \u003ctable width=\"100%\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n              \u003ctr>\n                \u003ctd align=\"left\">\n                  \u003cimg src=\"https://img.mailinblue.com/2760736/images/content_library/original/69a0de445fdc3453305bcd9a.png\" alt=\"heru\" width=\"72\" />\n                \u003c/td>\n                \u003ctd align=\"right\" class=\"slogan\">\n                  Tus impuestos sin estrés\n                \u003c/td>\n              \u003c/tr>\n            \u003c/table>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- BANNER AZUL -->\n        \u003ctr>\n          \u003ctd class=\"banner-pad bg-heru\" style=\"padding: 28px 36px; color: #ffffff;\">\n            \u003cp class=\"banner-tag\">Actualización de estado\u003c/p>\n            \u003ch1 class=\"banner-title\">Tu perfil está 100% completado\u003c/h1>\n            \u003cp class=\"banner-subtitle\">Has tomado el control total de tus impuestos con heru.\u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- CUERPO DEL MENSAJE (3 LÍNEAS SEPARADAS) -->\n        \u003ctr>\n          \u003ctd style=\"padding: 40px 40px 16px;\" class=\"px-mobile\">\n            \u003cp class=\"body-text\">Hola 👋 \u003c/p>\n          \u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd style=\"padding: 0 40px 16px;\" class=\"px-mobile\">\n            \u003cp class=\"body-text\">¡Lo lograste! Tus \u003cstrong>credenciales del SAT\u003c/strong> ya están vinculadas de forma segura en nuestro sistema.\u003c/p>\n          \u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd style=\"padding: 0 40px 32px;\" class=\"px-mobile\">\n            \u003cp class=\"body-text\">Gracias a esto, has desbloqueado las herramientas necesarias para que dejes de navegar a ciegas y comiences a disfrutar de una vida fiscal sin estrés.\u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- CHECKLIST -->\n        \u003ctr>\n          \u003ctd style=\"padding: 0 40px 32px;\" class=\"px-mobile\">\n            \u003cp style=\"font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;\">Funcionalidades desbloqueadas:\u003c/p>\n            \u003cdiv class=\"check-item\">\u003cspan class=\"check-icon\">✓\u003c/span> \u003cspan class=\"check-text\">Descarga de Opinión y Constancia Fiscal\u003c/span>\u003c/div>\n            \u003cdiv class=\"check-item\">\u003cspan class=\"check-icon\">✓\u003c/span> \u003cspan class=\"check-text\">Visualización de Facturas y Retenciones\u003c/span>\u003c/div>\n            \u003cdiv class=\"check-item\" style=\"margin-bottom: 0;\">\u003cspan class=\"check-icon\">✓\u003c/span> \u003cspan class=\"check-text\">Generación de facturas a tus clientes\u003c/span>\u003c/div>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- CTA -->\n        \u003ctr>\n          \u003ctd align=\"center\" style=\"padding: 0 40px 48px;\" class=\"px-mobile\">\n            \u003ca href=\"https://web.heru.app/\" class=\"cta-button\">Ir a mi plataforma\u003c/a>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- CIERRE CON SEPARADOR -->\n        \u003ctr>\n          \u003ctd style=\"padding: 0 40px 40px;\" class=\"px-mobile\">\n            \u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n              \u003ctr>\u003ctd style=\"border-top: 1px solid #e8e8e6; height: 1px; line-height: 1px; font-size: 1px;\">&nbsp;\u003c/td>\u003c/tr>\n            \u003c/table>\n            \n            \u003cp class=\"body-muted\" style=\"margin-top: 24px; text-align: left;\">\n              Gracias por confiar en heru para simplificar tu vida fiscal.\u003cbr>\u003cbr>\n              — Equipo heru\n            \u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n        \u003c!-- FOOTER (FORMATO ORIGINAL SOLICITADO) -->\n        \u003ctr>\n          \u003ctd style=\"background-color: #fafafa; padding: 32px 40px 28px;\" class=\"px-mobile\" align=\"center\">\n            \u003cp style=\"font-size: 14px; font-weight: 700; color: #003366; margin: 0;\">heru\u003c/p>\n            \u003cp style=\"font-size: 12px; color: #888888; margin: 4px 0 20px;\">impuestos sin estrés\u003c/p>\n            \n            \u003cp style=\"font-size: 12px; color: #888888; line-height: 1.5; margin: 0; max-width: 420px; text-align: center;\">\n              Recibiste este correo porque te registraste en heru para liberarte del estrés de cumplir con tus impuestos.\n            \u003c/p>\n            \n            \u003cp style=\"margin-top: 16px;\">\n              \u003ca href=\"{{ unsubscribe }}\" style=\"font-size: 12px; color: #888888; text-decoration: underline;\">Desuscribirse\u003c/a>\n            \u003c/p>\n          \u003c/td>\n        \u003c/tr>\n\n      \u003c/table>\n\n    \u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n\u003c/body>\n\u003c/html>"}, "1224": {"name": "churns_semana_5", "subject": "Tu beneficio de mitad de camino: 50% off", "htmlContent": "\n\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  \u003ctitle>Tu beneficio de mitad de camino: 50% off\u003c/title>\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap\" rel=\"stylesheet\" />\n  \u003c!--[if mso]>\n  \u003cstyle type=\"text/css\">\n    body, table, td, a, p, span, h1, h2, div { font-family: Arial, Helvetica, sans-serif !important; }\n  \u003c/style>\n  \u003c![endif]-->\n  \u003cstyle>\n    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n    tab
